obligations:
  - id: api.openapi.operation-parity
    source: bbc-api:TimeAddressableMediaStore.yaml
    requirement: Runtime OpenAPI keeps BBC TAMS path and operation parity.
    tests:
      - tests/adapters/bbc/test_openapi_contract.py::test_runtime_openapi_has_bbc_operation_parity

  - id: service.metadata.timeouts
    source: bbc-adr:0044-signalling-timeouts
    requirement: Service metadata advertises object and presigned URL timeout contracts.
    tests:
      - tests/adapters/bbc/test_service_and_metadata.py::test_service_root_and_metadata_follow_bbc_service_shape

  - id: flows.sources.core-shape
    source: bbc-api:/flows,/sources
    requirement: Flow creation creates source metadata and exposes filterable flow/source listings.
    tests:
      - tests/adapters/bbc/test_flows_sources_and_segments.py::test_video_flow_write_creates_source_and_supports_read_filters

  - id: flows.sources.contract-models
    source: bbc-api:schemas
    requirement: Representative service, flow, source, segment, and object responses validate against generated TAMS contract models.
    tests:
      - tests/adapters/bbc/test_flows_sources_and_segments.py::test_core_api_responses_validate_against_contract_models

  - id: flows.properties
    source: bbc-api:/flows/{flowId}/label,/description,/read_only,/tags
    requirement: Flow and source property endpoints round-trip updates, deletes, and HEAD responses.
    tests:
      - tests/adapters/bbc/test_flows_sources_and_segments.py::test_flow_and_source_property_endpoints_round_trip

  - id: flows.collections
    source: bbc-adr:0012-add-flow-collections
    requirement: Flow collection changes project source collection and collected-by relationships.
    tests:
      - tests/adapters/bbc/test_flows_sources_and_segments.py::test_flow_collection_projects_to_source_collection_and_collected_by

  - id: segments.bulk-create
    source: bbc-adr:0029-bulk-flow-segments
    requirement: Segment registration accepts single and bulk bodies and reports per-segment failures.
    tests:
      - tests/adapters/bbc/test_flows_sources_and_segments.py::test_segments_accept_bbc_bodies_and_emit_paging_headers
      - tests/adapters/bbc/test_flows_sources_and_segments.py::test_segment_batch_reports_per_segment_failures

  - id: segments.timerange
    source: bbc-adr:0007-use-timerange-in-flow-segments
    requirement: Segment timeranges follow BBC boundary and overlap rules.
    tests:
      - tests/adapters/bbc/test_flows_sources_and_segments.py::test_segment_timerange_validation_follows_bbc_boundary_rules
      - tests/adapters/bbc/test_flows_sources_and_segments.py::test_segment_overlap_and_queries_respect_timerange_boundaries

  - id: segments.object-timerange
    source: bbc-adr:0036-specifying-partial-segment-usage
    requirement: Segment responses expose object_timerange when requested and derive it from ts_offset.
    tests:
      - tests/adapters/bbc/test_flows_sources_and_segments.py::test_segment_registration_derives_object_timerange_from_ts_offset

  - id: objects.instances.lifecycle
    source: bbc-adr:0038-improved-storage-management
    requirement: Controlled and uncontrolled object instances are managed from the object boundary.
    tests:
      - tests/adapters/bbc/test_storage_objects_and_deletion.py::test_storage_allocation_and_object_instance_lifecycle

  - id: objects.instances.required-label
    source: bbc-adr:0042-uncontrolled-object-instance-labels
    requirement: Uncontrolled object instances require labels and cannot reuse controlled storage labels.
    tests:
      - tests/adapters/bbc/test_storage_objects_and_deletion.py::test_uncontrolled_object_instance_requires_label
      - tests/adapters/bbc/test_storage_objects_and_deletion.py::test_uncontrolled_instance_label_cannot_reuse_controlled_url_labels

  - id: objects.instances.shared-ownership
    source: bbc-adr:0038-improved-storage-management
    requirement: Object instance updates are visible to every segment that references the same media object.
    tests:
      - tests/adapters/bbc/test_storage_objects_and_deletion.py::test_object_instance_updates_are_visible_to_all_reused_object_segments

  - id: get-urls.filtering
    source: bbc-adr:0023-filter-segment-get-urls
    requirement: accept_get_urls, accept_storage_ids, and presigned filters apply to object and segment get_urls.
    tests:
      - tests/adapters/bbc/test_storage_objects_and_deletion.py::test_get_url_filters_apply_to_objects_and_segments

  - id: deletion.reference-cleanup
    source: bbc-adr:0004-content-deletion
    requirement: Deletion removes only unreferenced segments, flow/source metadata, and object storage.
    tests:
      - tests/adapters/bbc/test_storage_objects_and_deletion.py::test_segment_deletion_request_lifecycle
      - tests/adapters/bbc/test_storage_objects_and_deletion.py::test_flow_deletion_request_removes_flow_segments_and_orphan_source
      - tests/workers/test_worker_deletion.py::test_delete_worker_preserves_shared_objects_until_final_reference

  - id: webhooks.crud-events
    source: bbc-adr:0037-improve-webhooks
    requirement: Webhooks use UUID CRUD endpoints, hide secret material, filter events, and deliver event payloads.
    tests:
      - tests/adapters/bbc/test_webhooks.py::test_webhook_registration_lifecycle_hides_secret_material
      - tests/adapters/bbc/test_webhooks.py::test_webhook_queues_bbc_flow_source_and_segment_events
