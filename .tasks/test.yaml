# https://taskfile.dev
version: "3"

set: [errexit, nounset, pipefail]

# File-level defaults inherited by every task.
env:
  TAMOSS_TEST_DB_URL: '{{default "postgresql://tams:tams@127.0.0.1:55432/tams" .TAMOSS_TEST_DB_URL}}'

vars:
  PYTEST: 'uv run --project src pytest -c src/pyproject.toml -q --no-header --tb=short'
  PYTEST_COLLECT: 'uv run --project src pytest -c src/pyproject.toml --no-header --tb=short'
  TAMS_CONFORMANCE_DIR: tests/tams/conformance
  TAMS_INTEGRATION_DIR: tests/tams/integration
  TAMS_DEPLOYED_DIR: tests/tams/deployed
  TAMS_CONFORMANCE_MARK: "tams_conformance and not tamoss_extension and not tamoss_security"

tasks:
  tamsin:release:
    desc: "Validation: exercise the pinned TAMSin release asset and event contract"
    silent: true
    vars:
      TAMSIN_IMAGE: ghcr.io/livewyer-ops/tamsin:1.0.0-rc.3@sha256:f764e26601561b8652d80ff34c16ff50598a09fb8735204c65bbf26b62a6e709
      EVENT_DIR: '{{.ROOT_DIR}}/reports/tamsin-release-events'
    preconditions:
      - sh: command -v docker
        msg: "docker binary not found"
      - sh: command -v go
        msg: "go binary not found"
    cmds:
      - rm -rf '{{.EVENT_DIR}}'
      - mkdir -p '{{.EVENT_DIR}}'
      - docker pull '{{.TAMSIN_IMAGE}}'
      - |
        version="$(docker run --rm --pull=never '{{.TAMSIN_IMAGE}}' --version)"
        test "$version" = "tamsin version 1.0.0-rc.3 (fe717546e9169b54a3cdfb4c28b552de707580c1, 2026-08-12T20:21:44Z)"
        printf '%s\n' "$version" > '{{.EVENT_DIR}}/version.txt'
      - |
        docker run --rm --pull=never '{{.TAMSIN_IMAGE}}' --format json profiles > '{{.EVENT_DIR}}/profiles.json'
        python3 - '{{.EVENT_DIR}}/profiles.json' <<'PY'
        import json
        import sys

        report = json.load(open(sys.argv[1], encoding="utf-8"))
        assert report["schema_version"] == "1.0"
        assert report["profile_policy_version"] == "1"
        assert [profile["selection"] for profile in report["profiles"]] == [
            "preserve@1",
            "demux@1",
            "muxed-segments@1",
            "essence-segments@1",
            "mpegts-segments@1",
        ]
        PY
      - |
        for profile in preserve demux muxed-segments essence-segments mpegts-segments; do
          docker run --rm --pull=never \
            -v '{{.ROOT_DIR}}/tests/fixtures/e2e:/fixtures:ro' \
            '{{.TAMSIN_IMAGE}}' ingest \
            --profile "${profile}@1" \
            --format json \
            --log-format json \
            --progress none \
            --dry-run=exact \
            --verify=none \
            --input /fixtures/tiny-ingest.mp4 \
            > "{{.EVENT_DIR}}/${profile}.ndjson" \
            2> "{{.EVENT_DIR}}/${profile}.log"
        done
      - TAMOSS_TAMSIN_EVENT_DIR='{{.EVENT_DIR}}' go -C operator test ./test/tamsinrelease -count=1

  # TAMS gates validate the contract separately from TAMOSS extensions.
  tams:contract:
    silent: true
    cmds:
      - task: :dev:submodules
      - mkdir -p reports
      - printf 'test py.tams.contract\n'
      - uv run --project src python src/scripts/check_tamoss_openapi_parity.py | tee reports/openapi-parity.txt
      - "{{.PYTEST}} {{.TAMS_CONFORMANCE_DIR}}/test_openapi_contract.py -m '{{.TAMS_CONFORMANCE_MARK}} and not needs_db and not needs_s3' -ra --junitxml=reports/junit-py-tams-contract.xml"

  tams:semantics:
    silent: true
    cmds:
      - mkdir -p reports
      - printf 'test py.tams.semantics\n'
      - "{{.PYTEST}} {{.TAMS_CONFORMANCE_DIR}}/test_service_and_metadata.py {{.TAMS_CONFORMANCE_DIR}}/test_flows_sources_and_segments.py {{.TAMS_CONFORMANCE_DIR}}/test_storage_objects_and_deletion.py {{.TAMS_CONFORMANCE_DIR}}/test_webhooks.py -m '{{.TAMS_CONFORMANCE_MARK}} and not needs_db and not needs_s3' -ra --junitxml=reports/junit-py-tams-semantics.xml"

  tams:integration:
    silent: true
    vars:
      DB_URL: '{{default "postgresql://tams:tams@127.0.0.1:55432/tams" .TAMOSS_TEST_DB_URL}}'
      S3_ENDPOINT: '{{default "http://127.0.0.1:9000" (default (env "TAMOSS_TEST_S3_ENDPOINT") (env "TAMOSS_S3_ENDPOINT"))}}'
      S3_ACCESS_KEY: '{{default "rustfsadmin" (default (env "BUCKET_USER") (env "TAMOSS_S3_ACCESS_KEY"))}}'
      S3_SECRET_KEY: '{{default "rustfsadmin" (default (env "BUCKET_PASSWORD") (env "TAMOSS_S3_SECRET_KEY"))}}'
    env:
      TAMOSS_TEST_DB_URL: "{{.DB_URL}}"
      TAMOSS_TEST_S3_ENDPOINT: "{{.S3_ENDPOINT}}"
      TAMOSS_TEST_S3_ACCESS_KEY: "{{.S3_ACCESS_KEY}}"
      TAMOSS_TEST_S3_SECRET_KEY: "{{.S3_SECRET_KEY}}"
    cmds:
      - mkdir -p reports
      - printf 'test py.tams.integration\n'
      - |
        uv run --project src python - <<'PY'
        import os
        import boto3
        import psycopg
        from botocore.config import Config

        with psycopg.connect(os.environ["TAMOSS_TEST_DB_URL"], connect_timeout=2):
            pass

        client = boto3.client(
            "s3",
            endpoint_url=os.environ["TAMOSS_TEST_S3_ENDPOINT"],
            aws_access_key_id=os.environ["TAMOSS_TEST_S3_ACCESS_KEY"],
            aws_secret_access_key=os.environ["TAMOSS_TEST_S3_SECRET_KEY"],
            region_name="us-east-1",
            config=Config(s3={"addressing_style": "path"}, connect_timeout=2, read_timeout=2),
        )
        client.list_buckets()
        PY
      - "{{.PYTEST}} {{.TAMS_INTEGRATION_DIR}} -m 'tams_conformance and needs_db and needs_s3' -ra --junitxml=reports/junit-py-tams-integration.xml"

  tams:conformance:
    silent: true
    cmds:
      - task: tams:contract
      - task: tams:semantics
      - task: tams:integration

  tams:
    desc: "Validation: run local TAMS conformance with real Postgres/RustFS checks"
    silent: true
    cmds:
      - task: tams:conformance

  fast:
    silent: true
    cmds:
      - mkdir -p reports
      - printf 'test py.fast\n'
      - "{{.PYTEST}} tests/tams/conformance tests/adapters/postgres/test_connection_pool_reload.py tests/adapters/postgres/test_mappers.py tests/adapters/storage/test_configured_object_storage_unit.py tests/application tests/scripts tests/workers tests/test_documented_task_commands.py tests/test_env_summary_helpers.py tests/test_kind_operand_tag.py tests/test_support_bundle_redaction.py -m 'not needs_db and not needs_s3 and not needs_media and not e2e and not operator_kind and not slow' -ra --junitxml=reports/junit-py-fast.xml"

  application:
    silent: true
    cmds:
      - mkdir -p reports
      - printf 'test py.application\n'
      - "{{.PYTEST}} tests/application/ -ra --junitxml=reports/junit-py-application.xml"

  tams:inventory:
    silent: true
    cmds:
      - mkdir -p reports
      - |
        {
          printf '# TAMS Conformance Test Inventory\n\n'
          printf 'Generated by `task test:tams:inventory`.\n\n'
          printf '## Test Directory\n\n'
          printf '%s\n\n' '- `{{.TAMS_CONFORMANCE_DIR}}`'
          printf '%s\n\n' '- `{{.TAMS_INTEGRATION_DIR}}`'
          printf '%s\n\n' '- `{{.TAMS_DEPLOYED_DIR}}`'
          printf '## Test Files\n\n'
          find '{{.TAMS_CONFORMANCE_DIR}}' '{{.TAMS_INTEGRATION_DIR}}' '{{.TAMS_DEPLOYED_DIR}}' -maxdepth 1 -type f -name 'test_*.py' \
            | sort \
            | sed 's#^#- `#; s#$#`#'
          printf '\n## Collected Tests\n\n```text\n'
          {{.PYTEST_COLLECT}} '{{.TAMS_CONFORMANCE_DIR}}' '{{.TAMS_INTEGRATION_DIR}}' '{{.TAMS_DEPLOYED_DIR}}' -m '{{.TAMS_CONFORMANCE_MARK}}' --collect-only -q
          printf '```\n'
        } > reports/tams-conformance-inventory.md

  tams:deployed:
    silent: true
    vars:
      PROFILE: '{{default "local-kind" .PROFILE}}'
      TARGET_FILE:
        sh: '. .tasks/lib/profile.sh; printf "%s\n" "{{.TARGET_FILE}}" | grep -q . && printf "%s\n" "{{.TARGET_FILE}}" || task_profile_field "{{.PROFILE}}" targetEnv'
    env:
      KUBECONFIG: '{{default "" .KUBECONFIG}}'
    preconditions:
      - sh: test -f {{.TARGET_FILE}}
        msg: "test target {{.TARGET_FILE}} not found"
    cmds:
      - mkdir -p reports
      - printf 'test py.tams.deployed.{{.PROFILE}}\n'
      - task: deployed:setup
      - "{{.PYTEST}} {{.TAMS_DEPLOYED_DIR}} -m 'tams_conformance and e2e' --target-env {{.TARGET_FILE}} -ra --junitxml=reports/junit-py-tams-deployed-{{.PROFILE}}.xml"

  # Adapter gates require live external dependencies.
  adapters:
    silent: true
    cmds:
      - task: adapters:postgres
      - task: adapters:storage

  adapters:postgres:
    silent: true
    vars:
      DB_URL: '{{default "postgresql://tams:tams@127.0.0.1:55432/tams" .TAMOSS_TEST_DB_URL}}'
    env:
      TAMOSS_TEST_DB_URL: "{{.DB_URL}}"
    cmds:
      - mkdir -p reports
      - printf 'test py.adapter.postgres\n'
      - |
        uv run --project src python - <<'PY'
        import os
        import psycopg

        url = os.environ["TAMOSS_TEST_DB_URL"]
        with psycopg.connect(url, connect_timeout=2):
            pass
        PY
      - "{{.PYTEST}} tests/adapters/postgres/ -m needs_db -ra --junitxml=reports/junit-py-adapter-postgres.xml"

  adapters:storage:
    silent: true
    vars:
      S3_ENDPOINT: '{{default "http://127.0.0.1:9000" (default (env "TAMOSS_TEST_S3_ENDPOINT") (env "TAMOSS_S3_ENDPOINT"))}}'
      S3_ACCESS_KEY: '{{default "rustfsadmin" (default (env "BUCKET_USER") (env "TAMOSS_S3_ACCESS_KEY"))}}'
      S3_SECRET_KEY: '{{default "rustfsadmin" (default (env "BUCKET_PASSWORD") (env "TAMOSS_S3_SECRET_KEY"))}}'
    env:
      TAMOSS_TEST_S3_ENDPOINT: "{{.S3_ENDPOINT}}"
      TAMOSS_TEST_S3_ACCESS_KEY: "{{.S3_ACCESS_KEY}}"
      TAMOSS_TEST_S3_SECRET_KEY: "{{.S3_SECRET_KEY}}"
    cmds:
      - mkdir -p reports
      - printf 'test py.adapter.storage\n'
      - |
        uv run --project src python - <<'PY'
        import os
        import boto3
        from botocore.config import Config

        client = boto3.client(
            "s3",
            endpoint_url=os.environ["TAMOSS_TEST_S3_ENDPOINT"],
            aws_access_key_id=os.environ["TAMOSS_TEST_S3_ACCESS_KEY"],
            aws_secret_access_key=os.environ["TAMOSS_TEST_S3_SECRET_KEY"],
            region_name="us-east-1",
            config=Config(s3={"addressing_style": "path"}, connect_timeout=2, read_timeout=2),
        )
        client.list_buckets()
        PY
      - "{{.PYTEST}} tests/adapters/storage/ -m needs_s3 -ra --junitxml=reports/junit-py-adapter-storage.xml"

  workers:
    silent: true
    cmds:
      - mkdir -p reports
      - printf 'test py.workers\n'
      - "{{.PYTEST}} tests/workers/ -m worker -ra --junitxml=reports/junit-py-workers.xml"

  tams:coverage:
    silent: true
    cmds:
      - mkdir -p reports
      - rm -f .coverage reports/coverage.xml
      - printf 'test py.tams.coverage\n'
      - "{{.PYTEST}} {{.TAMS_CONFORMANCE_DIR}}/ --cov=src/app/tamoss --cov-append --cov-report= --junitxml=reports/junit-py-tams-coverage.xml"
      - uv run --project src coverage xml -o reports/coverage.xml
      - uv run --project src coverage html -d reports/coverage-html
      - uv run --project src coverage report

  frontend:
    silent: true
    preconditions:
      - sh: command -v npm
        msg: "npm not found"
    dir: src/app/frontend
    cmds:
      - mkdir -p ../../../reports
      - printf 'test frontend.unit\n'
      - test -d node_modules || npm ci
      - npm run test -- --reporter=default --reporter=junit --outputFile=../../../reports/junit-frontend-unit.xml

  media:fixtures:
    silent: true
    preconditions:
      - sh: command -v docker
        msg: "docker binary not found"
    cmds:
      - mkdir -p reports
      - docker build -f tests/media/Dockerfile -t tamoss-media-test:dev .
      - |
        docker run --rm \
          -e TAMOSS_FFPROBE_BIN=ffprobe \
          -e UV_CACHE_DIR=/tmp/uv-cache \
          -e UV_PROJECT_ENVIRONMENT=/tmp/tamoss-media-test-venv \
          -v "{{.ROOT_DIR}}:/work" \
          -w /work \
          tamoss-media-test:dev \
          sh -lc '{{.PYTEST}} tests/media -ra --junitxml=reports/junit-media-fixtures.xml'

  # Deployed gates exercise a running target through its configured ingress.
  deployed:setup:
    internal: true
    silent: true
    preconditions:
      - sh: command -v uv
        msg: "uv binary not found; run aqua install and add aqua's bin directory to PATH"
    cmds:
      - uv sync --project src --locked --group dev
      - uv run --project src python -m playwright install chromium

  smoke:
    desc: "Validation: run deployed API/UI smoke and verify operator Chainsaw smoke labels"
    silent: true
    vars:
      PROFILE: '{{default "local-kind" .PROFILE}}'
      TARGET_FILE:
        sh: '. .tasks/lib/profile.sh; printf "%s\n" "{{.TARGET_FILE}}" | grep -q . && printf "%s\n" "{{.TARGET_FILE}}" || task_profile_field "{{.PROFILE}}" targetEnv'
    cmds:
      - task: tams:deployed
        vars:
          PROFILE: "{{.PROFILE}}"
          TARGET_FILE: "{{.TARGET_FILE}}"
          KUBECONFIG: '{{default "" (default (env "KUBECONFIG") .KUBECONFIG)}}'
      - task: smoke:deployed
        vars:
          PROFILE: "{{.PROFILE}}"
          TARGET_FILE: "{{.TARGET_FILE}}"
          KUBECONFIG: '{{default "" (default (env "KUBECONFIG") .KUBECONFIG)}}'
      - task: :operator:e2e:chainsaw:labels

  smoke:deployed:
    internal: true
    silent: true
    vars:
      PROFILE: '{{default "local-kind" .PROFILE}}'
      TARGET_FILE:
        sh: '. .tasks/lib/profile.sh; printf "%s\n" "{{.TARGET_FILE}}" | grep -q . && printf "%s\n" "{{.TARGET_FILE}}" || task_profile_field "{{.PROFILE}}" targetEnv'
    env:
      KUBECONFIG: '{{default "" .KUBECONFIG}}'
    preconditions:
      - sh: test -f {{.TARGET_FILE}}
        msg: "test target {{.TARGET_FILE}} not found"
    cmds:
      - mkdir -p reports
      - printf 'test e2e.smoke.{{.PROFILE}}\n'
      - task: deployed:setup
      - "{{.PYTEST}} tests/e2e/ -m 'e2e and smoke' --target-env {{.TARGET_FILE}} -ra --junitxml=reports/junit-e2e-smoke-{{.PROFILE}}.xml"

  product:deployed:
    silent: true
    vars:
      PROFILE: '{{default "local-kind" .PROFILE}}'
      TARGET_FILE:
        sh: '. .tasks/lib/profile.sh; printf "%s\n" "{{.TARGET_FILE}}" | grep -q . && printf "%s\n" "{{.TARGET_FILE}}" || task_profile_field "{{.PROFILE}}" targetEnv'
    env:
      KUBECONFIG: '{{default "" .KUBECONFIG}}'
    preconditions:
      - sh: test -f {{.TARGET_FILE}}
        msg: "test target {{.TARGET_FILE}} not found"
    cmds:
      - mkdir -p reports
      - printf 'test e2e.deployed.{{.PROFILE}}\n'
      - task: deployed:setup
      - "{{.PYTEST}} tests/e2e/ -m 'e2e and not operator_kind' --target-env {{.TARGET_FILE}} -ra --junitxml=reports/junit-e2e-deployed-{{.PROFILE}}.xml"
