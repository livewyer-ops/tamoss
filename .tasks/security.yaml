# https://taskfile.dev
version: "3"

set: [errexit, nounset, pipefail]

# Dependency auditing.
#
# This file is the single definition of what "audited" means. CI calls these
# tasks rather than repeating the commands in workflow YAML, so a local
# `task security:audit` and a CI run cannot report different things.
#
# Findings and scanner failures are fatal. Listing an advisory in
# KNOWNISSUES.md does not exempt it from the release gate.

tasks:
  audit:
    desc: Audit dependencies for known vulnerabilities
    cmds:
      - |
        status=0
        for check in python frontend frontend:signatures frontend:dev osv; do
          task "security:audit:$check" || status=1
        done
        exit "$status"

  audit:python:
    desc: Audit the locked Python dependency set
    cmds:
      - mkdir -p reports
      # Audit the exported lockfile rather than the installed environment.
      # Auditing the environment queries PyPI's JSON API once per package
      # (including the private project name), so the job fails whenever that
      # API wobbles; OSV takes the whole set in a single request.
      - uv export --project src --frozen --no-emit-project --output-file reports/requirements-audit.txt
      - uv run --project src --with pip-audit pip-audit -s osv --no-deps -r reports/requirements-audit.txt

  audit:frontend:
    desc: Audit frontend runtime dependencies
    dir: src/app/frontend
    preconditions:
      - sh: command -v npm
        msg: "npm not found"
    cmds:
      - npm audit --omit=dev

  audit:frontend:signatures:
    desc: Verify frontend packages against registry signatures and provenance
    dir: src/app/frontend
    preconditions:
      - sh: command -v npm
        msg: "npm not found"
      - sh: test -d node_modules
        msg: "node_modules is required for signature verification; run task setup"
    # Checks each installed package against the registry's signature and, where
    # published, its provenance attestation. Unlike the advisory audits this
    # can catch tampering that no vulnerability database knows about yet.
    cmds:
      - npm audit signatures

  audit:frontend:dev:
    desc: Audit frontend dev and build dependencies
    dir: src/app/frontend
    preconditions:
      - sh: command -v npm
        msg: "npm not found"
    # Build-time packages are where the npm supply-chain compromises of recent
    # years actually landed: they execute on the build machine with registry
    # and CI credentials in scope. Excluding them from the audit, as the
    # production-scope check above must, leaves the more exposed half unwatched.
    cmds:
      - npm audit

  audit:osv:
    desc: Scan every ecosystem for known vulnerabilities via OSV
    preconditions:
      - sh: command -v osv-scanner
        msg: "osv-scanner is required; run aqua install"
    # The only check covering operator/go.mod — npm audit and pip-audit are
    # blind to the Go module, so anything it reports there is reported nowhere
    # else. Go call analysis is deliberately disabled: this is a deterministic
    # lockfile audit and must not depend on whichever Go toolchain happens to be
    # installed on the developer machine or runner. Writes SARIF for CI to
    # upload, and re-runs as a table on failure because SARIF alone tells a
    # human at a terminal nothing.
    cmds:
      - mkdir -p reports
      - |
        set -- --recursive --no-call-analysis=go --experimental-exclude=src/vendor/bbc-tams/examples
        status=0
        osv-scanner "$@" --format=sarif --output-file=reports/osv-scanner.sarif ./ || status=$?
        if [ "$status" -ne 0 ]; then
          osv-scanner "$@" ./ || true
          exit "$status"
        fi
