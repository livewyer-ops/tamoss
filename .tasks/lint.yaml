# https://taskfile.dev
version: "3"

set: [errexit, nounset, pipefail]

tasks:
  # `task lint` covers Python, frontend, and shell-helper gates:
  # Ruff import/format, mypy, frontend Prettier, TypeScript, ESLint, and bash syntax.
  # Operator Go lint runs separately via `task operator:lint` (operator CI), and
  # Kubernetes manifest gates via `task operator:security-lint`.
  mypy:
    aliases: [strict-mypy]
    silent: true
    preconditions:
      - sh: command -v uv
    msg: "uv binary not found"
    dir: src
    cmds:
      - uv run mypy
      - >-
        uv run mypy --strict --no-warn-unused-configs
        app/tamoss/api/dependencies.py
        app/tamoss/api/query_params.py
        app/tamoss/api/routes/delete_requests.py
        app/tamoss/api/routes/health.py
        app/tamoss/api/routes/service.py
        app/tamoss/api/routes/storage.py
        app/tamoss/api/routes/webhooks.py
        app/tamoss/bootstrap.py
        app/tamoss/domain/pagination.py
        app/tamoss/domain/tags.py
        app/tamoss/errors.py

  ruff:fix:
    silent: true
    preconditions:
      - sh: command -v uv
        msg: "uv binary not found"
    cmds:
      # Tests are first-class Ruff targets; generated/vendor material stays out.
      - uv run --project src ruff check --config src/pyproject.toml --fix --exclude src/vendor/ --exclude src/app/tamoss/contract/generated/ src tests scripts
      - uv run --project src ruff format --config src/pyproject.toml --exclude src/vendor/ --exclude src/app/tamoss/contract/generated/ src tests scripts

  ruff:lint:
    silent: true
    preconditions:
      - sh: command -v uv
        msg: "uv binary not found"
    cmds:
      # Tests are first-class Ruff targets; generated/vendor material stays out.
      - uv run --project src ruff check --config src/pyproject.toml --exclude src/vendor/ --exclude src/app/tamoss/contract/generated/ src tests scripts
      - uv run --project src ruff format --config src/pyproject.toml --check --exclude src/vendor/ --exclude src/app/tamoss/contract/generated/ src tests scripts

  eslint:
    silent: true
    preconditions:
      - sh: command -v npm
        msg: "npm not found"
    dir: src/app/frontend
    cmds:
      - test -d node_modules || npm ci
      - npm run format:check
      - npm run typecheck
      - npm run lint

  shell:
    silent: true
    cmds:
      - bash -n .tasks/lib/*.sh

  actions:
    desc: Lint GitHub Actions workflows
    silent: true
    preconditions:
      - sh: command -v actionlint
        msg: "actionlint is required; run aqua install"
    # check-yaml only proves a workflow parses. Actions are SHA-pinned and the
    # release path gates on a job graph, so a bad `needs:` reference or a
    # mistyped expression would otherwise stay invisible until a tag build.
    # actionlint also runs shellcheck over `run:` blocks when it is on PATH,
    # which catches defects such as unquoted expansions.
    cmds:
      - actionlint

  yamlfmt:
    interactive: true
    silent: true
    preconditions:
      - sh: command -v uv
        msg: "uv binary not found"
    cmds:
      - uv run --project src pre-commit run check-yaml --all-files
