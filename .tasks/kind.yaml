# https://taskfile.dev
version: "3"

set: [errexit, nounset, pipefail]

vars:
  PROFILE: '{{default "local-kind" .PROFILE}}'
  VERSION: '{{default "0.0.1" (default (env "VERSION") .VERSION)}}'
  # Keep reusable clusters migration-aware even though local images retain a
  # stable :dev tag. 0.0.1 is the schema marker emitted by pre-8.2 Kind builds.
  SCHEMA_VERSION: '{{default "dev-20260810-0007" (default (env "SCHEMA_VERSION") .SCHEMA_VERSION)}}'
  PREVIOUS_SCHEMA_VERSION: '{{default "0.0.1" (default (env "PREVIOUS_SCHEMA_VERSION") .PREVIOUS_SCHEMA_VERSION)}}'
  TAMS_API_VERSION: '{{default "8.2" (default (env "TAMS_API_VERSION") .TAMS_API_VERSION)}}'
  OPERAND_VERSION: '{{default "dev" (default (env "OPERAND_VERSION") .OPERAND_VERSION)}}'
  API_IMAGE: '{{default "livewyer/tamoss-api:dev" (default (env "API_IMAGE") .API_IMAGE)}}'
  UI_IMAGE: '{{default "livewyer/tamoss-ui:dev" (default (env "UI_IMAGE") .UI_IMAGE)}}'
  CONSOLE_IMAGE: '{{default "livewyer/tamoss-console-api:dev" (default (env "CONSOLE_IMAGE") .CONSOLE_IMAGE)}}'
  OPERATOR_IMAGE: '{{default "livewyer/tamoss-operator:dev" (default (env "OPERATOR_IMAGE") .OPERATOR_IMAGE)}}'
  LOCAL_OPERATOR_KUSTOMIZE_DIR: '{{default "deploy/operator/local" .LOCAL_OPERATOR_KUSTOMIZE_DIR}}'
  DEMO_MEDIA_FILE: '{{default "deploy/demo/tamoss-demo.ts" .DEMO_MEDIA_FILE}}'
  KIND_DEMO_INGEST: '{{default "true" (default (env "KIND_DEMO_INGEST") .KIND_DEMO_INGEST)}}'
  KIND_SUMMARY: '{{default "true" (default (env "KIND_SUMMARY") .KIND_SUMMARY)}}'
  PROFILE_TARGET_ENV:
    sh: '. .tasks/lib/profile.sh; task_profile_field "{{.PROFILE}}" targetEnv'
  PROFILE_TAMOSS_NAME:
    sh: '. .tasks/lib/profile.sh; task_profile_field "{{.PROFILE}}" tamossName'
  PROFILE_KIND_ENVIRONMENT_DIR:
    sh: '. .tasks/lib/profile.sh; task_profile_kind_environment_dir "{{.PROFILE}}"'

tasks:
  create:
    silent: true
    preconditions:
      - sh: command -v kind
        msg: "kind binary not found"
    requires:
      vars: [KIND_CONFIG, PROJECT_NAME, KUBECONFIG]
    cmds:
      - task: :docker:compose:stop
      - |
        . .tasks/lib/kind.sh
        task_step "Local Kind: ensure cluster" \
          task_kind_ensure_cluster "{{.PROJECT_NAME}}" "{{.KIND_CONFIG}}" "{{.KUBECONFIG}}"
      - task: image
        vars:
          PROJECT_NAME: "{{.PROJECT_NAME}}"
          API_IMAGE: "{{.API_IMAGE}}"
          UI_IMAGE: "{{.UI_IMAGE}}"
          CONSOLE_IMAGE: "{{.CONSOLE_IMAGE}}"
          OPERATOR_IMAGE: "{{.OPERATOR_IMAGE}}"

  delete:
    silent: true
    preconditions:
      - sh: command -v kind
        msg: "kind binary not found"
    requires:
      vars: [PROJECT_NAME, KUBECONFIG]
    cmds:
      - |
        . .tasks/lib/kind.sh
        task_step "Local Kind: delete cluster" \
          task_kind_delete_cluster "{{.PROJECT_NAME}}" "{{.KUBECONFIG}}"

  image:
    internal: true
    silent: true
    preconditions:
      - sh: command -v docker
        msg: "docker binary not found"
    cmds:
      - task: image:build
        vars:
          API_IMAGE: "{{.API_IMAGE}}"
          UI_IMAGE: "{{.UI_IMAGE}}"
          CONSOLE_IMAGE: "{{.CONSOLE_IMAGE}}"
          OPERATOR_IMAGE: "{{.OPERATOR_IMAGE}}"
      - task: image:load
        vars:
          PROJECT_NAME: "{{.PROJECT_NAME}}"
          API_IMAGE: "{{.API_IMAGE}}"
          UI_IMAGE: "{{.UI_IMAGE}}"
          CONSOLE_IMAGE: "{{.CONSOLE_IMAGE}}"
          OPERATOR_IMAGE: "{{.OPERATOR_IMAGE}}"

  image:build:
    internal: true
    silent: true
    cmds:
      - |
        . .tasks/lib/kind.sh
        task_kind_build_image "TAMOSS API" "{{.API_IMAGE}}" "src/app/tamoss/Dockerfile" "."
        task_kind_build_image "TAMOSS UI" "{{.UI_IMAGE}}" "" "src/app/frontend"
        task_kind_build_image "TAMOSS Console API" "{{.CONSOLE_IMAGE}}" "operator/Dockerfile.console-api" "."
      - task: :operator:image:build
        vars:
          OPERATOR_IMAGE: "{{.OPERATOR_IMAGE}}"
          VERSION: "{{.VERSION}}"
          SCHEMA_VERSION: "{{.SCHEMA_VERSION}}"
          PREVIOUS_SCHEMA_VERSION: "{{.PREVIOUS_SCHEMA_VERSION}}"
          TAMS_API_VERSION: "{{.TAMS_API_VERSION}}"
          OPERAND_VERSION: "{{.OPERAND_VERSION}}"
          STEP_LABEL: "Local Kind: build TAMOSS operator image"

  image:load:
    internal: true
    silent: true
    cmds:
      - |
        . .tasks/lib/kind.sh
        task_kind_load_image "{{.PROJECT_NAME}}" "TAMOSS API" "{{.API_IMAGE}}"
        task_kind_load_image "{{.PROJECT_NAME}}" "TAMOSS UI" "{{.UI_IMAGE}}"
        task_kind_load_image "{{.PROJECT_NAME}}" "TAMOSS Console API" "{{.CONSOLE_IMAGE}}"
        task_kind_load_image "{{.PROJECT_NAME}}" "TAMOSS operator" "{{.OPERATOR_IMAGE}}"

  operator:reload:
    desc: "Local Kind: rebuild the operator image, load it into the existing cluster, and restart the deployment"
    silent: true
    preconditions:
      - sh: command -v docker
        msg: "docker binary not found"
      - sh: command -v kind
        msg: "kind binary not found"
    requires:
      vars: [PROJECT_NAME, KUBECONFIG]
    cmds:
      - task: :operator:image:build
        vars:
          OPERATOR_IMAGE: "{{.OPERATOR_IMAGE}}"
          VERSION: "{{.VERSION}}"
          SCHEMA_VERSION: "{{.SCHEMA_VERSION}}"
          PREVIOUS_SCHEMA_VERSION: "{{.PREVIOUS_SCHEMA_VERSION}}"
          TAMS_API_VERSION: "{{.TAMS_API_VERSION}}"
          OPERAND_VERSION: "{{.OPERAND_VERSION}}"
          STEP_LABEL: "Local Kind: build TAMOSS operator image"
      - |
        . .tasks/lib/kind.sh
        task_kind_load_image "{{.PROJECT_NAME}}" "TAMOSS operator" "{{.OPERATOR_IMAGE}}"
      - task: :operator:restart
        vars:
          KUBECONFIG: "{{.KUBECONFIG}}"

  e2e:fresh:
    silent: true
    cmds:
      - rm -f {{.KUBECONFIG}}
      - |
        . .tasks/lib/kind.sh
        task_step "Local Kind: delete existing cluster" \
          task_kind_delete_cluster "{{.PROJECT_NAME}}"
      - task: :kind:create
        vars:
          PROFILE: "{{.PROFILE}}"
          PROJECT_NAME: "{{.PROJECT_NAME}}"
          KIND_CONFIG: "{{.KIND_CONFIG}}"
          KUBECONFIG: "{{.KUBECONFIG}}"
          API_IMAGE: "{{.API_IMAGE}}"
          UI_IMAGE: "{{.UI_IMAGE}}"
          CONSOLE_IMAGE: "{{.CONSOLE_IMAGE}}"
          OPERATOR_IMAGE: "{{.OPERATOR_IMAGE}}"
      - |
        set -euo pipefail
        . .tasks/lib/kind.sh
        task_kind_validate_profile_topology "{{.PROFILE}}" "{{.KUBECONFIG}}"
      - task: :env:platform:apply
        vars:
          KUBECONFIG: "{{.KUBECONFIG}}"
          ENV_DIR: "{{.PROFILE_KIND_ENVIRONMENT_DIR}}"
      - task: :operator:apply
        vars:
          KUBECONFIG: "{{.KUBECONFIG}}"
          OPERATOR_KUSTOMIZE_DIR: "{{.LOCAL_OPERATOR_KUSTOMIZE_DIR}}"
      - task: :operator:restart
        vars:
          KUBECONFIG: "{{.KUBECONFIG}}"
      - task: :env:instance:apply
        vars:
          KUBECONFIG: "{{.KUBECONFIG}}"
          ENV_DIR: "{{.PROFILE_KIND_ENVIRONMENT_DIR}}"
      - task: :env:wait
        vars:
          KUBECONFIG: "{{.KUBECONFIG}}"
          ENV_DIR: "{{.PROFILE_KIND_ENVIRONMENT_DIR}}"
      - task: :kind:demo:ingest
        vars:
          KUBECONFIG: "{{.KUBECONFIG}}"
          PROFILE_TARGET_ENV: "{{.PROFILE_TARGET_ENV}}"
          DEMO_MEDIA_FILE: "{{.DEMO_MEDIA_FILE}}"
          KIND_DEMO_INGEST: "{{.KIND_DEMO_INGEST}}"
      - task: :e2e:deployed
        vars:
          PROFILE: "{{.PROFILE}}"
          KUBECONFIG: "{{.KUBECONFIG}}"
      - |
        set -euo pipefail
        if [ "{{.KIND_SUMMARY}}" != "false" ]; then
          task env:summary \
            KUBECONFIG="{{.KUBECONFIG}}" \
            ENV_DIR="{{.PROFILE_KIND_ENVIRONMENT_DIR}}" \
            TARGET_ENV="{{.PROFILE_TARGET_ENV}}"
        fi
