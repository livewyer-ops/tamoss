# https://taskfile.dev
version: "3"

vars:
    DEPLOY_ENV: '{{default "kind" .DEPLOY_ENV}}'
    HELMFILE_FILE: deploy/helmfile/helmfile.yaml.gotmpl
    HELMFILE_GROUP: '{{default "" .HELMFILE_GROUP}}'
    IMAGE_TAG: '{{default "" .IMAGE_TAG}}'
    PR_HEAD_SHA: '{{default "" .PR_HEAD_SHA}}'
    PR_NUMBER: '{{default "" .PR_NUMBER}}'
    API_IMAGE_TAG: '{{default "" .API_IMAGE_TAG}}'
    UI_IMAGE_TAG: '{{default "" .UI_IMAGE_TAG}}'
    DEPLOY_VALUES_FILE: '{{default "" .DEPLOY_VALUES_FILE}}'
    WAIT_AUTHENTIK: '{{default "auto" .WAIT_AUTHENTIK}}'

tasks:
    _helmfile:
        internal: true
        silent: true
        requires:
            vars: [KUBECONFIG, SUBCOMMAND]
        preconditions:
            - sh: command -v helmfile
              msg: "helmfile binary not found"
            - sh: command -v helm
              msg: "helm binary not found"
        env:
            KUBECONFIG: "{{.KUBECONFIG}}"
        cmds:
            - |
                set -euo pipefail
                . .tasks/lib/progress.sh
                kubeconfig=$(realpath "{{.KUBECONFIG}}")
                requested_subcommand="{{.SUBCOMMAND}}"
                subcommand="{{.SUBCOMMAND}}"
                if [ "$subcommand" = "apply" ] && ! helm plugin list 2>/dev/null | grep -q '^diff[[:space:]]'; then
                  subcommand="sync"
                fi

                image_tag="{{.IMAGE_TAG}}"
                pr_head_sha="{{.PR_HEAD_SHA}}"
                api_image_tag="{{.API_IMAGE_TAG}}"
                ui_image_tag="{{.UI_IMAGE_TAG}}"

                if [ -z "$image_tag" ] && [ -n "$pr_head_sha" ]; then
                  case "$pr_head_sha" in
                    sha-*) image_tag="$pr_head_sha" ;;
                    *)     image_tag="sha-$(printf '%s' "$pr_head_sha" | cut -c 1-7)" ;;
                  esac
                fi
                [ -n "$image_tag" ] && [ -z "$api_image_tag" ] && api_image_tag="$image_tag"
                [ -n "$image_tag" ] && [ -z "$ui_image_tag" ]  && ui_image_tag="$image_tag"
                if [ -n "{{.PR_NUMBER}}" ]; then
                  [ -z "$api_image_tag" ] && api_image_tag="pr-{{.PR_NUMBER}}"
                  [ -z "$ui_image_tag" ]  && ui_image_tag="pr-{{.PR_NUMBER}}"
                fi

                args=()
                deploy_values_file="{{.DEPLOY_VALUES_FILE}}"
                if [ -n "$deploy_values_file" ]; then
                  deploy_values_file="$(realpath "$deploy_values_file")"
                  args+=(--state-values-file "$deploy_values_file")
                  args+=(--state-values-set "deploy.valuesFile=$deploy_values_file")
                fi
                [ -n "$api_image_tag" ] && args+=(--state-values-set "deploy.apiImageTag=$api_image_tag")
                [ -n "$ui_image_tag" ]  && args+=(--state-values-set "deploy.uiImageTag=$ui_image_tag")
                [ -n "{{.HELMFILE_GROUP}}" ] && args+=(-l "group={{.HELMFILE_GROUP}}")

                helmfile_args=(
                  --kubeconfig "$kubeconfig"
                  -f {{.HELMFILE_FILE}}
                  -e {{.DEPLOY_ENV}}
                )
                if task_debug_enabled; then
                  helmfile_args+=(--debug --enable-live-output)
                fi

                if [ "$requested_subcommand" = "apply" ]; then
                  task_step "install stack with Helmfile {{.DEPLOY_ENV}}" \
                    helmfile "${helmfile_args[@]}" "${args[@]}" "$subcommand"
                else
                  helmfile "${helmfile_args[@]}" "${args[@]}" "$subcommand"
                fi

    apply:
        silent: true
        requires:
            vars: [KUBECONFIG]
        cmds:
            - task: _helmfile
              vars:
                  SUBCOMMAND: apply
                  DEPLOY_ENV: "{{.DEPLOY_ENV}}"
                  KUBECONFIG: "{{.KUBECONFIG}}"
                  HELMFILE_GROUP: "{{.HELMFILE_GROUP}}"
                  IMAGE_TAG: "{{.IMAGE_TAG}}"
                  PR_HEAD_SHA: "{{.PR_HEAD_SHA}}"
                  PR_NUMBER: "{{.PR_NUMBER}}"
                  API_IMAGE_TAG: "{{.API_IMAGE_TAG}}"
                  UI_IMAGE_TAG: "{{.UI_IMAGE_TAG}}"
                  DEPLOY_VALUES_FILE: "{{.DEPLOY_VALUES_FILE}}"
            - |
                . .tasks/lib/progress.sh
                if [ "{{.WAIT_AUTHENTIK}}" = "false" ]; then exit 0; fi
                case "{{.HELMFILE_GROUP}}" in
                  ""|"tams-services")
                    target_file="tests/targets/{{.DEPLOY_ENV}}.env"
                    if [ ! -f "$target_file" ]; then
                      echo "Skipping Authentik readiness wait; $target_file not found"
                      exit 0
                    fi
                    task_step "wait for Authentik" \
                      env KUBECONFIG="{{.KUBECONFIG}}" \
                        task deploy:wait:authentik \
                        DEPLOY_ENV="{{.DEPLOY_ENV}}" \
                        WAIT_AUTHENTIK="{{.WAIT_AUTHENTIK}}"
                    ;;
                esac

    template:
        desc: Render Helmfile manifests for DEPLOY_ENV without applying them
        silent: true
        requires:
            vars: [KUBECONFIG]
        cmds:
            - task: _helmfile
              vars:
                  SUBCOMMAND: template
                  DEPLOY_ENV: "{{.DEPLOY_ENV}}"
                  KUBECONFIG: "{{.KUBECONFIG}}"
                  HELMFILE_GROUP: "{{.HELMFILE_GROUP}}"
                  IMAGE_TAG: "{{.IMAGE_TAG}}"
                  PR_HEAD_SHA: "{{.PR_HEAD_SHA}}"
                  PR_NUMBER: "{{.PR_NUMBER}}"
                  API_IMAGE_TAG: "{{.API_IMAGE_TAG}}"
                  UI_IMAGE_TAG: "{{.UI_IMAGE_TAG}}"
                  DEPLOY_VALUES_FILE: "{{.DEPLOY_VALUES_FILE}}"

    diff:
        silent: true
        requires:
            vars: [KUBECONFIG]
        cmds:
            - task: _helmfile
              vars:
                  SUBCOMMAND: diff
                  DEPLOY_ENV: "{{.DEPLOY_ENV}}"
                  KUBECONFIG: "{{.KUBECONFIG}}"
                  HELMFILE_GROUP: "{{.HELMFILE_GROUP}}"
                  IMAGE_TAG: "{{.IMAGE_TAG}}"
                  PR_HEAD_SHA: "{{.PR_HEAD_SHA}}"
                  PR_NUMBER: "{{.PR_NUMBER}}"
                  API_IMAGE_TAG: "{{.API_IMAGE_TAG}}"
                  UI_IMAGE_TAG: "{{.UI_IMAGE_TAG}}"
                  DEPLOY_VALUES_FILE: "{{.DEPLOY_VALUES_FILE}}"

    kind:
        silent: true
        cmds:
            - task: apply
              vars:
                  DEPLOY_ENV: kind
                  KUBECONFIG: "{{.KUBECONFIG}}"
                  DEPLOY_VALUES_FILE: "{{.DEPLOY_VALUES_FILE}}"

    remote:
        desc: Apply the remote Helmfile target to an existing Kubernetes cluster
        silent: true
        cmds:
            - task: apply
              vars:
                  DEPLOY_ENV: remote
                  KUBECONFIG: "{{.KUBECONFIG}}"
                  DEPLOY_VALUES_FILE: "{{.DEPLOY_VALUES_FILE}}"

    wait:authentik:
        silent: true
        vars:
            TARGET_FILE: "tests/targets/{{.DEPLOY_ENV}}.env"
            MAX_ATTEMPTS: '{{default "90" .MAX_ATTEMPTS}}'
            SLEEP_SECONDS: '{{default "5" .SLEEP_SECONDS}}'
        requires:
            vars: [KUBECONFIG]
        preconditions:
            - sh: test -f "{{.TARGET_FILE}}"
              msg: "test target {{.TARGET_FILE}} not found"
            - sh: command -v kubectl
              msg: "kubectl required"
            - sh: command -v curl
              msg: "curl required"
        cmds:
            - |
                set -euo pipefail

                set -a
                . "{{.TARGET_FILE}}"
                set +a

                auth_namespace="${TEST_TAMOSS_AUTH_NAMESPACE:-${TEST_TAMOSS_NAMESPACE:-authentik}}"
                kubectl --kubeconfig "{{.KUBECONFIG}}" -n "$auth_namespace" \
                  get deploy authentik-server -o name >/dev/null

                ui_url="${TEST_TAMOSS_UI:?TEST_TAMOSS_UI must be set in {{.TARGET_FILE}}}"
                auth_url="${TEST_TAMOSS_AUTH:?TEST_TAMOSS_AUTH must be set in {{.TARGET_FILE}}}"
                jwks_url="${auth_url%/}/application/o/tams-api/jwks/"
                expected_ui="${TEST_TAMOSS_UI_EXPECT_STATUS:-302}"
                curl_args=()
                [ "${TEST_INSECURE_SKIP_TLS_VERIFY:-false}" = "true" ] && curl_args=(-k)

                probe() {
                  local code
                  code=$(curl "${curl_args[@]}" -sS -o /dev/null -w '%{http_code}' "$1" || true)
                  printf '%s' "$code"
                }

                ui_code=$(probe "${ui_url%/}/")
                jwks_code=$(probe "$jwks_url")
                if [ "$ui_code" = "$expected_ui" ] && [ "$jwks_code" = "200" ]; then
                  echo "Authentik ready: app=$ui_code jwks=$jwks_code"
                  exit 0
                fi
                if [ "{{.WAIT_AUTHENTIK}}" = "auto" ] && [ -z "${WAIT_AUTHENTIK_FORCE:-}" ]; then
                  : # fall through to wait loop
                fi

                for attempt in $(seq 1 "{{.MAX_ATTEMPTS}}"); do
                  ui_code=$(probe "${ui_url%/}/")
                  jwks_code=$(probe "$jwks_url")
                  if [ "$ui_code" = "$expected_ui" ] && [ "$jwks_code" = "200" ]; then
                    echo "Authentik ready: app=$ui_code jwks=$jwks_code"
                    exit 0
                  fi
                  echo "Waiting for Authentik ($attempt/{{.MAX_ATTEMPTS}}): app=$ui_code jwks=$jwks_code"
                  sleep "{{.SLEEP_SECONDS}}"
                done

                echo "Error: Authentik did not become ready (expected app=$expected_ui jwks=200; last app=$ui_code jwks=$jwks_code)" >&2
                exit 1

    validate:
        desc: Validate Helmfile deployment renders for kind and remote targets
        cmds:
            - task: validate:direct

    validate:direct:
        silent: true
        preconditions:
            - sh: command -v helmfile
              msg: "helmfile binary not found"
            - sh: command -v helm
              msg: "helm binary not found"
        cmds:
            - |
                . .tasks/lib/progress.sh
                task_step "lint tams-stack chart" \
                  helm lint deploy/charts/tams-stack \
                  --set-file platform.dbInit.schemaSql=db/schema.sql \
                  --set-file platform.dbInit.bootstrapSql=db/bootstrap.sql
            - |
                . .tasks/lib/progress.sh
                task_step "lint tams chart" helm lint deploy/charts/tams
            - |
                . .tasks/lib/progress.sh
                task_step "lint tams-platform chart" \
                  helm lint deploy/charts/tams-platform \
                  --set-file dbInit.schemaSql=db/schema.sql \
                  --set-file dbInit.bootstrapSql=db/bootstrap.sql
            - task: validate:profiles
            - |
                . .tasks/lib/progress.sh
                task_step "render kind Helmfile" \
                  helmfile -f {{.HELMFILE_FILE}} -e kind template
            - |
                . .tasks/lib/progress.sh
                task_step "render remote Helmfile" \
                  helmfile -f {{.HELMFILE_FILE}} -e remote template
            - |
                . .tasks/lib/progress.sh
                deploy_values_file="$PWD/deploy/targets/remote/site-values.example.yaml"
                task_step "render remote Helmfile with site values" \
                  helmfile -f {{.HELMFILE_FILE}} -e remote \
                  --state-values-file "$deploy_values_file" \
                  --state-values-set "deploy.valuesFile=$deploy_values_file" \
                  template

    validate:profiles:
        internal: true
        silent: true
        env:
            UV_CACHE_DIR: /tmp/tams-uv-cache
        preconditions:
            - sh: command -v helm
              msg: "helm binary not found"
        cmds:
            - |
                . .tasks/lib/progress.sh
                task_step "add RustFS Helm repository" \
                  helm repo add rustfs https://charts.rustfs.com --force-update
            - |
                . .tasks/lib/progress.sh
                task_step "build tams-stack Helm dependencies" \
                  helm dependency build deploy/charts/tams-stack
            - |
                . .tasks/lib/progress.sh
                task_step "lint tams-stack lite profile" \
                  helm lint deploy/charts/tams-stack \
                  -f deploy/charts/tams-stack/values-lite.yaml \
                  --set-file platform.dbInit.schemaSql=db/schema.sql \
                  --set-file platform.dbInit.bootstrapSql=db/bootstrap.sql
            - |
                . .tasks/lib/progress.sh
                task_step "lint tams-stack full profile" \
                  helm lint deploy/charts/tams-stack \
                  -f deploy/charts/tams-stack/values-full.yaml \
                  --set-file platform.dbInit.schemaSql=db/schema.sql \
                  --set-file platform.dbInit.bootstrapSql=db/bootstrap.sql
            - |
                . .tasks/lib/progress.sh
                task_step "lint tams-stack remote profile" \
                  helm lint deploy/charts/tams-stack \
                  -f deploy/targets/remote/values.yaml \
                  --set-file platform.dbInit.schemaSql=db/schema.sql \
                  --set-file platform.dbInit.bootstrapSql=db/bootstrap.sql
