# https://taskfile.dev
version: "3"

set: [errexit, nounset, pipefail]

tasks:
  setup:
    internal: true
    cmds:
      - task: submodules
      - uv sync --project src --locked --group dev --no-install-project
      - npm ci --prefix src/app/frontend

  submodules:
    internal: true
    silent: true
    cmds:
      - git submodule update --init --recursive

  git-hooks:
    internal: true
    cmds:
      - uv sync --project src --locked --group dev --no-install-project
      - uv run --project src pre-commit install --hook-type pre-commit --hook-type pre-push

  uv:sync:
    internal: true
    cmds:
      - uv sync --project src --locked --group dev --no-install-project

  uv:sync:upgrade:
    silent: true
    preconditions:
      - sh: command -v uv
        msg: "uv binary not found"
    cmds:
      - uv sync --project src --upgrade

  api:
    interactive: true
    dir: src
    deps:
      - :deps
    env:
      TAMOSS_AUTH_REQUIRED: '{{default "1" (env "TAMOSS_AUTH_REQUIRED")}}'
      TAMOSS_API_TOKEN: '{{default "dev_token" (env "TAMOSS_API_TOKEN")}}'
      POSTGRES_HOST: '{{default "127.0.0.1" (env "POSTGRES_HOST")}}'
      POSTGRES_PORT: '{{default "55432" (env "POSTGRES_PORT")}}'
      POSTGRES_DB: '{{default "tams" (env "POSTGRES_DB")}}'
      POSTGRES_USER: '{{default "tams" (env "POSTGRES_USER")}}'
      POSTGRES_PASSWORD: '{{default "tams" (env "POSTGRES_PASSWORD")}}'
      TAMOSS_S3_ENDPOINT: '{{default "http://127.0.0.1:9000" (env "TAMOSS_S3_ENDPOINT")}}'
      TAMOSS_S3_ACCESS_KEY: '{{default "rustfsadmin" (env "TAMOSS_S3_ACCESS_KEY")}}'
      TAMOSS_S3_SECRET_KEY: '{{default "rustfsadmin" (env "TAMOSS_S3_SECRET_KEY")}}'
    preconditions:
      - sh: command -v uv
        msg: "uv binary not found"
    cmds:
      - uv run uvicorn tamoss.app:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    interactive: true
    dir: src/app/frontend
    env:
      VITE_API_TARGET: '{{default (default "http://localhost:8000" (env "TAMOSS_API_URL")) (env "VITE_API_TARGET")}}'
      TAMOSS_DEV_API_TOKEN: '{{default (default "dev_token" (env "TAMOSS_API_TOKEN")) (env "TAMOSS_DEV_API_TOKEN")}}'
    preconditions:
      - sh: command -v npm
        msg: "npm not found"
    cmds:
      - test -d node_modules || npm ci
      - npm run dev -- --host --port ${PORT:-3000}
