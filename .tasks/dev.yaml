# https://taskfile.dev
version: "3"

set: [errexit, nounset, pipefail]

tasks:
  helm-diff:
    desc: "Install the pinned Helm diff plugin with signature verification"
    vars:
      HELM_DIFF_VERSION: "3.15.13"
    preconditions:
      - sh: command -v helm && command -v curl && command -v gpg
        msg: "Helm, curl and GnuPG are required"
    status:
      - test "$(helm diff version 2>/dev/null)" = "{{.HELM_DIFF_VERSION}}"
    cmds:
      - |
        case "$(uname -s)" in
          Linux) platform=linux ;;
          Darwin) platform=macos ;;
          *) echo "Use the upstream Helm diff installation instructions for this platform." >&2; exit 1 ;;
        esac
        case "$(uname -m)" in
          x86_64) architecture=amd64 ;;
          arm64|aarch64) architecture=arm64 ;;
          *) echo "Use the upstream Helm diff installation instructions for this architecture." >&2; exit 1 ;;
        esac
        work="$(mktemp -d)"
        trap 'rm -rf "$work"' EXIT
        release="https://github.com/databus23/helm-diff/releases/download/v{{.HELM_DIFF_VERSION}}"
        curl --fail --silent --show-error --location "$release/pubkey.asc" -o "$work/pubkey.asc"
        fingerprint="$(gpg --batch --show-keys --with-colons "$work/pubkey.asc" | awk -F: '$1 == "fpr" { print $10; exit }')"
        test "$fingerprint" = "C5645EF47482257A1F806D2BEA17A2A206AFF8CD"
        gpg --batch --dearmor --output "$work/keyring.gpg" "$work/pubkey.asc"
        helm plugin install "$release/helm-diff-$platform-$architecture.tgz" --verify --keyring "$work/keyring.gpg"

  setup:
    internal: true
    cmds:
      - task: submodules
      - uv sync --project src --locked --group dev --no-install-project
      - npm ci --prefix src/app/frontend

  submodules:
    internal: true
    silent: true
    cmds:
      - git submodule update --init --recursive

  git-hooks:
    internal: true
    cmds:
      - uv sync --project src --locked --group dev --no-install-project
      - uv run --project src pre-commit install --hook-type pre-commit --hook-type pre-push

  uv:sync:
    internal: true
    cmds:
      - uv sync --project src --locked --group dev --no-install-project

  uv:sync:upgrade:
    silent: true
    preconditions:
      - sh: command -v uv
        msg: "uv binary not found"
    cmds:
      - uv sync --project src --upgrade

  api:
    interactive: true
    dir: src
    deps:
      - :deps
    env:
      TAMOSS_AUTH_REQUIRED: '{{default "1" (env "TAMOSS_AUTH_REQUIRED")}}'
      TAMOSS_API_TOKEN: '{{default "dev_token" (env "TAMOSS_API_TOKEN")}}'
      POSTGRES_HOST: '{{default "127.0.0.1" (env "POSTGRES_HOST")}}'
      POSTGRES_PORT: '{{default "55432" (env "POSTGRES_PORT")}}'
      POSTGRES_DB: '{{default "tams" (env "POSTGRES_DB")}}'
      POSTGRES_USER: '{{default "tams" (env "POSTGRES_USER")}}'
      POSTGRES_PASSWORD: '{{default "tams" (env "POSTGRES_PASSWORD")}}'
      TAMOSS_S3_ENDPOINT: '{{default "http://127.0.0.1:9000" (env "TAMOSS_S3_ENDPOINT")}}'
      TAMOSS_S3_ACCESS_KEY: '{{default "tamoss-local" (env "TAMOSS_S3_ACCESS_KEY")}}'
      TAMOSS_S3_SECRET_KEY: '{{default "tamoss-local-secret" (env "TAMOSS_S3_SECRET_KEY")}}'
    preconditions:
      - sh: command -v uv
        msg: "uv binary not found"
    cmds:
      - uv run uvicorn tamoss.app:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    interactive: true
    dir: src/app/frontend
    env:
      VITE_API_TARGET: '{{default (default "http://localhost:8000" (env "TAMOSS_API_URL")) (env "VITE_API_TARGET")}}'
      TAMOSS_DEV_API_TOKEN: '{{default (default "dev_token" (env "TAMOSS_API_TOKEN")) (env "TAMOSS_DEV_API_TOKEN")}}'
    preconditions:
      - sh: command -v npm
        msg: "npm not found"
    cmds:
      - test -d node_modules || npm ci
      - npm run dev -- --host --port ${PORT:-3000}
