version: "3"

set: [errexit, nounset, pipefail]

vars:
  ENV: '{{default "" (default (env "ENV") .ENV)}}'
  ENV_DIR:
    sh: |
      if [ -n "{{.ENV_DIR}}" ]; then
        printf '%s\n' "{{.ENV_DIR}}"
      elif [ -n "{{.ENV}}" ]; then
        printf 'deploy/environments/%s\n' "{{.ENV}}"
      else
        printf '\n'
      fi
  INSTANCE: '{{default "" (default (env "INSTANCE") .INSTANCE)}}'
  PLATFORM_HELMFILE: '{{default "deploy/platform/helmfile.yaml.gotmpl" .PLATFORM_HELMFILE}}'
  PLATFORM_TIMEOUT: '{{default "15m" .PLATFORM_TIMEOUT}}'
  ENV_OPERATOR_KUSTOMIZE_DIR:
    sh: |
      if [ -n "{{default (env "OPERATOR_KUSTOMIZE_DIR") .OPERATOR_KUSTOMIZE_DIR}}" ]; then
        printf '%s\n' "{{default (env "OPERATOR_KUSTOMIZE_DIR") .OPERATOR_KUSTOMIZE_DIR}}"
      elif [ -f "{{.ENV_DIR}}/operator/kustomization.yaml" ]; then
        printf '%s/operator\n' "{{.ENV_DIR}}"
      else
        printf 'deploy/operator\n'
      fi

tasks:
  init:
    desc: "Environment: create a remote environment composition from templates"
    silent: true
    requires:
      vars: [NAME, PROFILE, DOMAIN, TAMOSS_VERSION]
    cmds:
      - |
        set -euo pipefail
        . .tasks/lib/env.sh
        task_init_env "{{.NAME}}" "{{.PROFILE}}" "{{.DOMAIN}}" "{{.TAMOSS_VERSION}}"

  platform:apply:
    silent: true
    requires:
      vars: [KUBECONFIG]
    preconditions:
      - sh: command -v helm
        msg: "helm required"
      - sh: command -v helmfile
        msg: "helmfile required"
      - sh: command -v kubectl
        msg: "kubectl required"
      - sh: command -v yq
        msg: "yq required"
      - sh: test -n "{{.ENV_DIR}}"
        msg: "ENV or ENV_DIR is required"
      - sh: test -d "{{.ENV_DIR}}"
        msg: "environment dir {{.ENV_DIR}} not found"
      - sh: test -f "{{.PLATFORM_HELMFILE}}"
        msg: "platform Helmfile {{.PLATFORM_HELMFILE}} not found"
    cmds:
      - |
        set -euo pipefail
        . .tasks/lib/env.sh
        task_apply_env_platform \
          "{{.KUBECONFIG}}" \
          "{{.ENV_DIR}}" \
          "{{.PLATFORM_HELMFILE}}" \
          "{{.PLATFORM_TIMEOUT}}"

  platform:delete:
    silent: true
    prompt: "This will delete platform resources rendered from {{.ENV_DIR}} and stale Helm release state. Continue?"
    requires:
      vars: [KUBECONFIG]
    preconditions:
      - sh: command -v helm
        msg: "helm required"
      - sh: command -v helmfile
        msg: "helmfile required"
      - sh: command -v kubectl
        msg: "kubectl required"
      - sh: test -n "{{.ENV_DIR}}"
        msg: "ENV or ENV_DIR is required"
      - sh: test -d "{{.ENV_DIR}}"
        msg: "environment dir {{.ENV_DIR}} not found"
      - sh: test -f "{{.PLATFORM_HELMFILE}}"
        msg: "platform Helmfile {{.PLATFORM_HELMFILE}} not found"
    cmds:
      - |
        set -euo pipefail
        . .tasks/lib/env.sh
        task_delete_env_platform \
          "{{.KUBECONFIG}}" \
          "{{.ENV_DIR}}" \
          "{{.PLATFORM_HELMFILE}}" \
          "{{.PLATFORM_TIMEOUT}}"

  instance:apply:
    silent: true
    requires:
      vars: [KUBECONFIG, INSTANCE]
    preconditions:
      - sh: command -v kubectl
        msg: "kubectl required"
      - sh: test -n "{{.ENV_DIR}}"
        msg: "ENV or ENV_DIR is required"
      - sh: test -d "{{.ENV_DIR}}"
        msg: "environment dir {{.ENV_DIR}} not found"
    cmds:
      - |
        set -euo pipefail
        . .tasks/lib/env.sh
        task_apply_env_instance "{{.ENV_DIR}}" "{{.KUBECONFIG}}" "{{.INSTANCE}}"

  apply:
    desc: "Environment: apply platform, operator, and Tamoss resources"
    silent: true
    requires:
      vars: [KUBECONFIG]
    preconditions:
      - sh: command -v helm
        msg: "helm required"
      - sh: command -v helmfile
        msg: "helmfile required"
      - sh: command -v kubectl
        msg: "kubectl required"
      - sh: command -v yq
        msg: "yq required"
      - sh: test -n "{{.ENV_DIR}}"
        msg: "ENV or ENV_DIR is required"
      - sh: test -d "{{.ENV_DIR}}"
        msg: "environment dir {{.ENV_DIR}} not found"
      - sh: test -f "{{.PLATFORM_HELMFILE}}"
        msg: "platform Helmfile {{.PLATFORM_HELMFILE}} not found"
      - sh: test -d "{{.ENV_OPERATOR_KUSTOMIZE_DIR}}"
        msg: "operator kustomize dir {{.ENV_OPERATOR_KUSTOMIZE_DIR}} not found"
    cmds:
      - |
        set -euo pipefail
        . .tasks/lib/env.sh
        task_apply_env \
          "{{.ENV_DIR}}" \
          "{{.KUBECONFIG}}" \
          "{{.PLATFORM_HELMFILE}}" \
          "{{.ENV_OPERATOR_KUSTOMIZE_DIR}}" \
          "{{.PLATFORM_TIMEOUT}}"

  instance:init:
    desc: "Instance: add a Tamoss instance to an existing environment"
    silent: true
    requires:
      vars: [INSTANCE, TAMOSS_VERSION]
    vars:
      INSTANCE_PROFILE: '{{if and .PROFILE (ne .PROFILE "local-kind")}}{{.PROFILE}}{{end}}'
      INSTANCE_DOMAIN: '{{default "" (default (env "DOMAIN") .DOMAIN)}}'
      NAMESPACE: '{{default "" (default (env "NAMESPACE") .NAMESPACE)}}'
    preconditions:
      - sh: command -v yq
        msg: "yq required"
      - sh: test -n "{{.ENV_DIR}}"
        msg: "ENV or ENV_DIR is required"
      - sh: test -d "{{.ENV_DIR}}"
        msg: "environment dir {{.ENV_DIR}} not found"
    cmds:
      - |
        set -euo pipefail
        . .tasks/lib/env.sh
        task_init_env_instance \
          "{{.ENV_DIR}}" \
          "{{.INSTANCE}}" \
          "{{.INSTANCE_PROFILE}}" \
          "{{.INSTANCE_DOMAIN}}" \
          "{{.NAMESPACE}}" \
          "{{.TAMOSS_VERSION}}"

  wait:
    desc: "Environment: wait for Tamoss instances to become ready"
    silent: true
    requires:
      vars: [KUBECONFIG]
    vars:
      TIMEOUT: '{{default "15m" .TIMEOUT}}'
    preconditions:
      - sh: command -v kubectl
        msg: "kubectl required"
      - sh: command -v yq
        msg: "yq required"
      - sh: test -n "{{.ENV_DIR}}"
        msg: "ENV or ENV_DIR is required"
      - sh: test -d "{{.ENV_DIR}}"
        msg: "environment dir {{.ENV_DIR}} not found"
    cmds:
      - |
        set -euo pipefail
        . .tasks/lib/env.sh
        task_wait_env "{{.ENV_DIR}}" "{{.KUBECONFIG}}" "{{.TIMEOUT}}" "{{.INSTANCE}}"

  status:
    desc: "Environment: show Tamoss status and namespace resources"
    silent: true
    requires:
      vars: [KUBECONFIG]
    preconditions:
      - sh: command -v kubectl
        msg: "kubectl required"
      - sh: command -v yq
        msg: "yq required"
      - sh: test -n "{{.ENV_DIR}}"
        msg: "ENV or ENV_DIR is required"
      - sh: test -d "{{.ENV_DIR}}"
        msg: "environment dir {{.ENV_DIR}} not found"
    cmds:
      - |
        set -euo pipefail
        . .tasks/lib/env.sh
        task_show_env_status "{{.ENV_DIR}}" "{{.KUBECONFIG}}" "{{.INSTANCE}}"

  summary:
    desc: "Environment: print access URLs and lifecycle status; credentials are shown for local-kind"
    silent: true
    requires:
      vars: [KUBECONFIG]
    vars:
      TARGET_ENV: '{{default "" (default (env "TARGET_ENV") .TARGET_ENV)}}'
    preconditions:
      - sh: command -v kubectl
        msg: "kubectl required"
      - sh: command -v yq
        msg: "yq required"
      - sh: test -n "{{.ENV_DIR}}"
        msg: "ENV or ENV_DIR is required"
      - sh: test -d "{{.ENV_DIR}}"
        msg: "environment dir {{.ENV_DIR}} not found"
    cmds:
      - |
        set -euo pipefail
        . .tasks/lib/env.sh
        task_print_env_summary "{{.ENV_DIR}}" "{{.KUBECONFIG}}" "{{.TARGET_ENV}}" "{{.INSTANCE}}" auto

  credentials:
    desc: "Environment: print credentials for an instance"
    silent: true
    requires:
      vars: [KUBECONFIG, INSTANCE]
    vars:
      TARGET_ENV: '{{default "" (default (env "TARGET_ENV") .TARGET_ENV)}}'
    preconditions:
      - sh: command -v kubectl
        msg: "kubectl required"
      - sh: command -v yq
        msg: "yq required"
      - sh: test -n "{{.ENV_DIR}}"
        msg: "ENV or ENV_DIR is required"
      - sh: test -d "{{.ENV_DIR}}"
        msg: "environment dir {{.ENV_DIR}} not found"
    cmds:
      - |
        set -euo pipefail
        . .tasks/lib/env.sh
        task_print_env_summary "{{.ENV_DIR}}" "{{.KUBECONFIG}}" "{{.TARGET_ENV}}" "{{.INSTANCE}}" true

  diff:
    desc: "Environment: diff Helmfile platform releases, operator, and Tamoss resources"
    silent: true
    requires:
      vars: [KUBECONFIG]
    preconditions:
      - sh: command -v helm
        msg: "helm required"
      - sh: command -v helmfile
        msg: "helmfile required"
      - sh: command -v kubectl
        msg: "kubectl required"
      - sh: test -n "{{.ENV_DIR}}"
        msg: "ENV or ENV_DIR is required"
      - sh: test -d "{{.ENV_DIR}}"
        msg: "environment dir {{.ENV_DIR}} not found"
      - sh: test -f "{{.PLATFORM_HELMFILE}}"
        msg: "platform Helmfile {{.PLATFORM_HELMFILE}} not found"
      - sh: test -d "{{.ENV_OPERATOR_KUSTOMIZE_DIR}}"
        msg: "operator kustomize dir {{.ENV_OPERATOR_KUSTOMIZE_DIR}} not found"
    cmds:
      - |
        set -euo pipefail
        . .tasks/lib/env.sh
        task_diff_env \
          "{{.ENV_DIR}}" \
          "{{.KUBECONFIG}}" \
          "{{.PLATFORM_HELMFILE}}" \
          "{{.PLATFORM_TIMEOUT}}" \
          "{{.ENV_OPERATOR_KUSTOMIZE_DIR}}" \
          "{{.INSTANCE}}"
