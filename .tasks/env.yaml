version: "3"

set: [errexit, nounset, pipefail]

vars:
  ENV: '{{default "" (default (env "ENV") .ENV)}}'
  ENV_DIR:
    sh: |
      if [ -n "{{.ENV_DIR}}" ]; then
        printf '%s\n' "{{.ENV_DIR}}"
      elif [ -n "{{.ENV}}" ]; then
        printf 'deploy/environments/%s\n' "{{.ENV}}"
      else
        printf '\n'
      fi
  PLATFORM_CHART_DIR: '{{default "deploy/platform/chart" .PLATFORM_CHART_DIR}}'
  PLATFORM_RELEASE: '{{default "tamoss-platform" .PLATFORM_RELEASE}}'
  PLATFORM_NAMESPACE: '{{default "tamoss-platform" .PLATFORM_NAMESPACE}}'
  PLATFORM_TIMEOUT: '{{default "15m" .PLATFORM_TIMEOUT}}'
  OPERATOR_KUSTOMIZE_DIR: '{{default "deploy/operator" .OPERATOR_KUSTOMIZE_DIR}}'

tasks:
  init:
    desc: "Environment: create a remote environment composition from templates"
    silent: true
    requires:
      vars: [NAME, PROFILE, DOMAIN]
    cmds:
      - |
        set -euo pipefail
        . .tasks/lib/env.sh
        task_init_env "{{.NAME}}" "{{.PROFILE}}" "{{.DOMAIN}}"

  platform:apply:
    desc: "Environment: apply Helm-rendered platform prerequisites"
    silent: true
    requires:
      vars: [KUBECONFIG]
    preconditions:
      - sh: command -v helm
        msg: "helm required"
      - sh: command -v kubectl
        msg: "kubectl required"
      - sh: command -v yq
        msg: "yq required"
      - sh: test -n "{{.ENV_DIR}}"
        msg: "ENV or ENV_DIR is required"
      - sh: test -d "{{.ENV_DIR}}"
        msg: "environment dir {{.ENV_DIR}} not found"
      - sh: test -d "{{.PLATFORM_CHART_DIR}}"
        msg: "platform chart {{.PLATFORM_CHART_DIR}} not found"
    cmds:
      - |
        set -euo pipefail
        . .tasks/lib/env.sh
        task_apply_env_platform \
          "{{.KUBECONFIG}}" \
          "{{.ENV_DIR}}" \
          "{{.PLATFORM_CHART_DIR}}" \
          "{{.PLATFORM_RELEASE}}" \
          "{{.PLATFORM_NAMESPACE}}" \
          "{{.PLATFORM_TIMEOUT}}"

  platform:delete:
    silent: true
    prompt: "This will delete platform resources rendered from {{.ENV_DIR}} and stale Helm release state. Continue?"
    requires:
      vars: [KUBECONFIG]
    preconditions:
      - sh: command -v helm
        msg: "helm required"
      - sh: command -v kubectl
        msg: "kubectl required"
      - sh: test -n "{{.ENV_DIR}}"
        msg: "ENV or ENV_DIR is required"
      - sh: test -d "{{.ENV_DIR}}"
        msg: "environment dir {{.ENV_DIR}} not found"
      - sh: test -d "{{.PLATFORM_CHART_DIR}}"
        msg: "platform chart {{.PLATFORM_CHART_DIR}} not found"
    cmds:
      - |
        set -euo pipefail
        . .tasks/lib/env.sh
        task_delete_env_platform \
          "{{.KUBECONFIG}}" \
          "{{.ENV_DIR}}" \
          "{{.PLATFORM_CHART_DIR}}" \
          "{{.PLATFORM_RELEASE}}" \
          "{{.PLATFORM_NAMESPACE}}"

  instance:apply:
    desc: "Environment: apply the Tamoss custom resources from an environment"
    silent: true
    requires:
      vars: [KUBECONFIG]
    preconditions:
      - sh: command -v kubectl
        msg: "kubectl required"
      - sh: test -n "{{.ENV_DIR}}"
        msg: "ENV or ENV_DIR is required"
      - sh: test -d "{{.ENV_DIR}}"
        msg: "environment dir {{.ENV_DIR}} not found"
    cmds:
      - |
        set -euo pipefail
        . .tasks/lib/env.sh
        task_apply_env_instance "{{.ENV_DIR}}" "{{.KUBECONFIG}}"

  apply:
    desc: "Environment: apply platform, operator, and Tamoss resources"
    silent: true
    requires:
      vars: [KUBECONFIG]
    preconditions:
      - sh: command -v helm
        msg: "helm required"
      - sh: command -v kubectl
        msg: "kubectl required"
      - sh: command -v yq
        msg: "yq required"
      - sh: test -n "{{.ENV_DIR}}"
        msg: "ENV or ENV_DIR is required"
      - sh: test -d "{{.ENV_DIR}}"
        msg: "environment dir {{.ENV_DIR}} not found"
      - sh: test -d "{{.PLATFORM_CHART_DIR}}"
        msg: "platform chart {{.PLATFORM_CHART_DIR}} not found"
      - sh: test -d "{{.OPERATOR_KUSTOMIZE_DIR}}"
        msg: "operator kustomize dir {{.OPERATOR_KUSTOMIZE_DIR}} not found"
    cmds:
      - |
        set -euo pipefail
        . .tasks/lib/env.sh
        task_apply_env \
          "{{.ENV_DIR}}" \
          "{{.KUBECONFIG}}" \
          "{{.PLATFORM_CHART_DIR}}" \
          "{{.OPERATOR_KUSTOMIZE_DIR}}" \
          "{{.PLATFORM_RELEASE}}" \
          "{{.PLATFORM_NAMESPACE}}" \
          "{{.PLATFORM_TIMEOUT}}"

  wait:
    desc: "Environment: wait for the Tamoss instance to become ready"
    silent: true
    requires:
      vars: [KUBECONFIG]
    vars:
      TIMEOUT: '{{default "15m" .TIMEOUT}}'
    preconditions:
      - sh: command -v kubectl
        msg: "kubectl required"
      - sh: command -v yq
        msg: "yq required"
      - sh: test -n "{{.ENV_DIR}}"
        msg: "ENV or ENV_DIR is required"
      - sh: test -d "{{.ENV_DIR}}"
        msg: "environment dir {{.ENV_DIR}} not found"
    cmds:
      - |
        set -euo pipefail
        . .tasks/lib/env.sh
        task_wait_env "{{.ENV_DIR}}" "{{.KUBECONFIG}}" "{{.TIMEOUT}}"

  status:
    desc: "Environment: show Tamoss status and namespace resources"
    silent: true
    requires:
      vars: [KUBECONFIG]
    preconditions:
      - sh: command -v kubectl
        msg: "kubectl required"
      - sh: test -n "{{.ENV_DIR}}"
        msg: "ENV or ENV_DIR is required"
      - sh: test -d "{{.ENV_DIR}}"
        msg: "environment dir {{.ENV_DIR}} not found"
    cmds:
      - |
        set -euo pipefail
        . .tasks/lib/env.sh
        task_show_env_status "{{.ENV_DIR}}" "{{.KUBECONFIG}}"

  summary:
    desc: "Environment: print access URLs, credentials, OAuth details, and lifecycle status"
    silent: true
    requires:
      vars: [KUBECONFIG]
    vars:
      TARGET_ENV: '{{default "" (default (env "TARGET_ENV") .TARGET_ENV)}}'
    preconditions:
      - sh: command -v kubectl
        msg: "kubectl required"
      - sh: command -v yq
        msg: "yq required"
      - sh: test -n "{{.ENV_DIR}}"
        msg: "ENV or ENV_DIR is required"
      - sh: test -d "{{.ENV_DIR}}"
        msg: "environment dir {{.ENV_DIR}} not found"
    cmds:
      - |
        set -euo pipefail
        . .tasks/lib/env.sh
        task_print_env_summary "{{.ENV_DIR}}" "{{.KUBECONFIG}}" "{{.TARGET_ENV}}"

  diff:
    desc: "Environment: diff platform, operator, and Tamoss resources"
    silent: true
    requires:
      vars: [KUBECONFIG]
    preconditions:
      - sh: command -v helm
        msg: "helm required"
      - sh: command -v kubectl
        msg: "kubectl required"
      - sh: test -n "{{.ENV_DIR}}"
        msg: "ENV or ENV_DIR is required"
      - sh: test -d "{{.ENV_DIR}}"
        msg: "environment dir {{.ENV_DIR}} not found"
      - sh: test -d "{{.PLATFORM_CHART_DIR}}"
        msg: "platform chart {{.PLATFORM_CHART_DIR}} not found"
    cmds:
      - |
        set -euo pipefail
        . .tasks/lib/env.sh
        task_diff_env \
          "{{.ENV_DIR}}" \
          "{{.KUBECONFIG}}" \
          "{{.PLATFORM_CHART_DIR}}" \
          "{{.PLATFORM_RELEASE}}" \
          "{{.PLATFORM_NAMESPACE}}"
