[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tamoss"
version = "1.0.0"
description = "TAMOSS API implementation for the BBC TAMS API"
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = "Apache-2.0"
keywords = ["OpenAPI", "Time Addressable Media Open Source Store", "TAMOSS", "BBC TAMS API"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "alembic>=1.17.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "boto3>=1.41.3",
    "mediatimestamp>=5.2.0",
    "psycopg[binary,pool]>=3.1.0",
    "requests>=2.34.2",
    "pyjwt[crypto]>=2.13.0",
    "pydantic-settings>=2.7.0",
]

[project.scripts]
tamoss-db = "tamoss.db.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=3.5.0",
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "httpx>=0.24.0",
    "polyfactory>=2.14.0",
    "faker>=20.0.0",
    "ruff==0.15.5",
    "bandit[toml]>=1.7.5",
    "pyyaml>=6.0",
    "mypy>=1.13.0",
    "types-requests",
    "types-PyYAML",
    "playwright>=1.59.0",
    "datamodel-code-generator[ruff]>=0.58.0",
]

[tool.setuptools]
package-dir = {"" = "app"}

[tool.setuptools.packages.find]
where = ["app"]
include = ["tamoss*"]

[tool.setuptools.package-data]
"tamoss.db.migrations" = ["script.py.mako", "assets/*.sql"]
"tamoss.contract" = ["openapi.json"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "B",
    "C4",
    "I",
    "SIM",
    "RET",
    "UP",
    "RUF",
    "ARG",
    "PERF",
    "TRY",
    "PLC",
    "PLE",
    "PLW",
]
ignore = [
    "TRY003",  # Domain/API errors intentionally carry BBC-facing messages.
    "TRY004",  # Validation functions normalize external payload errors to ValueError.
]

[tool.ruff.lint.per-file-ignores]
# Keep app/... and src/app/... pairs together: Ruff is invoked from both the
# package project and repository roots, so paths are reported in both forms.
"app/tamoss/api/routes/*.py" = [
    "B008",  # FastAPI dependency and body declarations live in defaults by design.
]
"src/app/tamoss/api/routes/*.py" = [
    "B008",  # FastAPI dependency and body declarations live in defaults by design.
]
"app/tamoss/app.py" = [
    "TRY400",  # Failed default-app startup logs a captured exception outside except scope.
]
"src/app/tamoss/app.py" = [
    "TRY400",  # Failed default-app startup logs a captured exception outside except scope.
]
"app/tamoss/worker.py" = [
    "PLW0603",  # Signal handlers coordinate the simple process shutdown flag.
]
"src/app/tamoss/worker.py" = [
    "PLW0603",  # Signal handlers coordinate the simple process shutdown flag.
]
"tests/**/*.py" = [
    "ARG001",  # Test callbacks keep production-compatible signatures.
    "ARG002",  # Test doubles keep protocol-compatible method signatures.
    "ARG005",  # Monkeypatched lambdas often accept unused passthrough arguments.
]
"scripts/check_tamoss_openapi_parity.py" = [
    "PLC0415",  # Optional Playwright imports stay inside the browser check.
    "PERF401",  # Kept imperative for readable parity-diff construction.
    "PLW2901",  # JSON pointer unescape rewrites loop parts deliberately.
]
"src/scripts/check_tamoss_openapi_parity.py" = [
    "PLC0415",  # Optional runtime imports stay inside the parity check.
    "PERF401",  # Kept imperative for readable parity-diff construction.
    "PLW2901",  # JSON pointer unescape rewrites loop parts deliberately.
]

[tool.ruff]
# Runtime code and tests are linted/formatted by `.tasks/lint.yaml`.
# Generated/vendor material remains excluded at the task boundary.
exclude = [
    ".venv",
    ".pre-commit-hooks",
    "app/tamoss/contract/generated",
]

[tool.mypy]
# Base mypy settings for the hand-authored TAMOSS runtime.
python_version = "3.11"
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false
warn_return_any = false
files = ["app/tamoss"]

[[tool.mypy.overrides]]
module = [
    "app.tamoss.api.presenters",
    "app.tamoss.application.contexts.object_copy",
    "app.tamoss.application.contexts.object_get_urls",
    "app.tamoss.application.contexts.objects",
    "app.tamoss.application.contexts.service",
    "app.tamoss.application.contexts.sources",
    "app.tamoss.application.contexts.storage",
    "app.tamoss.application.contexts.webhooks",
    "app.tamoss.application.webhooks",
    "app.tamoss.contract.payloads",
    "app.tamoss.ports.object_storage",
    "app.tamoss.ports.repositories",
]
disallow_untyped_defs = true
disallow_any_generics = true

[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    "venv",
]
skips = [
    "B101",  # Allow assert statements (common in tests)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = [".git", ".venv", "venv", "build", "dist"]
markers = [
    "bbc: BBC TAMS v8.0 contract or semantic obligation",
    "e2e: Deployed BBC-facing black-box checks",
    "needs_db: Requires live PostgreSQL endpoint",
    "needs_media: Requires local media tooling or containerized media fixture checks",
    "needs_s3: Requires real S3/RustFS endpoint",
    "operator_kind: Opt-in zero-to-ready Kind install through the operator",
    "operator_upgrade: In-place Kind operator upgrade test",
    "smoke: Fast deployed product and operator confidence checks",
    "slow: Takes >10 seconds to complete",
    "architecture: Static architecture and repository shape checks",
    "worker: Asynchronous worker processing checks",
]
filterwarnings = [
    "ignore:Unverified HTTPS request.*:urllib3.exceptions.InsecureRequestWarning",
]

[tool.coverage.run]
# --cov=src/app/tamoss is passed explicitly from the task to avoid CWD-relative
# ambiguity between `uv run --project src` and pytest's rootdir.
omit = [
    "*/tamoss/__main__.py",
]
parallel = false
branch = false

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.xml]
output = "reports/coverage.xml"

[tool.coverage.html]
directory = "reports/coverage-html"
show_contexts = false
