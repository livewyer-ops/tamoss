# Externally visible scheme, normalised at the trusted edge.
#
# X-Forwarded-Proto is client-supplied data. This container listens on a
# cluster-internal Service that only the ingress reaches, so the forwarded
# scheme is honoured for private-network peers and ignored for every other
# client: a request that reaches this port directly cannot claim https over
# http. A deployment that publishes this port outside the cluster network must
# narrow $tamoss_forwarded_scheme_trusted to its own ingress addresses.
geo $tamoss_forwarded_scheme_trusted {
    default 0;
    127.0.0.0/8 1;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
    100.64.0.0/10 1;
    ::1/128 1;
    fc00::/7 1;
}

map "$tamoss_forwarded_scheme_trusted:$http_x_forwarded_proto" $tamoss_external_scheme {
    default $scheme;
    "1:http" http;
    "1:https" https;
}

# Content-Security-Policy, defined once so every location sends the same value.
#
# script-src stays same-origin: the runtime configuration is a generated file
# rather than an inline script, and the lazy player chunks are same-origin
# assets. Omakase's waveform engine requires WebAssembly compilation and loads
# its AudioWorklet from a generated blob, so the policy permits those two
# sources without permitting JavaScript eval().
# worker-src needs blob: because the HLS transmuxer runs from a generated
# worker, and connect-src and media-src need blob: for the generated manifests.
# Omakase also loads its bundled WASM module and silent audio asset from data:
# URLs; neither source can make a network request.
# Presigned media URLs point at the object storage endpoint, which is chosen at
# deployment time rather than at build time, so https: is the tightest workable
# media and connect source; http is allowed only for the loopback endpoints the
# browser media policy already accepts. style-src keeps 'unsafe-inline' because
# the player writes element style attributes directly.
#
# Loading the lazy player chunk reports two blocked `Function("return this")`
# calls. Both come from bundled global-detection shims that catch the failure
# and fall back to `window`, so the chunk evaluates and the player works;
# relaxing script-src for them would give away the main value of this policy.
map $host $tamoss_content_security_policy {
    default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob: https: http://localhost:* http://127.0.0.1:*; connect-src 'self' data: blob: https: http://localhost:* http://127.0.0.1:*";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy $tamoss_content_security_policy always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Request bodies are never forwarded: the proxied TAMS API accepts only
    # GET, HEAD and OPTIONS with proxy_pass_request_body off, and the Console
    # API location sets its own smaller limit. Media is uploaded by the browser
    # straight to presigned object storage URLs, never through this container.
    client_max_body_size 64k;

    include /tmp/tams-ui-runtime.conf;

    # Cache static assets
    location /assets/ {
        expires 1y;
        # nginx does not inherit server-level add_header directives once a
        # location defines its own, so keep worker assets cross-origin isolated.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy $tamoss_content_security_policy always;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check
    location /healthz {
        access_log off;
        # default_type rather than add_header, which would cancel inheritance
        # of the server-level security headers.
        default_type text/plain;
        return 200 "ok";
    }
}
