[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
reason = """
braces is installed through Omakase's patch-package dependency. npm lifecycle
scripts are disabled and this install dependency chain is absent from the
production frontend. check-dependency-mitigation.mjs enforces these conditions
and rejects additional consumers of the install-only dependency chain.
The lockfile pins package versions and integrity; npm ci installs that lockfile.
Guard or scanner failures fail the audit.
The dependency remains affected; this exception applies only to this advisory.
"""
