# https://taskfile.dev
version: "3"

set: [errexit, nounset, pipefail]

vars:
  PROJECT_NAME: '{{default "tams" (default (env "PROJECT_NAME") .PROJECT_NAME)}}'
  KUBECONFIG: '{{default (printf "%s.kubeconfig" .PROJECT_NAME) (default (env "KUBECONFIG") .KUBECONFIG)}}'
  SECRETS_DIR: ".local"
  API_IMAGE: '{{default "livewyer/tamoss-api:dev" (default (env "API_IMAGE") .API_IMAGE)}}'
  UI_IMAGE: '{{default "livewyer/tamoss-ui:dev" (default (env "UI_IMAGE") .UI_IMAGE)}}'
  OPERATOR_IMAGE: '{{default "livewyer/tamoss-operator:dev" (default (env "OPERATOR_IMAGE") .OPERATOR_IMAGE)}}'
  OPERATOR_KUSTOMIZE_DIR: '{{default "deploy/operator" .OPERATOR_KUSTOMIZE_DIR}}'
  LOCAL_OPERATOR_KUSTOMIZE_DIR: '{{default "deploy/operator/local" .LOCAL_OPERATOR_KUSTOMIZE_DIR}}'
  DEMO_MEDIA_FILE: '{{default "deploy/demo/tamoss-demo.ts" .DEMO_MEDIA_FILE}}'
  KIND_SUMMARY: '{{default "true" (default (env "KIND_SUMMARY") .KIND_SUMMARY)}}'
  TAMOSS_NAMESPACE: '{{default "tams" .TAMOSS_NAMESPACE}}'
  PROFILE: '{{default "local-kind" (default (env "PROFILE") .PROFILE)}}'
  PROFILE_KIND_CONFIG:
    sh: '. .tasks/lib/profile.sh; task_profile_kind_config "{{.PROFILE}}"'
  KIND_CONFIG: '{{default .PROFILE_KIND_CONFIG (default (env "KIND_CONFIG") .KIND_CONFIG)}}'
  PROFILE_PLATFORM_KUSTOMIZE_DIR:
    sh: '. .tasks/lib/profile.sh; task_profile_field "{{.PROFILE}}" platformKustomizeDir'
  PROFILE_INSTANCE_KUSTOMIZE_DIR:
    sh: '. .tasks/lib/profile.sh; task_profile_field "{{.PROFILE}}" instanceKustomizeDir'
  PROFILE_TAMOSS_NAME:
    sh: '. .tasks/lib/profile.sh; task_profile_field "{{.PROFILE}}" tamossName'
  PROFILE_TARGET_ENV:
    sh: '. .tasks/lib/profile.sh; task_profile_field "{{.PROFILE}}" targetEnv'

dotenv: [.env]

env:
  TAMOSS_TEST_DB_URL: '{{default "postgresql://tams:tams@127.0.0.1:55432/tams" .TAMOSS_TEST_DB_URL}}'

includes:
  openapi: { taskfile: .tasks/openapi.yaml }
  dev:     { taskfile: .tasks/dev.yaml }
  docker:  { taskfile: .tasks/docker.yaml }
  kind:    { taskfile: .tasks/kind.yaml }
  lint:    { taskfile: .tasks/lint.yaml }
  misc:    { taskfile: .tasks/misc.yaml }
  operator: { taskfile: .tasks/operator.yaml }
  security: { taskfile: .tasks/security.yaml }
  test:    { taskfile: .tasks/test.yaml }

tasks:
  default:
    silent: true
    cmds:
      - task -l

  init:
    desc: "Development: seed .env"
    silent: true
    cmds:
      - test -f .env || (cp .env.example .env; echo "Created .env (edit to override defaults).")

  profile:validate:
    internal: true
    silent: true
    cmds:
      - |
        set -euo pipefail
        . .tasks/lib/profile.sh
        task_validate_profile "{{.PROFILE}}"

  setup:
    desc: "Development: install local Python/frontend dependencies only"
    cmds:
      - task: init
      - task: dev:setup

  hooks:
    cmds:
      - task: dev:git-hooks

  deps:
    cmds:
      - task: docker:compose:deps

  versions:check:
    desc: "Validation: check platform and operand version pins"
    cmds:
      - task: operator:platform:deps:check

  kind:up:
    desc: "Local Kind: build images, create or reuse Kind, apply the selected Tamoss instance, and ingest playable demo media"
    silent: true
    cmds:
      - task: init
      - task: profile:validate
      - task: kind:create
        vars:
          PROJECT_NAME: "{{.PROJECT_NAME}}"
          KIND_CONFIG: "{{.KIND_CONFIG}}"
          KUBECONFIG: "{{.KUBECONFIG}}"
          KIND_SUMMARY: "{{.KIND_SUMMARY}}"
          API_IMAGE: "{{.API_IMAGE}}"
          UI_IMAGE: "{{.UI_IMAGE}}"
          OPERATOR_IMAGE: "{{.OPERATOR_IMAGE}}"
      - |
        set -euo pipefail
        . .tasks/lib/kind.sh
        task_kind_validate_profile_topology "{{.PROFILE}}" "{{.KUBECONFIG}}"
      - task: operator:platform:apply
        vars:
          KUBECONFIG: "{{.KUBECONFIG}}"
          PLATFORM_KUSTOMIZE_DIR: "{{.PROFILE_PLATFORM_KUSTOMIZE_DIR}}"
      - task: operator:apply
        vars:
          KUBECONFIG: "{{.KUBECONFIG}}"
          OPERATOR_KUSTOMIZE_DIR: "{{.LOCAL_OPERATOR_KUSTOMIZE_DIR}}"
      - task: operator:restart
        vars:
          KUBECONFIG: "{{.KUBECONFIG}}"
      - task: operator:instance:apply
        vars:
          KUBECONFIG: "{{.KUBECONFIG}}"
          TAMOSS_CR: "{{.PROFILE_INSTANCE_KUSTOMIZE_DIR}}"
      - task: operator:instance:wait
        vars:
          KUBECONFIG: "{{.KUBECONFIG}}"
          TAMOSS_NAME: "{{.PROFILE_TAMOSS_NAME}}"
      - task: kind:demo:ingest
        vars:
          KUBECONFIG: "{{.KUBECONFIG}}"
          PROFILE_TARGET_ENV: "{{.PROFILE_TARGET_ENV}}"
          DEMO_MEDIA_FILE: "{{.DEMO_MEDIA_FILE}}"
      - |
        if [ "{{.KIND_SUMMARY}}" != "false" ]; then
          task kind:summary \
            KUBECONFIG="{{.KUBECONFIG}}" \
            PROFILE_TARGET_ENV="{{.PROFILE_TARGET_ENV}}"
        fi

  kind:demo:ingest:
    internal: true
    silent: true
    cmds:
      - |
        set -euo pipefail
        . .tasks/lib/progress.sh
        task_step "Demo media: ingest playable media" \
          .tasks/lib/demo_ingest.sh "{{.PROFILE_TARGET_ENV}}" "{{.DEMO_MEDIA_FILE}}" "{{.KUBECONFIG}}"

  kind:summary:
    desc: "Local Kind: print access URLs, app credentials, API docs URL, and API token"
    silent: true
    cmds:
      - |
        set -euo pipefail
        . .tasks/lib/k8s.sh
        task_print_kind_summary "{{.PROFILE_TARGET_ENV}}" "{{.KUBECONFIG}}"

  k8s:init:
    desc: "Kubernetes: create a remote environment Kustomize overlay from templates"
    silent: true
    requires:
      vars: [NAME, PROFILE, DOMAIN]
    cmds:
      - |
        set -euo pipefail
        . .tasks/lib/k8s.sh
        task_init_k8s_environment "{{.NAME}}" "{{.PROFILE}}" "{{.DOMAIN}}"

  k8s:apply:
    desc: "Kubernetes: apply platform, operator, and a remote environment overlay"
    silent: true
    requires:
      vars: [ENV, KUBECONFIG]
    cmds:
      - |
        set -euo pipefail
        . .tasks/lib/k8s.sh
        task_apply_k8s_environment "{{.ENV}}" "{{.KUBECONFIG}}"

  k8s:wait:
    desc: "Kubernetes: wait for a remote environment Tamoss instance to become ready"
    silent: true
    requires:
      vars: [ENV, KUBECONFIG]
    vars:
      TIMEOUT: '{{default "15m" .TIMEOUT}}'
    cmds:
      - |
        set -euo pipefail
        . .tasks/lib/k8s.sh
        task_wait_k8s_environment "{{.ENV}}" "{{.KUBECONFIG}}" "{{.TIMEOUT}}"

  k8s:status:
    desc: "Kubernetes: show remote environment Tamoss status and namespace resources"
    silent: true
    requires:
      vars: [ENV, KUBECONFIG]
    cmds:
      - |
        set -euo pipefail
        . .tasks/lib/k8s.sh
        task_show_k8s_environment_status "{{.ENV}}" "{{.KUBECONFIG}}"

  kind:down:
    desc: "Local Kind: delete the disposable Kind cluster and local runtime state"
    interactive: true
    silent: true
    prompt: "This will delete the {{.PROJECT_NAME}} Kind cluster and local runtime state. Continue?"
    cmds:
      - |
        set -euo pipefail
        . .tasks/lib/kind.sh
        if command -v kind >/dev/null 2>&1; then
          task_step "Local Kind: delete cluster" \
            task_kind_delete_cluster "{{.PROJECT_NAME}}" "{{.KUBECONFIG}}"
        else
          echo "Skipping Kind cleanup; kind is unavailable"
        fi
      - |
        set -euo pipefail
        . .tasks/lib/kind.sh
        task_step "Local Kind: remove local state" \
          task_remove_local_kind_state "{{.KUBECONFIG}}" "{{.SECRETS_DIR}}"

  dev:
    desc: "Development: run local API/frontend dev servers with Compose dependencies"
    interactive: true
    deps:
      - dev:api
      - dev:frontend

  kind:e2e:
    desc: "Local Kind validation: recreate Kind, deploy the selected profile, and run the full end-to-end gate"
    silent: true
    cmds:
      - task: kind:e2e:fresh
        vars:
          PROFILE: "{{.PROFILE}}"
          PROJECT_NAME: "{{.PROJECT_NAME}}"
          KIND_CONFIG: "{{.KIND_CONFIG}}"
          KUBECONFIG: "{{.KUBECONFIG}}"

  kind:profiles:e2e:
    desc: "Local Kind validation: run local-kind, single-server, and multi-server e2e sequentially"
    silent: true
    vars:
      PROFILE_CLUSTER_NAME: '{{default "tamoss-profile-e2e" .PROFILE_CLUSTER_NAME}}'
      PROFILE_KUBECONFIG: '{{default ".local/profile-e2e.kubeconfig" .PROFILE_KUBECONFIG}}'
    cmds:
      - |
        set -euo pipefail
        . .tasks/lib/profile.sh
        task_run_profile_e2e_sequence "{{.PROFILE_CLUSTER_NAME}}" "{{.PROFILE_KUBECONFIG}}"

  e2e:deployed:
    desc: "Validation: run deployed checks against the selected profile target without creating a cluster"
    silent: true
    cmds:
      - task: profile:validate
      - task: test:deployed
        vars:
          DEPLOY_ENV: "{{.PROFILE}}"
          TARGET_FILE: "{{.PROFILE_TARGET_ENV}}"
          KUBECONFIG: "{{.KUBECONFIG}}"

  ingest:
    desc: "Helper: ingest an arbitrary local media file through the configured TAMOSS API"
    requires:
      vars: [VIDEO]
    cmds:
      - task: misc:ingest
        vars:
          VIDEO: "{{.VIDEO}}"
          LABEL: '{{default "" .LABEL}}'
          DESCRIPTION: '{{default "" .DESCRIPTION}}'
          DURATION: '{{default "3" .DURATION}}'

  logs:
    desc: "Operations: show recent concise task logs from .local/logs/task"
    silent: true
    cmds:
      - |
        . .tasks/lib/progress.sh
        log_dir="$(task_log_dir)"
        if [ ! -d "$log_dir" ]; then
          echo "No task logs found at $log_dir"
          exit 0
        fi
        set -- "$log_dir"/*.log
        if [ ! -e "$1" ]; then
          echo "No task logs found at $log_dir"
          exit 0
        fi
        count=0
        for log_file in $(ls -1t "$log_dir"/*.log); do
          echo "$log_file"
          count=$((count + 1))
          [ "$count" -ge 20 ] && break
        done

  lint:
    desc: "Development: lint Python/frontend/shell; operator Go and manifest gates are separate"
    silent: true
    cmds:
      - task: lint:ruff:lint
      - task: lint:mypy
      - task: lint:shell
      - task: lint:eslint

  check:
    desc: "Development: run lint plus the fast test subset"
    silent: true
    cmds:
      - task: lint
      - task: test

  test:
    desc: "Development: run the fast local test subset"
    silent: true
    cmds:
      - task: test:fast
      - task: test:frontend
