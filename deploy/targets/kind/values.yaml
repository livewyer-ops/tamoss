releases:
  tamsStack:
    enabled: true
  authentik:
    enabled: true

clusterServices:
  certManager:
    enabled: true
    version: v1.19.5
    values:
      crds:
        enabled: true
      config:
        apiVersion: controller.config.cert-manager.io/v1alpha1
        kind: ControllerConfiguration
        enableGatewayAPI: false
  metricsServer:
    enabled: true
    version: 3.13.0
    values:
      args:
        - --kubelet-insecure-tls
  traefik:
    enabled: true
    version: 39.0.8
    values:
      deployment:
        kind: DaemonSet
      service:
        type: NodePort
      providers:
        kubernetesGateway:
          enabled: true
          nativeLBByDefault: true
        kubernetesIngress:
          enabled: true
          nativeLBByDefault: true
          allowEmptyServices: true
          strictPrefixMatching: true
      ports:
        web:
          port: 80
          hostPort: 8080
          http:
            redirections:
              entryPoint:
                to: websecure
                scheme: https
        websecure:
          port: 443
          hostPort: 8443
          http:
            tls:
              enabled: true
          http3:
            enabled: true
            advertisedPort: 443
      gateway:
        enabled: false
      gatewayClass:
        enabled: false
      logs:
        access:
          enabled: true

credentials:
  postgresql:
    existingSecret: ""
    secretName: tams-postgresql-auth
    username: tams
    password: tams
    database: tams
    secretKeys:
      username: username
      password: password
      database: database
  rustfs:
    existingSecret: ""
    secretName: tams-rustfs-auth
    accessKey: rustfsadmin
    secretKey: rustfsadmin
    secretKeys:
      accessKey: RUSTFS_ACCESS_KEY
      secretKey: RUSTFS_SECRET_KEY

platform:
  enabled: true
  releaseNamespace: tams
  namespaces:
    app: tams
    auth: authentik
  dbInit:
    enabled: true
    loadFixtures: true
    name: tams-db-init
    namespace: tams
    authentikDatabase:
      enabled: true
      database: authentik
      owner: tams
  authentikConfig:
    enabled: true
    namespace: authentik
    secretName: tams-authentik
    blueprintConfigMapName: tams-authentik-blueprints
    secrets:
      postgresqlPassword: tams
    hosts:
      auth: https://auth.tamoss.localtest.me
      api: https://api.tamoss.localtest.me
      ui: https://app.tamoss.localtest.me
      cookieDomain: tamoss.localtest.me
    oauth:
      applicationName: TAMS API
      applicationSlug: tams-api
      providerName: TAMS API OAuth2
      clientId: tams-api-client
      clientName: TAMS API Client
      scopes:
        - id: tams-api-admin
          name: TAMS API admin scope
          scopeName: tams-api/admin
          description: TAMS API admin access
        - id: tams-api-read
          name: TAMS API read scope
          scopeName: tams-api/read
          description: TAMS API read access
        - id: tams-api-write
          name: TAMS API write scope
          scopeName: tams-api/write
          description: TAMS API write access
        - id: tams-api-delete
          name: TAMS API delete scope
          scopeName: tams-api/delete
          description: TAMS API delete access
      accessTokenValidity: hours=8
    proxy:
      enabled: true
      applicationName: TAMOSS UI
      applicationSlug: tams-ui
      providerName: TAMOSS UI Forward Auth
      accessTokenValidity: hours=8
    outpostService:
      create: false
      name: authentik-outpost
      namespace: tams
      externalName: authentik-server.authentik.svc.cluster.local
      port: 80
      targetPort: 80
    outpostReferenceGrant:
      create: true
      apiVersion: gateway.networking.k8s.io/v1beta1
      name: tams-authentik-outpost
      namespace: authentik
      fromNamespace: tams
      serviceName: authentik-server
  clusterIssuer:
    create: true
    name: tams-selfsigned-issuer
  gatewayClass:
    create: true
    name: traefik
    default: true
  gateway:
    create: true
    name: traefik
    namespace: traefik
    className: traefik
    tlsCertificate:
      create: true
    listeners:
      web:
        port: 80
        protocol: HTTP
      websecure:
        port: 443
        protocol: HTTPS
        hostname: '*.tamoss.localtest.me'
        tlsSecretName: traefik-default-tls
  middlewares:
    authentik:
      create: true
      name: authentik
      namespace: tams
      address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
      maxResponseBodySize: 65536
      authResponseHeaders:
        - X-authentik-username
        - X-authentik-groups
        - X-authentik-entitlements
        - X-authentik-email
        - X-authentik-name
        - X-authentik-uid
        - X-authentik-jwt
        - X-authentik-meta-jwks
        - X-authentik-meta-outpost
        - X-authentik-meta-provider
        - X-authentik-meta-app
        - X-authentik-meta-version
    cors:
      create: true
      name: cors
      namespace: tams
      accessControlAllowOriginList:
        - https://app.tamoss.localtest.me
      accessControlAllowMethods:
        - GET
        - HEAD
        - OPTIONS
        - POST
        - PUT
        - PATCH
        - DELETE
      accessControlAllowHeaders:
        - Authorization
        - Content-Type
        - Accept
        - Range
        - X-Requested-With
      accessControlExposeHeaders:
        - X-Request-ID
        - Location
        - Link
        - X-Paging-Limit
        - X-Paging-NextKey
        - X-Paging-Timerange
        - X-Paging-Count
        - X-Paging-Reverse-Order
        - Content-Length
        - Content-Range
        - Accept-Ranges
      accessControlMaxAge: 600

tamsServices:
  postgresql:
    enabled: true
    namespace: tams
    version: 18.6.1
    values:
      global:
        postgresql:
          auth:
            database: tams
      primary:
        extraEnvVars:
          - name: POSTGRESQL_INIT_MAX_TIMEOUT
            value: "300"
        service:
          type: NodePort
          nodePorts:
            postgresql: 30432
        initdb:
          scriptsConfigMap: tams-db-init
  rustfs:
    enabled: true
    namespace: tams
    gatewayApi:
      enabled: true
      existingGateway:
        name: traefik
        namespace: traefik
      hostname: s3.tamoss.localtest.me
      servicePort: 9000
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: cors
    values:
      mode:
        standalone:
          enabled: true
        distributed:
          enabled: false
      config:
        rustfs:
          log_level: warn
      extraEnv:
        # Standalone mode is one pod/one PVC; disable parity that requires more drives.
        - name: RUSTFS_STORAGE_CLASS_STANDARD
          value: "EC:0"
        - name: RUSTFS_ERASURE_SET_DRIVE_COUNT
          value: "1"
      service:
        type: NodePort
        endpoint:
          nodePort: 32000
        console:
          nodePort: 32001
      ingress:
        enabled: false
      gatewayApi:
        enabled: false
      storageclass:
        name: standard
      affinity:
        podAntiAffinity:
          enabled: false
  authentik:
    enabled: true
    namespace: authentik
    version: 2026.2.2
    values:
      authentik:
        log_level: info
        postgresql:
          host: tams-postgresql.tams.svc.cluster.local
          name: authentik
          user: tams
          port: 5432
      postgresql:
        enabled: false
      server:
        route:
          main:
            enabled: true
            hostnames:
              - auth.tamoss.localtest.me
            parentRefs:
              - name: traefik
                namespace: traefik
                kind: Gateway
                sectionName: websecure
      worker:
        replicas: 1
      serviceAccount:
        create: true

app:
  enabled: true
  namespace: tams

auth:
  required: true
  trustForwardAuthHeaders: false
  oauth2:
    enabled: true
    issuer: https://auth.tamoss.localtest.me/application/o/tams-api/
    jwksUri: http://authentik-server.authentik.svc.cluster.local/application/o/tams-api/jwks/
    audience: ""
    requiredScopes: []
    algorithms:
      - RS256

api:
  replicaCount: 1
  image:
    tag: dev
  env:
    TAMOSS_S3_CONNECT_TIMEOUT_SECONDS: "1"
    TAMOSS_S3_READ_TIMEOUT_SECONDS: "2"
    TAMOSS_S3_AUTO_CREATE_BUCKET: "1"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 80
  pdb:
    enabled: false

worker:
  enabled: true
  replicaCount: 2
  env:
    TAMOSS_WORKER_POLL_INTERVAL_SECONDS: "1"
    TAMOSS_WORKER_MAX_REQUESTS: "25"

ui:
  replicaCount: 1
  image:
    tag: dev
  env:
    TAMOSS_API_URL: /api
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 80
  pdb:
    enabled: false

backends:
  db:
    host: tams-postgresql
    port: "5432"
    database: tams
  s3:
    endpoint:
      default:
        url: http://tams-stack-rustfs-svc:9000
      public:
        url: https://s3.tamoss.localtest.me
    region: us-east-1
    bucket: tamoss

ingress:
  enabled: false
httpRoute:
  enabled: true
  parentRefs:
    - name: traefik
      namespace: traefik
      kind: Gateway
      sectionName: websecure
  api:
    hostnames:
      - api.tamoss.localtest.me
    defaultFilters:
      - type: ExtensionRef
        extensionRef:
          group: traefik.io
          kind: Middleware
          name: cors
  ui:
    hostnames:
      - app.tamoss.localtest.me
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /outpost.goauthentik.io/
        backendRefs:
          - name: authentik-server
            namespace: authentik
            port: 80
            weight: 1
      - matches:
          - path:
              type: PathPrefix
              value: /assets/
        filters:
          - type: ExtensionRef
            extensionRef:
              group: traefik.io
              kind: Middleware
              name: cors
        backendRefs:
          - name: tams-ui
            port: 3000
            weight: 1
      - matches:
          - path:
              type: PathPrefix
              value: /api
        filters:
          - type: ExtensionRef
            extensionRef:
              group: traefik.io
              kind: Middleware
              name: authentik
          - type: ExtensionRef
            extensionRef:
              group: traefik.io
              kind: Middleware
              name: cors
        backendRefs:
          - name: tams-ui
            port: 3000
            weight: 1
      - matches:
          - path:
              type: PathPrefix
              value: /
        filters:
          - type: ExtensionRef
            extensionRef:
              group: traefik.io
              kind: Middleware
              name: authentik
          - type: ExtensionRef
            extensionRef:
              group: traefik.io
              kind: Middleware
              name: cors
        backendRefs:
          - name: tams-ui
            port: 3000
            weight: 1
