apiVersion: tamoss.livewyer.io/v1alpha1
kind: TamossProfileRegistry
metadata:
  name: tamoss-profiles
# Canonical registry used by .tasks/lib/profile.sh and Taskfile profile
# validation. Keep profile IDs and paths in sync with docs/concepts/profiles.md.
profiles:
  - id: local-kind
    kindConfig: deploy/kind.yaml
    kindEnvironmentDir: deploy/environments/local-kind
    instanceKustomizeDir: deploy/instances/local-kind
    tamossName: tamoss-kind
    targetEnv: tests/targets/local-kind.env
    remoteEnvironment: false
  - id: single-server
    kindConfig: deploy/kind.yaml
    kindEnvironmentDir: deploy/environments/kind-single-server
    instanceKustomizeDir: deploy/instances/single-server
    tamossName: tamoss-single-server
    targetEnv: tests/targets/single-server.env
    remoteEnvironment: true
  - id: multi-server
    # Multi-server Kind validation intentionally uses a multi-node cluster.
    kindConfig: deploy/kind-multi-server.yaml
    kindEnvironmentDir: deploy/environments/kind-multi-server
    instanceKustomizeDir: deploy/instances/multi-server
    tamossName: tamoss-multi-server
    targetEnv: tests/targets/multi-server.env
    remoteEnvironment: true
  - id: edge
    # Edge validates on a single-node Kind harness, but the target install shape
    # is a single ARM64 K3s node with local persistent storage.
    kindConfig: deploy/kind.yaml
    kindEnvironmentDir: deploy/environments/kind-edge
    instanceKustomizeDir: deploy/instances/edge
    tamossName: tamoss-edge
    targetEnv: tests/targets/edge.env
    remoteEnvironment: true
