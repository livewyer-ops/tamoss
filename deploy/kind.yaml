# Kind cluster configuration for local TAMOSS validation.
# Host port 443 is bound on all local interfaces so browser/API tests work from
# the host. Treat this as local development exposure; other machines on the same
# network may be able to reach it while the Kind cluster is running.
# Ref. https://kind.sigs.k8s.io/docs/user/configuration
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    extraPortMappings:
      - containerPort: 30443
        hostPort: 443
        listenAddress: "0.0.0.0"
        protocol: TCP
