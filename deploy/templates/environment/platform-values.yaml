certManager:
  enabled: true

cnpg:
  enabled: true

rustfsOperator:
  enabled: true

authentik:
  enabled: true
  ingress:
    host: auth.__DOMAIN__
    tlsSecretName: authentik-public-tls

traefik:
  enabled: true
  replicas: 2
  service:
    type: LoadBalancer

tls:
  mode: public
  issuerName: tamoss-public
  acme:
    email: ops@example.com
