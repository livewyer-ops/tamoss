# Local development dependency stack: Postgres + RustFS S3 only.
#
# Full product (API, frontend, auth, edge, Kind lifecycle) runs via Helmfile
# against Kind — see Taskfile.yaml `up`. This file exists solely so that
# `task dev` can run uvicorn + Vite natively against containerised deps.
#
# Started via `task deps` (= `task docker:compose:deps`).
services:
  db:
    container_name: tams-db
    image: postgres:18.3
    ports:
      - "55432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    configs:
      - source: tams_db_schema
        target: /docker-entrypoint-initdb.d/01_schema.sql
      - source: tams_db_bootstrap
        target: /docker-entrypoint-initdb.d/02_bootstrap.sql
      - source: tams_db_fixture
        target: /docker-entrypoint-initdb.d/03_fixtures.sql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tams}
      POSTGRES_DB: ${POSTGRES_DB:-tams}
    restart: unless-stopped

  s3:
    container_name: tams-s3
    image: rustfs/rustfs:1.0.0-alpha.98
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/health"]
    restart: unless-stopped

configs:
  tams_db_schema:
    file: ../../db/schema.sql
  tams_db_bootstrap:
    file: ../../db/bootstrap.sql
  tams_db_fixture:
    file: ../../db/fixtures.sql

volumes:
  db-data:
    name: tams-db-data
  s3-data:
    name: tams-s3-data
