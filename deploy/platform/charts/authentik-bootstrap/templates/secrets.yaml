{{- if .Values.authentik.enabled }}
{{- $authentik := .Values.authentik | default dict -}}
{{- $bootstrap := get $authentik "bootstrap" | default dict -}}
{{- $postgresql := get $authentik "postgresql" | default dict -}}
{{- $authentikChart := .Values.authentikChart | default dict -}}
{{- $chartAuth := get $authentikChart "authentik" | default dict -}}
{{- $chartAuthSecret := get $chartAuth "existingSecret" | default dict -}}
{{- $chartPostgresql := get $authentikChart "postgresql" | default dict -}}
{{- $chartPostgresqlAuth := get $chartPostgresql "auth" | default dict -}}
{{- $chartAuthentikPostgresql := get $chartAuth "postgresql" | default dict -}}
{{- $namespace := .Release.Namespace -}}
{{- $authentikSecretName := default "authentik" (get $chartAuthSecret "secretName") -}}
{{- $postgresqlSecretName := default "authentik-postgresql" (get $chartPostgresqlAuth "existingSecret") -}}
{{- $authentikSecret := lookup "v1" "Secret" $namespace $authentikSecretName -}}
{{- $authentikSecretData := dict -}}
{{- if $authentikSecret -}}
{{- $authentikSecretData = $authentikSecret.data | default dict -}}
{{- end -}}
{{- $postgresqlSecret := lookup "v1" "Secret" $namespace $postgresqlSecretName -}}
{{- $postgresqlSecretData := dict -}}
{{- if $postgresqlSecret -}}
{{- $postgresqlSecretData = $postgresqlSecret.data | default dict -}}
{{- end -}}
{{- $bootstrapEmail := (default "admin@tamoss.localtest.me" (get $bootstrap "email") | b64enc) -}}
{{- $bootstrapUsername := (default "akadmin" (get $bootstrap "username") | b64enc) -}}
{{- $authentikSecretKey := include "tamoss-authentik-bootstrap.stableSecretDataValue" (dict
  "value" (get $authentik "secretKey")
  "existingData" $authentikSecretData
  "existingKey" "AUTHENTIK_SECRET_KEY"
  "randomLength" 64
) -}}
{{- $bootstrapPassword := include "tamoss-authentik-bootstrap.stableSecretDataValue" (dict
  "value" (get $bootstrap "password")
  "existingData" $authentikSecretData
  "existingKey" "AUTHENTIK_BOOTSTRAP_PASSWORD"
  "randomLength" 32
) -}}
{{- $bootstrapToken := include "tamoss-authentik-bootstrap.stableSecretDataValue" (dict
  "value" (get $bootstrap "token")
  "existingData" $authentikSecretData
  "existingKey" "AUTHENTIK_BOOTSTRAP_TOKEN"
  "randomLength" 48
) -}}
{{- $postgresqlPassword := include "tamoss-authentik-bootstrap.stableSecretDataValue" (dict
  "value" (get $postgresql "password")
  "existingData" $postgresqlSecretData
  "existingKey" "password"
  "randomLength" 32
) -}}
{{- $postgresqlAdminPassword := include "tamoss-authentik-bootstrap.stableSecretDataValue" (dict
  "value" (get $postgresql "postgresPassword")
  "existingData" $postgresqlSecretData
  "existingKey" "postgres-password"
  "randomLength" 32
) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $postgresqlSecretName | quote }}
  namespace: {{ $namespace | quote }}
type: Opaque
data:
  postgres-password: {{ $postgresqlAdminPassword | quote }}
  password: {{ $postgresqlPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $authentikSecretName | quote }}
  namespace: {{ $namespace | quote }}
type: Opaque
data:
  AUTHENTIK_BOOTSTRAP_EMAIL: {{ $bootstrapEmail | quote }}
  AUTHENTIK_BOOTSTRAP_USERNAME: {{ $bootstrapUsername | quote }}
  AUTHENTIK_BOOTSTRAP_PASSWORD: {{ $bootstrapPassword | quote }}
  AUTHENTIK_BOOTSTRAP_TOKEN: {{ $bootstrapToken | quote }}
  AUTHENTIK_EMAIL__PORT: {{ "587" | b64enc | quote }}
  AUTHENTIK_EMAIL__TIMEOUT: {{ "30" | b64enc | quote }}
  AUTHENTIK_EMAIL__USE_SSL: {{ "false" | b64enc | quote }}
  AUTHENTIK_EMAIL__USE_TLS: {{ "false" | b64enc | quote }}
  AUTHENTIK_ENABLED: {{ "true" | b64enc | quote }}
  AUTHENTIK_ERROR_REPORTING__ENABLED: {{ "false" | b64enc | quote }}
  AUTHENTIK_ERROR_REPORTING__ENVIRONMENT: {{ "k8s" | b64enc | quote }}
  AUTHENTIK_ERROR_REPORTING__SEND_PII: {{ "false" | b64enc | quote }}
  AUTHENTIK_EVENTS__CONTEXT_PROCESSORS__ASN: {{ "/geoip/GeoLite2-ASN.mmdb" | b64enc | quote }}
  AUTHENTIK_EVENTS__CONTEXT_PROCESSORS__GEOIP: {{ "/geoip/GeoLite2-City.mmdb" | b64enc | quote }}
  AUTHENTIK_LOG_LEVEL: {{ "info" | b64enc | quote }}
  AUTHENTIK_OUTPOSTS__CONTAINER_IMAGE_BASE: {{ "ghcr.io/goauthentik/%(type)s:%(version)s" | b64enc | quote }}
  AUTHENTIK_POSTGRESQL__HOST: {{ default "authentik-postgresql" (get $chartAuthentikPostgresql "host") | b64enc | quote }}
  AUTHENTIK_POSTGRESQL__NAME: {{ default "authentik" (get $chartAuthentikPostgresql "name") | b64enc | quote }}
  AUTHENTIK_POSTGRESQL__PASSWORD: {{ $postgresqlPassword | quote }}
  AUTHENTIK_POSTGRESQL__PORT: {{ default "5432" (get $chartAuthentikPostgresql "port") | toString | b64enc | quote }}
  AUTHENTIK_POSTGRESQL__USER: {{ default "authentik" (get $chartAuthentikPostgresql "user") | b64enc | quote }}
  AUTHENTIK_SECRET_KEY: {{ $authentikSecretKey | quote }}
  AUTHENTIK_WEB__PATH: {{ "/" | b64enc | quote }}
{{- end }}
