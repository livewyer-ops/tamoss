---
# Source: rustfs-operator/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rustfs-operator
  namespace: {{ .Release.Namespace | quote }}
  labels:
    helm.sh/chart: tamoss-rustfs-operator-0.1.0
    app.kubernetes.io/name: rustfs-operator
    app.kubernetes.io/instance: rustfs-operator
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
---
# Source: rustfs-operator/templates/clusterrole.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rustfs-operator
  labels:
    helm.sh/chart: tamoss-rustfs-operator-0.1.0
    app.kubernetes.io/name: rustfs-operator
    app.kubernetes.io/instance: rustfs-operator
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
rules:
  # Tenant resources
  - apiGroups: ["rustfs.com"]
    resources: ["tenants"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["rustfs.com"]
    resources: ["tenants/status"]
    verbs: ["update", "patch"]

  # Core resources managed by the operator
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "serviceaccounts", "pods", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  # Node status lookup (node down detection)
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]

  # RBAC resources created for tenants
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # StatefulSets for tenant pools
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # cert-manager Certificate orchestration and readiness watches
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["cert-manager.io"]
    resources: ["issuers", "clusterissuers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames: ["certificates.cert-manager.io"]
    verbs: ["get"]

  # PersistentVolumeClaims for tenant pool volumes.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Events for reconciliation notifications and console event list (core + events.k8s.io)
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "patch"]
---
# Source: rustfs-operator/templates/clusterrolebinding.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rustfs-operator
  labels:
    helm.sh/chart: tamoss-rustfs-operator-0.1.0
    app.kubernetes.io/name: rustfs-operator
    app.kubernetes.io/instance: rustfs-operator
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rustfs-operator
subjects:
  - kind: ServiceAccount
    name: rustfs-operator
    namespace: {{ .Release.Namespace | quote }}
---
# Source: rustfs-operator/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs-operator
  namespace: {{ .Release.Namespace | quote }}
  labels:
    helm.sh/chart: tamoss-rustfs-operator-0.1.0
    app.kubernetes.io/name: rustfs-operator
    app.kubernetes.io/instance: rustfs-operator
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rustfs-operator
      app.kubernetes.io/instance: rustfs-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs-operator
        app.kubernetes.io/instance: rustfs-operator
    spec:
      serviceAccountName: rustfs-operator
      securityContext:
        fsGroup: 65534
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          command: ["./operator", "server"]
          env:
            - name: RUST_LOG
              value: info
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
