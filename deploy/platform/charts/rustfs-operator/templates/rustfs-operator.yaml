apiVersion: v1
kind: Service
metadata:
  name: rustfs-operator-metrics
  namespace: {{ .Release.Namespace | quote }}
  labels:
    helm.sh/chart: tamoss-rustfs-operator-0.2.0
    app.kubernetes.io/name: rustfs-operator
    app.kubernetes.io/instance: rustfs-operator
    app.kubernetes.io/version: "0.0.8"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: operator-metrics
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: metrics
    protocol: TCP
    name: metrics
  selector:
    app.kubernetes.io/name: rustfs-operator
    app.kubernetes.io/instance: rustfs-operator
    app.kubernetes.io/component: operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs-operator
  namespace: {{ .Release.Namespace | quote }}
  labels:
    helm.sh/chart: tamoss-rustfs-operator-0.2.0
    app.kubernetes.io/name: rustfs-operator
    app.kubernetes.io/instance: rustfs-operator
    app.kubernetes.io/version: "0.0.8"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  # Avoid overlapping controllers with different Tenant security defaults.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: rustfs-operator
      app.kubernetes.io/instance: rustfs-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs-operator
        app.kubernetes.io/instance: rustfs-operator
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: rustfs-operator
      securityContext:
        fsGroup: 65534
      containers:
      - name: operator
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
        command:
        - ./operator
        - server
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: metrics
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 5
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        env:
        - name: OPERATOR_METRICS_ENABLED
          value: 'true'
        - name: OPERATOR_METRICS_PORT
          value: '8080'
        - name: OPERATOR_TENANT_MONITOR_ENABLED
          value: 'true'
        - name: OPERATOR_TENANT_MONITOR_INTERVAL_SECONDS
          value: '300'
        - name: OPERATOR_CLUSTER_DOMAIN
          value: cluster.local
        - name: OPERATOR_STS_ENABLED
          value: 'false'
        - name: OPERATOR_STS_AUDIENCE
          value: sts.rustfs.com
        - name: OPERATOR_STS_ADMISSION_REQUESTS_PER_SECOND
          value: '5'
        - name: OPERATOR_STS_ADMISSION_BURST
          value: '10'
        - name: OPERATOR_STS_ADMISSION_MAX_IN_FLIGHT
          value: '16'
        - name: OPERATOR_STS_ADMISSION_BODY_LIMIT_BYTES
          value: '65536'
        - name: OPERATOR_STS_ADMISSION_TIMEOUT_SECONDS
          value: '30'
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: OPERATOR_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: RUST_LOG
          value: info
        resources:
{{ toYaml .Values.resources | indent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 65534
          seccompProfile:
            type: RuntimeDefault
