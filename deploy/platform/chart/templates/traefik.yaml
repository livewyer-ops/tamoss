{{- if .Values.traefik.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: traefik
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tamoss-traefik
rules:
  - apiGroups: [""]
    resources: [endpoints, nodes, configmaps, secrets, services]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [traefik.io]
    resources:
      - ingressroutes
      - ingressroutetcps
      - ingressrouteudps
      - middlewares
      - middlewaretcps
      - serverstransports
      - serverstransporttcps
      - tlsoptions
      - tlsstores
      - traefikservices
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tamoss-traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tamoss-traefik
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: traefik
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: traefik
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: traefik
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/part-of: tamoss-platform
spec:
  replicas: {{ .Values.traefik.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/part-of: tamoss-platform
    spec:
      serviceAccountName: traefik
      containers:
        - name: traefik
          image: {{ printf "%s:%s" .Values.traefik.image.repository .Values.traefik.image.tag | quote }}
          imagePullPolicy: {{ .Values.traefik.image.pullPolicy | quote }}
          args:
            - --entrypoints.web.address=:8000
            - --entrypoints.websecure.address=:8443
            - --entrypoints.websecure.http.tls=true
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.allowemptyservices=true
            - --providers.kubernetesingress.allowexternalnameservices=true
            - --providers.kubernetescrd=true
            - --api.dashboard=false
            - --log.level=INFO
          ports:
            - name: web
              containerPort: 8000
            - name: websecure
              containerPort: 8443
          readinessProbe:
            tcpSocket:
              port: websecure
            periodSeconds: 2
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: traefik
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/part-of: tamoss-platform
spec:
  type: {{ .Values.traefik.service.type }}
  selector:
    app.kubernetes.io/name: traefik
  ports:
    {{- if ne .Values.traefik.service.type "NodePort" }}
    - name: web
      port: 80
      targetPort: web
    {{- end }}
    - name: websecure
      port: 443
      targetPort: websecure
      {{- if and (eq .Values.traefik.service.type "NodePort") .Values.traefik.service.nodePort }}
      nodePort: {{ .Values.traefik.service.nodePort }}
      {{- end }}
{{- end }}
