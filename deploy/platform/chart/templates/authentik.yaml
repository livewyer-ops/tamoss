{{- if .Values.authentik.enabled }}
{{- $authentik := .Files.Get "files/authentik/authentik.yaml" -}}
{{- $tlsMode := include "tamoss-platform.tlsMode" . -}}
{{- $tlsIssuerName := include "tamoss-platform.tlsIssuerName" . -}}
{{- $authentikValues := .Values.authentik | default dict -}}
{{- $authentikIngress := .Values.authentik.ingress | default dict -}}
{{- $authentikHost := default "auth.tamoss.localtest.me" (get $authentikIngress "host") -}}
{{- $authentikTLSSecretName := default "authentik-localtest-tls" (get $authentikIngress "tlsSecretName") -}}
{{- $bootstrap := get $authentikValues "bootstrap" | default dict -}}
{{- $postgresql := get $authentikValues "postgresql" | default dict -}}
{{- $authentikSecret := lookup "v1" "Secret" "auth" "authentik" -}}
{{- $authentikSecretData := dict -}}
{{- if $authentikSecret -}}
{{- $authentikSecretData = $authentikSecret.data | default dict -}}
{{- end -}}
{{- $postgresqlSecret := lookup "v1" "Secret" "auth" "authentik-postgresql" -}}
{{- $postgresqlSecretData := dict -}}
{{- if $postgresqlSecret -}}
{{- $postgresqlSecretData = $postgresqlSecret.data | default dict -}}
{{- end -}}
{{- $bootstrapEmail := (default "admin@tamoss.localtest.me" (get $bootstrap "email") | b64enc) -}}
{{- $bootstrapUsername := (default "akadmin" (get $bootstrap "username") | b64enc) -}}
{{- $authentikSecretKey := "" -}}
{{- if get $authentikValues "secretKey" -}}
{{- $authentikSecretKey = (get $authentikValues "secretKey" | b64enc) -}}
{{- else if hasKey $authentikSecretData "AUTHENTIK_SECRET_KEY" -}}
{{- $authentikSecretKey = (get $authentikSecretData "AUTHENTIK_SECRET_KEY") -}}
{{- else -}}
{{- $authentikSecretKey = (randAlphaNum 64 | b64enc) -}}
{{- end -}}
{{- $bootstrapPassword := "" -}}
{{- if get $bootstrap "password" -}}
{{- $bootstrapPassword = (get $bootstrap "password" | b64enc) -}}
{{- else if hasKey $authentikSecretData "AUTHENTIK_BOOTSTRAP_PASSWORD" -}}
{{- $bootstrapPassword = (get $authentikSecretData "AUTHENTIK_BOOTSTRAP_PASSWORD") -}}
{{- else -}}
{{- $bootstrapPassword = (randAlphaNum 32 | b64enc) -}}
{{- end -}}
{{- $bootstrapToken := "" -}}
{{- if get $bootstrap "token" -}}
{{- $bootstrapToken = (get $bootstrap "token" | b64enc) -}}
{{- else if hasKey $authentikSecretData "AUTHENTIK_BOOTSTRAP_TOKEN" -}}
{{- $bootstrapToken = (get $authentikSecretData "AUTHENTIK_BOOTSTRAP_TOKEN") -}}
{{- else -}}
{{- $bootstrapToken = (randAlphaNum 48 | b64enc) -}}
{{- end -}}
{{- $postgresqlPassword := "" -}}
{{- if get $postgresql "password" -}}
{{- $postgresqlPassword = (get $postgresql "password" | b64enc) -}}
{{- else if hasKey $postgresqlSecretData "password" -}}
{{- $postgresqlPassword = (get $postgresqlSecretData "password") -}}
{{- else -}}
{{- $postgresqlPassword = (randAlphaNum 32 | b64enc) -}}
{{- end -}}
{{- $postgresqlAdminPassword := "" -}}
{{- if get $postgresql "postgresPassword" -}}
{{- $postgresqlAdminPassword = (get $postgresql "postgresPassword" | b64enc) -}}
{{- else if hasKey $postgresqlSecretData "postgres-password" -}}
{{- $postgresqlAdminPassword = (get $postgresqlSecretData "postgres-password") -}}
{{- else -}}
{{- $postgresqlAdminPassword = (randAlphaNum 32 | b64enc) -}}
{{- end -}}
{{- $authentik = replace "auth.tamoss.localtest.me" $authentikHost $authentik -}}
{{- $authentik = replace "authentik-localtest-tls" $authentikTLSSecretName $authentik -}}
{{- $authentik = replace "__AUTHENTIK_BOOTSTRAP_EMAIL_B64__" $bootstrapEmail $authentik -}}
{{- $authentik = replace "__AUTHENTIK_BOOTSTRAP_USERNAME_B64__" $bootstrapUsername $authentik -}}
{{- $authentik = replace "__AUTHENTIK_BOOTSTRAP_PASSWORD_B64__" $bootstrapPassword $authentik -}}
{{- $authentik = replace "__AUTHENTIK_BOOTSTRAP_TOKEN_B64__" $bootstrapToken $authentik -}}
{{- $authentik = replace "__AUTHENTIK_SECRET_KEY_B64__" $authentikSecretKey $authentik -}}
{{- $authentik = replace "__AUTHENTIK_POSTGRES_PASSWORD_B64__" $postgresqlPassword $authentik -}}
{{- $authentik = replace "__AUTHENTIK_POSTGRES_ADMIN_PASSWORD_B64__" $postgresqlAdminPassword $authentik -}}
{{- if eq $tlsMode "disabled" -}}
{{- $authentik = replace "    cert-manager.io/cluster-issuer: tamoss-selfsigned\n" "" $authentik -}}
{{- else -}}
{{- $authentik = replace "cert-manager.io/cluster-issuer: tamoss-selfsigned" (printf "cert-manager.io/cluster-issuer: %s" $tlsIssuerName) $authentik -}}
{{- end }}
{{ .Files.Get "files/authentik/namespace.yaml" }}
---
{{ $authentik }}
{{- end }}
