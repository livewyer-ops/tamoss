{{- $values := (include "tams-platform.values" . | fromYaml) -}}
{{- if $values.gateway.create }}
{{- $allowedRoutes := default dict $values.gateway.allowedRoutes -}}
{{- $allowedNamespaces := default dict $allowedRoutes.namespaces -}}
{{- $allowedFrom := default "Selector" $allowedNamespaces.from -}}
{{- $defaultSelector := dict "matchExpressions" (list (dict "key" "kubernetes.io/metadata.name" "operator" "In" "values" (list $values.namespaces.app $values.namespaces.auth))) -}}
{{- $allowedSelector := default $defaultSelector $allowedNamespaces.selector -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $values.gateway.name }}
  namespace: {{ $values.gateway.namespace }}
  {{- with $values.gateway.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ $values.gateway.className }}
  listeners:
    - name: web
      port: {{ $values.gateway.listeners.web.port }}
      protocol: {{ $values.gateway.listeners.web.protocol }}
      allowedRoutes:
        namespaces:
          from: {{ $allowedFrom }}
          {{- if eq $allowedFrom "Selector" }}
          selector:
{{ toYaml $allowedSelector | indent 12 }}
          {{- end }}
    - name: websecure
      port: {{ $values.gateway.listeners.websecure.port }}
      protocol: {{ $values.gateway.listeners.websecure.protocol }}
      hostname: {{ $values.gateway.listeners.websecure.hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ $values.gateway.listeners.websecure.tlsSecretName }}
      allowedRoutes:
        namespaces:
          from: {{ $allowedFrom }}
          {{- if eq $allowedFrom "Selector" }}
          selector:
{{ toYaml $allowedSelector | indent 12 }}
          {{- end }}
{{- end }}
