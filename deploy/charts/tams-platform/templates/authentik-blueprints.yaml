{{- $values := (include "tams-platform.values" . | fromYaml) -}}
{{- $authentik := (default dict $values.authentikConfig) -}}
{{- if $authentik.enabled }}
{{- $hosts := (default dict $authentik.hosts) -}}
{{- $oauth := (default dict $authentik.oauth) -}}
{{- $proxy := (default dict $authentik.proxy) -}}
{{- $outpostService := (default dict $authentik.outpostService) -}}
{{- $defaultScopes := list
  (dict "id" "tams-api-admin" "name" "TAMS API admin scope" "scopeName" "tams-api/admin" "description" "TAMS API admin access")
  (dict "id" "tams-api-read" "name" "TAMS API read scope" "scopeName" "tams-api/read" "description" "TAMS API read access")
  (dict "id" "tams-api-write" "name" "TAMS API write scope" "scopeName" "tams-api/write" "description" "TAMS API write access")
  (dict "id" "tams-api-delete" "name" "TAMS API delete scope" "scopeName" "tams-api/delete" "description" "TAMS API delete access")
-}}
{{- $scopes := default $defaultScopes $oauth.scopes -}}
{{- $authHost := required "platform.authentikConfig.hosts.auth is required" $hosts.auth -}}
{{- $apiHost := required "platform.authentikConfig.hosts.api is required" $hosts.api -}}
{{- $uiHost := required "platform.authentikConfig.hosts.ui is required" $hosts.ui -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ default "tams-authentik-blueprints" $authentik.blueprintConfigMapName }}
  namespace: {{ $authentik.namespace }}
data:
  00-tams-scopes.yaml: |
    version: 1
    metadata:
      name: TAMS OAuth scopes
      labels:
        blueprints.goauthentik.io/description: |
          Configures OAuth scopes used by the TAMS API integration.
    entries:
{{- range $scope := $scopes }}
      - model: authentik_providers_oauth2.scopemapping
        identifiers:
          managed: {{ printf "tams.local/providers/oauth2/scope-%s" (required "platform.authentikConfig.oauth.scopes[].id is required" $scope.id) | quote }}
        attrs:
          name: {{ required "platform.authentikConfig.oauth.scopes[].name is required" $scope.name | quote }}
          scope_name: {{ required "platform.authentikConfig.oauth.scopes[].scopeName is required" $scope.scopeName | quote }}
          description: {{ required "platform.authentikConfig.oauth.scopes[].description is required" $scope.description | quote }}
          expression: |
            return {}
{{- end }}
  10-tams-apps.yaml: |
    version: 1
    metadata:
      name: TAMOSS auth integration
      labels:
        blueprints.goauthentik.io/description: |
          Configures OAuth2 machine access and the TAMOSS UI forward-auth provider.
    entries:
      - id: tams-api-provider
        model: authentik_providers_oauth2.oauth2provider
        identifiers:
          client_id: {{ required "platform.authentikConfig.oauth.clientId is required" $oauth.clientId | quote }}
        attrs:
          name: {{ default "TAMS API OAuth2" $oauth.providerName | quote }}
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_secret: !Env TAMOSS_OAUTH_CLIENT_SECRET
          redirect_uris: []
          access_token_validity: {{ default "hours=8" $oauth.accessTokenValidity | quote }}
          include_claims_in_id_token: true
          issuer_mode: per_provider
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
{{- range $scope := $scopes }}
            - !Find [authentik_providers_oauth2.scopemapping, [managed, {{ printf "tams.local/providers/oauth2/scope-%s" (required "platform.authentikConfig.oauth.scopes[].id is required" $scope.id) | quote }}]]
{{- end }}
      - model: authentik_core.application
        identifiers:
          slug: {{ default "tams-api" $oauth.applicationSlug | quote }}
        attrs:
          name: {{ default "TAMS API" $oauth.applicationName | quote }}
          provider: !KeyOf tams-api-provider
          meta_launch_url: {{ $apiHost | quote }}
          meta_description: TAMS API machine access for partner integrations
{{ if $proxy.enabled }}
      - id: tams-ui-provider
        model: authentik_providers_proxy.proxyprovider
        identifiers:
          name: {{ default "TAMOSS UI Forward Auth" $proxy.providerName | quote }}
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          external_host: {{ $uiHost | quote }}
          mode: forward_single
          cookie_domain: {{ default "" $hosts.cookieDomain | quote }}
          access_token_validity: {{ default "hours=8" $proxy.accessTokenValidity | quote }}
          intercept_header_auth: true
      - model: authentik_core.application
        identifiers:
          slug: {{ default "tams-ui" $proxy.applicationSlug | quote }}
        attrs:
          name: {{ default "TAMOSS UI" $proxy.applicationName | quote }}
          provider: !KeyOf tams-ui-provider
          meta_launch_url: {{ $uiHost | quote }}
          meta_description: TAMOSS web UI addon
      - model: authentik_outposts.outpost
        identifiers:
          managed: goauthentik.io/outposts/embedded
        attrs:
          name: authentik Embedded Outpost
          type: proxy
          providers:
            - !KeyOf tams-ui-provider
          config:
            authentik_host: {{ $authHost | quote }}
            authentik_host_browser: {{ $authHost | quote }}
            refresh_interval: minutes=5
{{ end }}
{{ if and $outpostService.create $proxy.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ default "authentik-outpost" $outpostService.name }}
  namespace: {{ default $values.namespaces.app $outpostService.namespace }}
spec:
  type: ExternalName
  externalName: {{ required "platform.authentikConfig.outpostService.externalName is required" $outpostService.externalName }}
  ports:
    - name: http
      port: {{ default 80 $outpostService.port }}
      targetPort: {{ default 80 $outpostService.targetPort }}
{{ end }}
{{- end }}
