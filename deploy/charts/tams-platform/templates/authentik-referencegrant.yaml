{{- $values := (include "tams-platform.values" . | fromYaml) -}}
{{- $authentik := (default dict $values.authentikConfig) -}}
{{- $proxy := (default dict $authentik.proxy) -}}
{{- $referenceGrant := (default dict $authentik.outpostReferenceGrant) -}}
{{- if and $authentik.enabled $proxy.enabled $referenceGrant.create }}
apiVersion: {{ default "gateway.networking.k8s.io/v1beta1" $referenceGrant.apiVersion }}
kind: ReferenceGrant
metadata:
  name: {{ default "tams-authentik-outpost" $referenceGrant.name }}
  namespace: {{ default $authentik.namespace $referenceGrant.namespace }}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: {{ default $values.namespaces.app $referenceGrant.fromNamespace }}
  to:
    - group: ""
      kind: Service
      name: {{ default "authentik-server" $referenceGrant.serviceName }}
{{- end }}
