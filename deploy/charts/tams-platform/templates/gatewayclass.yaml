{{- $values := (include "tams-platform.values" . | fromYaml) -}}
{{- if $values.gatewayClass.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ $values.gatewayClass.name }}
  {{- if $values.gatewayClass.default }}
  labels:
    gateway.networking.k8s.io/default-gateway: "true"
  {{- end }}
spec:
  controllerName: traefik.io/gateway-controller
{{- end }}
