{{- $values := (include "tams-platform.values" . | fromYaml) -}}
{{- if $values.dbInit.enabled }}
{{- $authentikDatabase := default dict $values.dbInit.authentikDatabase -}}
{{- $schemaSql := required "dbInit.schemaSql must be provided when dbInit is enabled; for tams-stack use --set-file platform.dbInit.schemaSql=db/schema.sql" $values.dbInit.schemaSql }}
{{- $bootstrapSql := default "" $values.dbInit.bootstrapSql -}}
{{- $loadFixtures := false -}}
{{- if hasKey $values.dbInit "loadFixtures" -}}
{{- $loadFixtures = $values.dbInit.loadFixtures -}}
{{- end -}}
{{- if and (not $loadFixtures) (not $bootstrapSql) -}}
{{- required "dbInit.bootstrapSql must be provided when dbInit.loadFixtures is false; for tams-stack use --set-file platform.dbInit.bootstrapSql=db/bootstrap.sql" $values.dbInit.bootstrapSql -}}
{{- end -}}
{{- $fixturesSql := "" -}}
{{- if $loadFixtures -}}
{{- $fixturesSql = required "dbInit.fixturesSql must be provided when dbInit.loadFixtures is true; for tams-stack use --set-file platform.dbInit.fixturesSql=db/fixtures.sql" $values.dbInit.fixturesSql -}}
{{- end }}
{{- $authentikDatabaseName := default "authentik" $authentikDatabase.database -}}
{{- $authentikDatabaseOwner := default "tams" $authentikDatabase.owner -}}
{{- if $authentikDatabase.enabled -}}
  {{- if not (regexMatch "^[A-Za-z_][A-Za-z0-9_]*$" $authentikDatabaseName) -}}
    {{- fail "dbInit.authentikDatabase.database must be a simple PostgreSQL identifier" -}}
  {{- end -}}
  {{- if not (regexMatch "^[A-Za-z_][A-Za-z0-9_]*$" $authentikDatabaseOwner) -}}
    {{- fail "dbInit.authentikDatabase.owner must be a simple PostgreSQL identifier" -}}
  {{- end -}}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $values.dbInit.name }}
  namespace: {{ $values.dbInit.namespace }}
data:
{{- if $authentikDatabase.enabled }}
  00_authentik_database.sql: |
    SELECT 'CREATE DATABASE {{ $authentikDatabaseName }} OWNER {{ $authentikDatabaseOwner }}'
    WHERE NOT EXISTS (
      SELECT FROM pg_database
      WHERE datname = '{{ $authentikDatabaseName }}'
    )\gexec

    GRANT ALL PRIVILEGES ON DATABASE {{ $authentikDatabaseName }} TO {{ $authentikDatabaseOwner }};
{{- end }}
  01_schema.sql: |
{{ $schemaSql | nindent 4 }}
{{- if $bootstrapSql }}
  02_bootstrap.sql: |
{{ $bootstrapSql | nindent 4 }}
{{- end }}
{{- if $loadFixtures }}
  03_fixtures.sql: |
{{ $fixturesSql | nindent 4 }}
{{- end }}
{{- end }}
