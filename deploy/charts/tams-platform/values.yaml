namespaces:
  app: tams
  auth: authentik

dbInit:
  enabled: true
  loadFixtures: false
  name: tams-db-init
  namespace: tams
  schemaSql: ""
  bootstrapSql: ""
  fixturesSql: ""
  authentikDatabase:
    enabled: false
    database: authentik
    owner: tams

postgresqlAuth:
  enabled: false
  namespace: tams
  existingSecret: ""
  secretName: tams-postgresql-auth
  username: tams
  password: ""
  database: tams
  secretKeys:
    username: username
    password: password
    database: database

authentikConfig:
  enabled: true
  namespace: authentik
  secretName: tams-authentik
  blueprintConfigMapName: tams-authentik-blueprints
  secrets:
    authentikSecretKey: ""
    postgresqlPassword: ""
    bootstrapPassword: ""
    bootstrapToken: ""
  hosts:
    auth: https://auth.tamoss.localtest.me
    api: https://api.tamoss.localtest.me
    ui: https://app.tamoss.localtest.me
    cookieDomain: tamoss.localtest.me
  oauth:
    applicationName: TAMS API
    applicationSlug: tams-api
    providerName: TAMS API OAuth2
    clientId: tams-api-client
    clientName: TAMS API Client
    clientSecret: ""
    scopes:
      - id: tams-api-admin
        name: TAMS API admin scope
        scopeName: tams-api/admin
        description: TAMS API admin access
      - id: tams-api-read
        name: TAMS API read scope
        scopeName: tams-api/read
        description: TAMS API read access
      - id: tams-api-write
        name: TAMS API write scope
        scopeName: tams-api/write
        description: TAMS API write access
      - id: tams-api-delete
        name: TAMS API delete scope
        scopeName: tams-api/delete
        description: TAMS API delete access
    accessTokenValidity: hours=8
  proxy:
    enabled: true
    applicationName: TAMOSS UI
    applicationSlug: tams-ui
    providerName: TAMOSS UI Forward Auth
    accessTokenValidity: hours=8
  outpostService:
    create: false
    name: authentik-outpost
    namespace: tams
    externalName: authentik-server.authentik.svc.cluster.local
    port: 80
    targetPort: 80
  outpostReferenceGrant:
    create: true
    apiVersion: gateway.networking.k8s.io/v1beta1
    name: tams-authentik-outpost
    namespace: authentik
    fromNamespace: tams
    serviceName: authentik-server

clusterIssuer:
  create: false
  name: tams-selfsigned-issuer

gatewayClass:
  create: true
  name: traefik
  default: false

gateway:
  create: true
  name: traefik
  namespace: traefik
  className: traefik
  annotations: {}
  # The repo-owned Gateway accepts routes from the app and auth namespaces by
  # default. Set allowedRoutes.namespaces.from=All only for a deliberately
  # shared cluster Gateway protected by separate admission policy.
  allowedRoutes:
    namespaces:
      from: Selector
      selector:
        matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: In
            values:
              - tams
              - authentik
  tlsCertificate:
    create: true
  listeners:
    web:
      port: 80
      protocol: HTTP
    websecure:
      port: 443
      protocol: HTTPS
      hostname: '*.tamoss.localtest.me'
      tlsSecretName: traefik-default-tls

middlewares:
  authentik:
    create: true
    name: authentik
    namespace: tams
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    maxResponseBodySize: 65536
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-entitlements
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
  cors:
    create: true
    name: cors
    namespace: tams
    accessControlAllowOriginList:
      - https://app.tamoss.localtest.me
    accessControlAllowMethods:
      - GET
      - HEAD
      - OPTIONS
      - POST
      - PUT
      - PATCH
      - DELETE
    accessControlAllowHeaders:
      - Authorization
      - Content-Type
      - Accept
      - Range
      - X-Requested-With
    accessControlExposeHeaders:
      - X-Request-ID
      - Location
      - Link
      - X-Paging-Limit
      - X-Paging-NextKey
      - X-Paging-Timerange
      - X-Paging-Count
      - X-Paging-Reverse-Order
      - Content-Length
      - Content-Range
      - Accept-Ranges
    accessControlMaxAge: 600
