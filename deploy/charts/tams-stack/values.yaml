platform:
  enabled: true

credentials:
  postgresql:
    existingSecret: ""
    secretName: tams-postgresql-auth
    username: tams
    password: ""
    database: tams
    secretKeys:
      username: username
      password: password
      database: database
  rustfs:
    existingSecret: ""
    secretName: tams-rustfs-auth
    accessKey: ""
    secretKey: ""
    secretKeys:
      accessKey: RUSTFS_ACCESS_KEY
      secretKey: RUSTFS_SECRET_KEY

postgresql:
  enabled: true

rustfs:
  enabled: true

rustfsGatewayApi:
  enabled: false
  hostname: ""
  servicePort: 9000
  existingGateway:
    name: ""
    namespace: traefik
  listeners:
    http:
      name: web
    https:
      name: websecure
  filters: []

networkPolicy:
  enabled: false
  ingressController:
    namespaceLabels:
      kubernetes.io/metadata.name: traefik
    podLabels:
      app.kubernetes.io/name: traefik
  authentik:
    enabled: false
    namespace: ""
    instance: authentik

tams:
  enabled: true
