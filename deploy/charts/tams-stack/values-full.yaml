# TAMOSS Full profile.
#
# This profile keeps one umbrella chart but enables the operational addons used
# by the cloud-native stack: UI, background workers, Gateway API routing, and
# ingress-auth integration points. It assumes the cluster already has Gateway
# API CRDs, a compatible Gateway controller, and a forward-auth provider.
#
# The local Full install path is still Helmfile (`task up`) because it also
# installs the required cluster services. This file exists so the product chart
# has an explicit, render-tested Full profile.
# This file only carries profile overrides; inherited defaults such as
# credentials and stack-level network policy live in values.yaml.

platform:
  enabled: true
  releaseNamespace: tams
  namespaces:
    app: tams
    auth: authentik
  dbInit:
    enabled: true
    loadFixtures: false
    name: tams-db-init
    namespace: tams
  authentikConfig:
    enabled: true
    namespace: authentik
    secretName: tams-authentik
    blueprintConfigMapName: tams-authentik-blueprints
    hosts:
      auth: https://auth.tamoss.localtest.me
      api: https://api.tamoss.localtest.me
      ui: https://app.tamoss.localtest.me
      cookieDomain: tamoss.localtest.me
    oauth:
      applicationName: TAMS API
      applicationSlug: tams-api
      providerName: TAMS API OAuth2
      clientId: tams-api-client
      clientName: TAMS API Client
      scopes:
        - id: tams-api-admin
          name: TAMS API admin scope
          scopeName: tams-api/admin
          description: TAMS API admin access
        - id: tams-api-read
          name: TAMS API read scope
          scopeName: tams-api/read
          description: TAMS API read access
        - id: tams-api-write
          name: TAMS API write scope
          scopeName: tams-api/write
          description: TAMS API write access
        - id: tams-api-delete
          name: TAMS API delete scope
          scopeName: tams-api/delete
          description: TAMS API delete access
      accessTokenValidity: hours=8
    proxy:
      enabled: true
      applicationName: TAMOSS UI
      applicationSlug: tams-ui
      providerName: TAMOSS UI Forward Auth
      accessTokenValidity: hours=8
    outpostService:
      create: false
      name: authentik-outpost
      namespace: tams
      externalName: authentik-server.authentik.svc.cluster.local
      port: 80
      targetPort: 80
    outpostReferenceGrant:
      create: true
      apiVersion: gateway.networking.k8s.io/v1beta1
      name: tams-authentik-outpost
      namespace: authentik
      fromNamespace: tams
      serviceName: authentik-server
  clusterIssuer:
    create: true
    name: tams-selfsigned-issuer
  gatewayClass:
    create: true
    name: traefik
    default: false
  gateway:
    create: true
    name: traefik
    namespace: traefik
    className: traefik
    tlsCertificate:
      create: true
    listeners:
      web:
        port: 80
        protocol: HTTP
      websecure:
        port: 443
        protocol: HTTPS
        hostname: '*.tamoss.localtest.me'
        tlsSecretName: traefik-default-tls
  middlewares:
    authentik:
      create: true
      name: authentik
      namespace: tams
      address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
      maxResponseBodySize: 65536
      authResponseHeaders:
        - X-authentik-username
        - X-authentik-groups
        - X-authentik-entitlements
        - X-authentik-email
        - X-authentik-name
        - X-authentik-uid
        - X-authentik-jwt
        - X-authentik-meta-jwks
        - X-authentik-meta-outpost
        - X-authentik-meta-provider
        - X-authentik-meta-app
        - X-authentik-meta-version
    cors:
      create: true
      name: cors
      namespace: tams
      accessControlAllowOriginList:
        - https://app.tamoss.localtest.me
      accessControlAllowMethods:
        - GET
        - HEAD
        - OPTIONS
        - POST
        - PUT
        - PATCH
        - DELETE
      accessControlAllowHeaders:
        - Authorization
        - Content-Type
        - Accept
        - Range
        - X-Requested-With
      accessControlExposeHeaders:
        - X-Request-ID
        - Location
        - Link
        - X-Paging-Limit
        - X-Paging-NextKey
        - X-Paging-Timerange
        - X-Paging-Count
        - X-Paging-Reverse-Order
        - Content-Length
        - Content-Range
        - Accept-Ranges
      accessControlMaxAge: 600

postgresql:
  enabled: true
  global:
    postgresql:
      auth:
        database: tams
        existingSecret: tams-postgresql-auth
        secretKeys:
          userPasswordKey: password
  primary:
    extraEnvVars:
      - name: POSTGRESQL_INIT_MAX_TIMEOUT
        value: "300"
    initdb:
      scriptsConfigMap: tams-db-init

rustfs:
  enabled: true
  secret:
    existingSecret: tams-rustfs-auth
  mode:
    standalone:
      enabled: true
    distributed:
      enabled: false
  config:
    rustfs:
      log_level: warn
  extraEnv:
    # Standalone mode is one pod/one PVC; disable parity that requires more drives.
    - name: RUSTFS_STORAGE_CLASS_STANDARD
      value: "EC:0"
    - name: RUSTFS_ERASURE_SET_DRIVE_COUNT
      value: "1"
  ingress:
    enabled: false
  gatewayApi:
    enabled: false

rustfsGatewayApi:
  enabled: true
  existingGateway:
    name: traefik
    namespace: traefik
  hostname: s3.tamoss.localtest.me
  servicePort: 9000
  filters:
    - type: ExtensionRef
      extensionRef:
        group: traefik.io
        kind: Middleware
        name: cors
  listeners:
    http:
      name: web
    https:
      name: websecure

tams:
  enabled: true
  secrets:
    apiToken:
      generate: true
  auth:
    required: true
    trustForwardAuthHeaders: false
    oauth2:
      enabled: true
      issuer: https://auth.tamoss.localtest.me/application/o/tams-api/
      jwksUri: http://authentik-server.authentik.svc.cluster.local/application/o/tams-api/jwks/
      audience: ""
      requiredScopes: []
      algorithms:
        - RS256
  api:
    enabled: true
    replicaCount: 2
    env: {}
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 3
      targetCPUUtilizationPercentage: 80
    pdb:
      enabled: true
  worker:
    enabled: true
  ui:
    enabled: true
    replicaCount: 2
    env:
      TAMOSS_API_URL: /api
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 3
      targetCPUUtilizationPercentage: 80
    pdb:
      enabled: true
  backends:
    db:
      host: tams-postgresql
      port: "5432"
      database: tams
      auth:
        existingSecret: tams-postgresql-auth
        secretKeys:
          username: username
          password: password
    s3:
      endpoint:
        default:
          url: http://tams-rustfs-svc:9000
        public:
          url: https://s3.tamoss.localtest.me
      auth:
        existingSecret: tams-rustfs-auth
        secretKeys:
          accessKey: RUSTFS_ACCESS_KEY
          secretKey: RUSTFS_SECRET_KEY
      region: us-east-1
      bucket: tamoss
  ingress:
    enabled: false
  httpRoute:
    enabled: true
    parentRefs:
      - name: traefik
        namespace: traefik
        kind: Gateway
        sectionName: websecure
    api:
      hostnames:
        - api.tamoss.localtest.me
      defaultFilters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: cors
    ui:
      hostnames:
        - app.tamoss.localtest.me
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /outpost.goauthentik.io/
          backendRefs:
            - name: authentik-server
              namespace: authentik
              port: 80
              weight: 1
        - matches:
            - path:
                type: PathPrefix
                value: /assets/
          filters:
            - type: ExtensionRef
              extensionRef:
                group: traefik.io
                kind: Middleware
                name: cors
          backendRefs:
            - name: tams-ui
              port: 3000
              weight: 1
        - matches:
            - path:
                type: PathPrefix
                value: /api
          filters:
            - type: ExtensionRef
              extensionRef:
                group: traefik.io
                kind: Middleware
                name: authentik
            - type: ExtensionRef
              extensionRef:
                group: traefik.io
                kind: Middleware
                name: cors
          backendRefs:
            - name: tams-ui
              port: 3000
              weight: 1
        - matches:
            - path:
                type: PathPrefix
                value: /
          filters:
            - type: ExtensionRef
              extensionRef:
                group: traefik.io
                kind: Middleware
                name: authentik
            - type: ExtensionRef
              extensionRef:
                group: traefik.io
                kind: Middleware
                name: cors
          backendRefs:
            - name: tams-ui
              port: 3000
              weight: 1
  networkPolicy:
    enabled: false
