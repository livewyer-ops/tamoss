{{- $np := default dict .Values.networkPolicy -}}
{{- if $np.enabled -}}
{{- $ingressController := default dict $np.ingressController -}}
{{- $controllerNamespaceLabels := default (dict "kubernetes.io/metadata.name" "traefik") $ingressController.namespaceLabels -}}
{{- $controllerPodLabels := default (dict "app.kubernetes.io/name" "traefik") $ingressController.podLabels -}}
{{- $authentik := default dict $np.authentik -}}
{{- $authentikEnabled := default false $authentik.enabled -}}
{{- $authNamespace := default (default .Values.platform.namespaces.auth .Values.platform.authentikConfig.namespace) $authentik.namespace -}}
{{- $authInstance := default "authentik" $authentik.instance -}}
{{- $releaseNamespace := default .Release.Namespace .Values.platform.releaseNamespace -}}
{{- if .Values.rustfs.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-rustfs
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: rustfs
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: rustfs
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/name: tams
              app.kubernetes.io/component: api
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/name: tams
              app.kubernetes.io/component: worker
      ports:
        - protocol: TCP
          port: 9000
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $controllerNamespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $controllerPodLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: 9000
{{- end }}
{{- if $authentikEnabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $authInstance }}-server
  namespace: {{ $authNamespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ $authInstance }}
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $authInstance }}
      app.kubernetes.io/name: authentik
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $controllerNamespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $controllerPodLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9443
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $releaseNamespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/name: tams
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 9000
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $authInstance }}
              app.kubernetes.io/name: authentik
              app.kubernetes.io/component: worker
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $authInstance }}-worker
  namespace: {{ $authNamespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ $authInstance }}
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $authInstance }}
      app.kubernetes.io/name: authentik
      app.kubernetes.io/component: worker
  policyTypes:
    - Ingress
  ingress: []
{{- end }}
{{- end }}
