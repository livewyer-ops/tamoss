{{- $gatewayApi := default dict .Values.rustfsGatewayApi -}}
{{- if and .Values.rustfs.enabled $gatewayApi.enabled -}}
{{- $existingGateway := default dict $gatewayApi.existingGateway -}}
{{- $listeners := default dict $gatewayApi.listeners -}}
{{- $httpListener := default dict $listeners.http -}}
{{- $httpsListener := default dict $listeners.https -}}
{{- $fullName := include "tams-stack.rustfsFullname" . -}}
{{- $serviceName := default (printf "%s-svc" $fullName) $gatewayApi.serviceName -}}
{{- $routeName := default (printf "%s-route" $fullName) $gatewayApi.routeName -}}
{{- $redirectRouteName := default (printf "%s-redirect" $fullName) $gatewayApi.redirectRouteName -}}
{{- $servicePort := int (default 9000 $gatewayApi.servicePort) -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $routeName }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ required "rustfsGatewayApi.existingGateway.name is required when rustfsGatewayApi.enabled=true" $existingGateway.name }}
      namespace: {{ default "traefik" $existingGateway.namespace }}
      sectionName: {{ default "websecure" $httpsListener.name }}
  hostnames:
    - {{ required "rustfsGatewayApi.hostname is required when rustfsGatewayApi.enabled=true" $gatewayApi.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      {{- with $gatewayApi.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ $serviceName }}
          port: {{ $servicePort }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $redirectRouteName }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ required "rustfsGatewayApi.existingGateway.name is required when rustfsGatewayApi.enabled=true" $existingGateway.name }}
      namespace: {{ default "traefik" $existingGateway.namespace }}
      sectionName: {{ default "web" $httpListener.name }}
  hostnames:
    - {{ required "rustfsGatewayApi.hostname is required when rustfsGatewayApi.enabled=true" $gatewayApi.hostname | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end -}}
