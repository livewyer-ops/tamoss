apiVersion: apps/v1
kind: Deployment
metadata:
  name: tamoss-api
spec:
  template:
    spec:
      serviceAccountName: tamoss-workload
      containers:
      - name: api
        (env[?name == 'TAMOSS_S3_ACCESS_KEY'] | length(@)): 0
        (env[?name == 'TAMOSS_S3_SECRET_KEY'] | length(@)): 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tamoss-worker
spec:
  template:
    spec:
      serviceAccountName: tamoss-workload
      containers:
      - name: worker
        (env[?name == 'TAMOSS_S3_ACCESS_KEY'] | length(@)): 0
        (env[?name == 'TAMOSS_S3_SECRET_KEY'] | length(@)): 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tamoss-ui
spec:
  template:
    metadata:
      annotations:
        eks.amazonaws.com/skip-containers: ui
    spec:
      automountServiceAccountToken: false
      containers:
      - name: ui
        (env[?starts_with(name, 'AWS_')] | length(@)): 0
      (length(volumes[?name == 'identity'] || `[]`)): 0
---
apiVersion: v1
kind: Secret
metadata:
  name: tamoss-storage-backend-credentials
(json_parse(base64_decode(data."credentials.json")).credentials | length(@)): 1
? (json_parse(base64_decode(data."credentials.json")).credentials[?storageBackendId
  == '11111111-1111-5111-8111-111111111111'] | length(@))
: 1
