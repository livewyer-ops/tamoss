apiVersion: apps/v1
kind: Deployment
metadata:
  name: tamoss-api
spec:
  template:
    spec:
      serviceAccountName: tamoss-workload
      containers:
      - name: api
        (env[?name == 'TAMOSS_S3_ACCESS_KEY'] | [0].valueFrom.secretKeyRef.name): tams-rustfs-auth
        (env[?name == 'TAMOSS_S3_SECRET_KEY'] | [0].valueFrom.secretKeyRef.name): tams-rustfs-auth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tamoss-worker
spec:
  template:
    spec:
      serviceAccountName: tamoss-workload
      containers:
      - name: worker
        (env[?name == 'TAMOSS_S3_ACCESS_KEY'] | [0].valueFrom.secretKeyRef.name): tams-rustfs-auth
        (env[?name == 'TAMOSS_S3_SECRET_KEY'] | [0].valueFrom.secretKeyRef.name): tams-rustfs-auth
---
apiVersion: v1
kind: Secret
metadata:
  name: tamoss-storage-backend-credentials
(json_parse(base64_decode(data."credentials.json")).credentials | length(@)): 2
? (json_parse(base64_decode(data."credentials.json")).credentials[?storageBackendId
  == '11111111-1111-5111-8111-111111111111'] | length(@))
: 1
