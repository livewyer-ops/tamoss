apiVersion: batch/v1
kind: Job
metadata:
  name: archive-create-bucket
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/part-of: tamoss-chainsaw
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs-create-bucket
    spec:
      restartPolicy: OnFailure
      containers:
      - name: awscli
        image: amazon/aws-cli:2.32.34
        imagePullPolicy: IfNotPresent
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: tams-rustfs-auth
              key: RUSTFS_ACCESS_KEY
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: tams-rustfs-auth
              key: RUSTFS_SECRET_KEY
        - name: AWS_DEFAULT_REGION
          value: us-east-1
        command:
        - aws
        args:
        - --endpoint-url
        - http://rustfs-svc:9000
        - s3api
        - create-bucket
        - --bucket
        - archive
