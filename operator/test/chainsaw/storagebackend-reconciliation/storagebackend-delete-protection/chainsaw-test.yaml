apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: storagebackend-delete-protection
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: release
    test.tamoss.io/domain: storage
    test.tamoss.io/lifecycle: destructive
    test.tamoss.io/provider: rustfs
    test.tamoss.io/profile: none
spec:
  steps:
    - name: apply unconfirmed storage backend
      try:
        - apply:
            file: ../../fixtures/operator-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/external-backend-secrets.yaml
        - apply:
            file: ../../fixtures/tamoss-external.yaml
        - apply:
            file: resources/archive-storagebackend.yaml
        - assert:
            file: assert/archive-storagebackend-present.yaml

    - name: unconfirmed delete is denied
      try:
        - delete:
            ref:
              apiVersion: tamoss.livewyer.io/v1alpha1
              kind: StorageBackend
              name: archive
            expect:
              - match:
                  apiVersion: tamoss.livewyer.io/v1alpha1
                  kind: StorageBackend
                  metadata:
                    name: archive
                check:
                  ($error != null): true
        - assert:
            file: assert/archive-storagebackend-present.yaml

    - name: confirmed delete is allowed
      try:
        - patch:
            resource:
              apiVersion: tamoss.livewyer.io/v1alpha1
              kind: StorageBackend
              metadata:
                name: archive
                namespace: ($namespace)
                annotations:
                  confirmation.tamoss.livewyer.io/deletion: "true"
        - delete:
            ref:
              apiVersion: tamoss.livewyer.io/v1alpha1
              kind: StorageBackend
              name: archive
        - wait:
            apiVersion: tamoss.livewyer.io/v1alpha1
            kind: StorageBackend
            name: archive
            timeout: 120s
            for:
              deletion: {}
