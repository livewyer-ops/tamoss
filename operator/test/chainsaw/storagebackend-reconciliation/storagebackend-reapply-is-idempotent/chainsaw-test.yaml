apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: storagebackend-reapply-is-idempotent
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: standard
    test.tamoss.io/domain: storage
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: rustfs
    test.tamoss.io/profile: none
spec:
  steps:
    - name: apply tamoss and storage backend
      try:
        - apply:
            file: ../../fixtures/operator-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/postgres.yaml
        - apply:
            file: ../../fixtures/rustfs.yaml
        - assert:
            file: ../../fixtures/assert/postgresql-available.yaml
        - assert:
            file: ../../fixtures/assert/rustfs-available.yaml
        - assert:
            file: ../../fixtures/assert/rustfs-bucket-ready.yaml
        - apply:
            file: ../../fixtures/tamoss-external.yaml
        - assert:
            file: assert/tamoss-ready.yaml
            timeout: 5m
        - apply:
            file: resources/archive-storagebackend.yaml
        - assert:
            file: assert/archive-storagebackend-ready.yaml
            timeout: 5m

    - name: snapshot storage backend state
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              # chainsaw-script: captures backend state and database row count before repeated apply.
              bucket_hash="$(kubectl -n "$NAMESPACE" get configmap archive-bucket-state -o jsonpath='{.data.desiredHash}')"
              db_hash="$(kubectl -n "$NAMESPACE" get configmap archive-db-state -o jsonpath='{.data.desiredHash}')"
              rows="$(kubectl -n "$NAMESPACE" exec deployment/postgresql -- psql -U tams -d tams -tAc "select count(*) from tamoss_storage_backends where id = '11111111-1111-5111-8111-111111111111';" | tr -d '[:space:]')"
              [ "$rows" = "1" ]
              kubectl -n "$NAMESPACE" create configmap storagebackend-idempotency-snapshot \
                --from-literal=bucketHash="$bucket_hash" \
                --from-literal=dbHash="$db_hash" \
                --from-literal=rowCount="$rows"

    - name: reapply storage backend
      try:
        - apply:
            file: resources/archive-storagebackend.yaml
        - assert:
            file: assert/archive-storagebackend-ready.yaml
            timeout: 5m
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              # chainsaw-script: compares historical backend state and row count after repeated apply.
              expect() {
                kubectl -n "$NAMESPACE" get configmap storagebackend-idempotency-snapshot -o "jsonpath={.data.$1}"
              }
              [ "$(kubectl -n "$NAMESPACE" get configmap archive-bucket-state -o jsonpath='{.data.desiredHash}')" = "$(expect bucketHash)" ]
              [ "$(kubectl -n "$NAMESPACE" get configmap archive-db-state -o jsonpath='{.data.desiredHash}')" = "$(expect dbHash)" ]
              rows="$(kubectl -n "$NAMESPACE" exec deployment/postgresql -- psql -U tams -d tams -tAc "select count(*) from tamoss_storage_backends where id = '11111111-1111-5111-8111-111111111111';" | tr -d '[:space:]')"
              [ "$rows" = "$(expect rowCount)" ]
