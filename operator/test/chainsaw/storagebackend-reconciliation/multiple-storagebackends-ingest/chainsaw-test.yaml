apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: multiple-storagebackends-ingest
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: extended
    test.tamoss.io/domain: storage
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: mixed
    test.tamoss.io/profile: none
spec:
  steps:
    - name: apply multi backend instance
      try:
        - apply:
            file: ../../fixtures/operator-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/rustfs-crd.yaml
        - apply:
            file: ../../fixtures/rustfs-managed-tamoss.yaml
        - apply:
            file: ../../fixtures/postgres.yaml
        - assert:
            file: ../../fixtures/assert/postgresql-available.yaml
        - apply:
            file: resources/tamoss-api-bundled.yaml
        - patch:
            resource:
              apiVersion: rustfs.com/v1alpha1
              kind: Tenant
              metadata:
                name: tamoss-s3
                namespace: ($namespace)
              status:
                availableReplicas: 1
                currentState: Ready
                pools:
                  - ssName: tamoss-s3-pool-0
                    state: Ready
                conditions:
                  - type: Ready
                    status: "True"
                    reason: Ready
                    message: Tenant is ready
            subresource: status
            timeout: 60s
        - assert:
            file: assert/tamoss-default-ready.yaml
            timeout: 5m
        - apply:
            file: resources/archive-storagebackend.yaml
        - assert:
            file: assert/archive-storagebackend-ready.yaml
            timeout: 5m

    - name: ingest through each storage backend
      try:
        - apply:
            file: resources/ingest-check.yaml
        - wait:
            apiVersion: batch/v1
            kind: Job
            name: ingest-storagebackends-check
            timeout: 3m
            for:
              condition:
                name: Complete
