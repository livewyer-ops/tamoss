apiVersion: tamoss.livewyer.io/v1alpha1
kind: StorageBackend
metadata:
  name: archive
  annotations:
    confirmation.tamoss.livewyer.io/deletion: "true"
spec:
  id: 11111111-1111-5111-8111-111111111111
  tamossRef:
    name: tamoss
  provider: rustfs
  label: tamoss.us-east-1:s3:archive
  region: us-east-1
  bucketName: archive
  endpoint:
    default:
      url: (join('', ['http://tamoss-s3.', $namespace, '.svc:9000']))
    public:
      url: (join('', ['http://tamoss-s3.', $namespace, '.svc:9000']))
  credentials:
    existingSecret: tamoss-s3-creds
    secretKeys:
      accessKey: RUSTFS_ACCESS_KEY
      secretKey: RUSTFS_SECRET_KEY
