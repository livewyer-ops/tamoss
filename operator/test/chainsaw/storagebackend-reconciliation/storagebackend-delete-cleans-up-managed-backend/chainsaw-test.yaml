apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: storagebackend-delete-cleans-up-managed-backend
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: release
    test.tamoss.io/domain: storage
    test.tamoss.io/lifecycle: destructive
    test.tamoss.io/provider: rustfs
    test.tamoss.io/profile: none
spec:
  timeouts:
    exec: 5m
  steps:
    - name: apply managed storage backend
      try:
        - apply:
            file: ../../fixtures/operator-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/postgres.yaml
        - apply:
            file: ../../fixtures/rustfs.yaml
        - assert:
            file: ../../fixtures/assert/postgresql-available.yaml
        - assert:
            file: ../../fixtures/assert/rustfs-available.yaml
        - assert:
            file: ../../fixtures/assert/rustfs-bucket-ready.yaml
        - apply:
            file: ../../fixtures/tamoss-external.yaml
        - apply:
            file: resources/archive-storagebackend.yaml
        - assert:
            file: assert/archive-storagebackend-ready.yaml
            timeout: 5m
        - apply:
            file: resources/backend-present-check.yaml
        - wait:
            apiVersion: batch/v1
            kind: Job
            name: archive-backend-present-check
            timeout: 2m
            for:
              condition:
                name: Complete

    - name: unconfirmed delete is denied
      try:
        - delete:
            ref:
              apiVersion: tamoss.livewyer.io/v1alpha1
              kind: StorageBackend
              name: archive
            expect:
              - match:
                  apiVersion: tamoss.livewyer.io/v1alpha1
                  kind: StorageBackend
                  metadata:
                    name: archive
                check:
                  ($error != null): true
        - assert:
            file: assert/archive-storagebackend-present.yaml

    - name: confirmed delete cleans up provider state
      try:
        - patch:
            resource:
              apiVersion: tamoss.livewyer.io/v1alpha1
              kind: StorageBackend
              metadata:
                name: archive
                namespace: ($namespace)
                annotations:
                  confirmation.tamoss.livewyer.io/deletion: "true"
        - delete:
            ref:
              apiVersion: tamoss.livewyer.io/v1alpha1
              kind: StorageBackend
              name: archive
        - apply:
            file: resources/backend-deleted-check.yaml
        - wait:
            apiVersion: batch/v1
            kind: Job
            name: archive-backend-deleted-check
            timeout: 2m
            for:
              condition:
                name: Complete
