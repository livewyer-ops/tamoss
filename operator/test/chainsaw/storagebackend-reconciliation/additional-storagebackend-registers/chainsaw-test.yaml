apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: additional-storagebackend-registers
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: standard
    test.tamoss.io/domain: storage
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: rustfs
    test.tamoss.io/profile: none
spec:
  steps:
    - name: apply api instance and storage backend
      try:
        - apply:
            file: ../../fixtures/operator-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/postgres.yaml
        - apply:
            file: ../../fixtures/rustfs.yaml
        - assert:
            file: ../../fixtures/assert/postgresql-available.yaml
        - assert:
            file: ../../fixtures/assert/rustfs-available.yaml
        - assert:
            file: ../../fixtures/assert/rustfs-bucket-ready.yaml
        - apply:
            file: resources/tamoss-api.yaml
        - apply:
            file: resources/archive-storagebackend.yaml
        - assert:
            file: assert/archive-storagebackend-ready.yaml
            timeout: 5m
        - assert:
            file: assert/api-available.yaml
            timeout: 5m

    - name: check api storage backend list
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              # chainsaw-script: calls the TAMOSS API; Kubernetes readiness is asserted natively above.
              kubectl -n "$NAMESPACE" exec deployment/tamoss-api -- python -c '
              import json
              import urllib.request

              with urllib.request.urlopen("http://127.0.0.1:8000/service/storage-backends", timeout=10) as response:
                  payload = json.load(response)

              matches = [item for item in payload if item.get("id") == "11111111-1111-5111-8111-111111111111"]
              if len(matches) != 1:
                  raise SystemExit(f"expected one archive backend in API list, got {payload!r}")
              backend = matches[0]
              if backend.get("label") != "tamoss.us-east-1:s3:archive":
                  raise SystemExit(f"unexpected archive backend label: {backend!r}")
              '
