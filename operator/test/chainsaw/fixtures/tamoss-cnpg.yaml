apiVersion: tamoss.livewyer.io/v1alpha1
kind: Tamoss
metadata:
  name: tamoss
  annotations:
    confirmation.tamoss.livewyer.io/deletion: "true"
spec:
  fullnameOverride: tamoss
  auth:
    required: false
  api:
    enabled: true
    replicaCount: 0
  ui:
    enabled: true
    replicaCount: 0
  backends:
    db:
      providedBy: cnpg
      cnpg:
        instances: 3
        postgresVersion: "18"
        storage:
          size: 10Gi
    s3:
      providedBy: external
      external:
        endpoint:
          default:
            url: http://rustfs-svc:9000
        region: us-east-1
        bucket: tamoss
        auth:
          existingSecret: tams-rustfs-auth
          secretKeys:
            accessKey: RUSTFS_ACCESS_KEY
            secretKey: RUSTFS_SECRET_KEY
