apiVersion: apps/v1
kind: Deployment
metadata:
  name: tamoss-s3
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/instance: tamoss
    app.kubernetes.io/part-of: tamoss-chainsaw
    rustfs.tenant: tamoss-s3
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rustfs
      app.kubernetes.io/instance: tamoss
      rustfs.tenant: tamoss-s3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs
        app.kubernetes.io/instance: tamoss
        rustfs.tenant: tamoss-s3
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.0-beta.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: tamoss-s3-creds
                  key: RUSTFS_ACCESS_KEY
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tamoss-s3-creds
                  key: RUSTFS_SECRET_KEY
            - name: RUSTFS_ADDRESS
              value: :9000
            - name: RUSTFS_CONSOLE_ADDRESS
              value: :9001
            - name: RUSTFS_STORAGE_CLASS_STANDARD
              value: EC:0
            - name: RUSTFS_ERASURE_SET_DRIVE_COUNT
              value: "1"
            - name: RUSTFS_UNSAFE_BYPASS_DISK_CHECK
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
      volumes:
        - name: data
          emptyDir: {}
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tamoss-s3
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/instance: tamoss
    app.kubernetes.io/part-of: tamoss-chainsaw
spec:
  selector:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/instance: tamoss
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
