apiVersion: v1
kind: Secret
metadata:
  name: tams-rustfs-auth
type: Opaque
stringData:
  RUSTFS_ACCESS_KEY: rustfsadmin
  RUSTFS_SECRET_KEY: rustfsadmin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/part-of: tamoss-chainsaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rustfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.0-beta.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: tams-rustfs-auth
                  key: RUSTFS_ACCESS_KEY
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tams-rustfs-auth
                  key: RUSTFS_SECRET_KEY
            - name: RUSTFS_ADDRESS
              value: :9000
            - name: RUSTFS_CONSOLE_ADDRESS
              value: :9001
            - name: RUSTFS_STORAGE_CLASS_STANDARD
              value: EC:0
            - name: RUSTFS_ERASURE_SET_DRIVE_COUNT
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
      volumes:
        - name: data
          emptyDir: {}
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs-svc
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/part-of: tamoss-chainsaw
spec:
  selector:
    app.kubernetes.io/name: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-create-bucket
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/part-of: tamoss-chainsaw
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs-create-bucket
    spec:
      restartPolicy: OnFailure
      containers:
        - name: awscli
          image: amazon/aws-cli:2.32.34
          imagePullPolicy: IfNotPresent
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: tams-rustfs-auth
                  key: RUSTFS_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: tams-rustfs-auth
                  key: RUSTFS_SECRET_KEY
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          command:
            - /bin/sh
            - -ec
            - |
              for i in $(seq 1 60); do
                if aws --endpoint-url http://rustfs-svc:9000 s3api head-bucket --bucket tamoss >/dev/null 2>&1; then
                  exit 0
                fi
                if aws --endpoint-url http://rustfs-svc:9000 s3api create-bucket --bucket tamoss >/dev/null 2>&1; then
                  exit 0
                fi
                sleep 2
              done
              aws --endpoint-url http://rustfs-svc:9000 s3api create-bucket --bucket tamoss
