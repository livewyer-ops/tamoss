apiVersion: v1
kind: Namespace
metadata:
  name: auth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-chainsaw
  namespace: auth
  labels:
    app.kubernetes.io/name: authentik-chainsaw
    app.kubernetes.io/part-of: tamoss-chainsaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik-chainsaw
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-chainsaw
    spec:
      containers:
        - name: oidc-probe
          image: livewyer/tamoss-chainsaw:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9000
          command:
            - /app/.venv/bin/python
            - /tests/authentik_server.py
          readinessProbe:
            httpGet:
              path: /application/o/probe/.well-known/openid-configuration
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-chainsaw
  namespace: auth
  labels:
    app.kubernetes.io/name: authentik-chainsaw
    app.kubernetes.io/part-of: tamoss-chainsaw
spec:
  selector:
    app.kubernetes.io/name: authentik-chainsaw
  ports:
    - name: http
      port: 9000
      targetPort: http
---
apiVersion: v1
kind: Secret
metadata:
  name: authentik-chainsaw-api-token
  namespace: auth
  labels:
    app.kubernetes.io/name: authentik-chainsaw
    app.kubernetes.io/part-of: tamoss-chainsaw
type: Opaque
stringData:
  token: test-token
