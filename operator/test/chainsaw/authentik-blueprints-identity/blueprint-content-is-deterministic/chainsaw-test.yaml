apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: blueprint-content-is-deterministic
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: standard
    test.tamoss.io/domain: auth
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: authentik
    test.tamoss.io/profile: none
spec:
  steps:
    - name: apply authentik-backed instance and inspect blueprint content
      try:
        - apply:
            file: ../../fixtures/authentik.yaml
        - apply:
            file: ../../fixtures/auth-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/operator-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/external-backend-secrets.yaml
        - assert:
            file: ../../fixtures/assert/authentik-available.yaml
            timeout: 180s
        - apply:
            file: ../../fixtures/tamoss-authentik.yaml
        - assert:
            file: assert/identity-blueprint-submitted.yaml
            timeout: 2m
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              # chainsaw-script: inspects the Authentik fixture debug API and compares blueprint payloads over time.
              blueprint="tamoss-${NAMESPACE}-tamoss"
              read_payload() {
                ../../scripts/print-authentik-blueprint.sh "$blueprint"
              }
              payload_has() {
                case "$payload" in
                  *"$1"*) return 0 ;;
                  *) return 1 ;;
                esac
              }
              payload_is_expected() {
                case "$payload" in
                  "version: 1"*) ;;
                  *) return 1 ;;
                esac
                case "$payload" in
                  *'version: "1"'*) return 1 ;;
                esac
                payload_has "signing_key: !Find" &&
                  payload_has "authentik Self-signed Certificate" &&
                  payload_has "scope_name: tams-api/admin" &&
                  payload_has "scope_name: tams-api/read" &&
                  payload_has "scope_name: tams-api/write" &&
                  payload_has "scope_name: tams-api/delete"
              }
              end=$(($(date +%s) + 120))
              until payload="$(read_payload)" && payload_is_expected; do
                if [ "$(date +%s)" -ge "$end" ]; then
                  echo "timed out waiting for expected managed Blueprint content" >&2
                  exit 1
                fi
                sleep 2
              done
              first_payload="$payload"
              ../../scripts/reconcile-tamoss.sh tamoss
              end=$(($(date +%s) + 120))
              until second_payload="$(read_payload)" && [ "$first_payload" = "$second_payload" ]; do
                if [ "$(date +%s)" -ge "$end" ]; then
                  echo "timed out waiting for deterministic managed Blueprint content" >&2
                  exit 1
                fi
                sleep 2
              done
              ../../scripts/assert-authentik-apply-count.sh "$blueprint" 2 120
