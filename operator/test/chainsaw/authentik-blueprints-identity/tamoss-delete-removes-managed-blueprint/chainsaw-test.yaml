apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: tamoss-delete-removes-managed-blueprint
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: extended
    test.tamoss.io/domain: auth
    test.tamoss.io/lifecycle: destructive
    test.tamoss.io/provider: authentik
    test.tamoss.io/profile: none
spec:
  steps:
    - name: apply authentik-backed instance
      try:
        - apply:
            file: ../../fixtures/authentik.yaml
        - apply:
            file: ../../fixtures/auth-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/operator-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/external-backend-secrets.yaml
        - assert:
            file: ../../fixtures/assert/authentik-available.yaml
            timeout: 180s
        - apply:
            file: ../../fixtures/tamoss-authentik.yaml
        - assert:
            file: assert/managed-blueprint-ready-for-delete.yaml
            timeout: 2m
        - patch:
            resource:
              apiVersion: tamoss.livewyer.io/v1alpha1
              kind: Tamoss
              metadata:
                name: tamoss
                namespace: ($namespace)
                annotations:
                  confirmation.tamoss.livewyer.io/deletion: "true"
        - delete:
            ref:
              apiVersion: tamoss.livewyer.io/v1alpha1
              kind: Tamoss
              name: tamoss
        - wait:
            apiVersion: tamoss.livewyer.io/v1alpha1
            kind: Tamoss
            name: tamoss
            timeout: 120s
            for:
              deletion: {}
        - command:
            entrypoint: kubectl
            env:
              - name: BLUEPRINT_NAME
                value: (join('', ['tamoss-', $namespace, '-tamoss']))
            args:
              - -n
              - auth
              - exec
              - deployment/authentik-chainsaw
              - --
              - wget
              - -qO-
              - -T
              - "10"
              - http://127.0.0.1:9000/debug/blueprints/$BLUEPRINT_NAME
            timeout: 30s
            check:
              ($error == null): true
              (trim_space($stdout)): ""
