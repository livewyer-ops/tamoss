apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: two-instances-share-platform
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: extended
    test.tamoss.io/domain: auth
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: authentik
    test.tamoss.io/profile: none
spec:
  steps:
    - name: apply shared platform and two instances
      try:
        - apply:
            file: ../../fixtures/authentik.yaml
        - apply:
            file: ../../fixtures/auth-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/operator-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/external-backend-secrets.yaml
        - apply:
            file: resources/schema-state.yaml
        - assert:
            file: ../../fixtures/assert/authentik-available.yaml
            timeout: 180s
        - apply:
            file: resources/tamoss-instances.yaml
        - assert:
            file: assert/distinct-oauth-workloads.yaml
            timeout: 120s

    - name: verify distinct platform blueprints
      try:
        - command:
            entrypoint: kubectl
            args:
              - -n
              - auth
              - exec
              - deployment/authentik-chainsaw
              - --
              - wget
              - -qO-
              - -T
              - "10"
              - http://127.0.0.1:9000/debug/applies/tamoss-alpha
            timeout: 30s
            check:
              ($error == null): true
              (trim_space($stdout)): "1"
        - command:
            entrypoint: kubectl
            args:
              - -n
              - auth
              - exec
              - deployment/authentik-chainsaw
              - --
              - wget
              - -qO-
              - -T
              - "10"
              - http://127.0.0.1:9000/debug/blueprints/tamoss-alpha
            timeout: 30s
            check:
              ($error == null): true
              (contains($stdout, 'https://alpha.tamoss.test/auth/callback')): true
        - command:
            entrypoint: kubectl
            args:
              - -n
              - auth
              - exec
              - deployment/authentik-chainsaw
              - --
              - wget
              - -qO-
              - -T
              - "10"
              - http://127.0.0.1:9000/debug/applies/tamoss-beta
            timeout: 30s
            check:
              ($error == null): true
              (trim_space($stdout)): "1"
        - command:
            entrypoint: kubectl
            args:
              - -n
              - auth
              - exec
              - deployment/authentik-chainsaw
              - --
              - wget
              - -qO-
              - -T
              - "10"
              - http://127.0.0.1:9000/debug/blueprints/tamoss-beta
            timeout: 30s
            check:
              ($error == null): true
              (contains($stdout, 'https://beta.tamoss.test/auth/callback')): true
