apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: two-instances-share-platform
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: extended
    test.tamoss.io/domain: auth
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: authentik
    test.tamoss.io/profile: none
spec:
  steps:
    - name: apply shared platform and two instances
      try:
        - apply:
            file: ../../fixtures/authentik.yaml
        - apply:
            file: ../../fixtures/auth-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/operator-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/external-backend-secrets.yaml
        - apply:
            file: resources/schema-state.yaml
        - assert:
            file: ../../fixtures/assert/authentik-available.yaml
            timeout: 180s
        - apply:
            file: resources/tamoss-instances.yaml
        - assert:
            file: assert/distinct-oauth-workloads.yaml
            timeout: 120s

    - name: verify distinct platform blueprints
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              # chainsaw-script: checks the Authentik fixture debug API for per-instance Blueprint content.
              check_blueprint() {
                name="$1"
                redirect="$2"
                ../../scripts/assert-authentik-apply-count.sh "$name" 1 120
                ../../scripts/print-authentik-blueprint.sh "$name" |
                  grep -q "$redirect"
              }
              check_blueprint tamoss-alpha https://alpha.tamoss.test/auth/callback
              check_blueprint tamoss-beta https://beta.tamoss.test/auth/callback
