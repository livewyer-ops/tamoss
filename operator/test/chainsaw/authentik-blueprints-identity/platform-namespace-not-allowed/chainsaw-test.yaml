apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: platform-namespace-not-allowed
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: standard
    test.tamoss.io/domain: auth
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: authentik
    test.tamoss.io/profile: none
spec:
  steps:
    - name: apply blocked authentik platform namespace
      try:
        - apply:
            file: ../../fixtures/authentik.yaml
        - apply:
            file: ../../fixtures/auth-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/operator-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/external-backend-secrets.yaml
        - apply:
            file: resources/other-auth-rbac.yaml
        - assert:
            file: ../../fixtures/assert/authentik-available.yaml
            timeout: 180s
        - apply:
            file: resources/tamoss.yaml
        - assert:
            file: assert/platform-namespace-not-allowed.yaml
            timeout: 2m
        - command:
            entrypoint: kubectl
            env:
              - name: BLUEPRINT_NAME
                value: (join('', ['tamoss-', $namespace, '-auth-blocked']))
            args:
              - -n
              - auth
              - exec
              - deployment/authentik-chainsaw
              - --
              - wget
              - -qO-
              - -T
              - "10"
              - http://127.0.0.1:9000/debug/applies/$BLUEPRINT_NAME
            timeout: 30s
            check:
              ($error == null): true
              (trim_space($stdout)): "0"
