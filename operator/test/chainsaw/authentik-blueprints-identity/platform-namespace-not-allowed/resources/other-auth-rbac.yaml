apiVersion: v1
kind: Namespace
metadata:
  name: other-auth
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: operator-manager-role
  namespace: other-auth
rules:
  - apiGroups: [""]
    resources: [configmaps, events, persistentvolumeclaims, pods, secrets, serviceaccounts, services]
    verbs: [create, delete, get, list, patch, update, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: operator-manager-rolebinding
  namespace: other-auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: operator-manager-role
subjects:
  - kind: ServiceAccount
    name: operator-controller-manager
    namespace: tamoss-system
