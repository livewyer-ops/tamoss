apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: outage-recovers-with-stable-oauth-creds
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: extended
    test.tamoss.io/domain: auth
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: authentik
    test.tamoss.io/profile: none
spec:
  steps:
    - name: apply ready authentik-backed instance
      try:
        - apply:
            file: ../../fixtures/authentik.yaml
        - apply:
            file: ../../fixtures/auth-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/operator-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/external-backend-secrets.yaml
        - apply:
            file: ../../fixtures/schema-state.yaml
        - assert:
            file: ../../fixtures/assert/authentik-available.yaml
            timeout: 180s
        - apply:
            file: ../../fixtures/tamoss-authentik.yaml
        - assert:
            file: assert/identity-ready.yaml
        - create:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: oauth-snapshot
                namespace: ($namespace)
              data:
                client_id: (x_k8s_get($client, 'v1', 'Secret', $namespace, 'tamoss-oauth2-creds').data.client_id)
                client_secret: (x_k8s_get($client, 'v1', 'Secret', $namespace, 'tamoss-oauth2-creds').data.client_secret)
    - name: outage reports identity not ready
      try:
        - patch:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: authentik-chainsaw
                namespace: auth
              spec:
                replicas: 0
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: authentik-chainsaw
                namespace: auth
              status:
                (not_null(availableReplicas, `0`)): 0
            timeout: 60s
        - wait:
            apiVersion: v1
            kind: Pod
            namespace: auth
            selector: app.kubernetes.io/name=authentik-chainsaw
            timeout: 120s
            for:
              deletion: {}
        - patch:
            resource:
              apiVersion: tamoss.livewyer.io/v1alpha1
              kind: Tamoss
              metadata:
                name: tamoss
                namespace: ($namespace)
                annotations:
                  chainsaw.livewyer.io/identity-transition: outage
        - assert:
            file: assert/identity-unavailable.yaml
    - name: recovery restores identity without rotating creds
      try:
        - patch:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: authentik-chainsaw
                namespace: auth
              spec:
                replicas: 1
        - wait:
            apiVersion: apps/v1
            kind: Deployment
            namespace: auth
            name: authentik-chainsaw
            timeout: 180s
            for:
              condition:
                name: Available
        - patch:
            resource:
              apiVersion: tamoss.livewyer.io/v1alpha1
              kind: Tamoss
              metadata:
                name: tamoss
                namespace: ($namespace)
                annotations:
                  chainsaw.livewyer.io/identity-transition: recovery
        - assert:
            file: assert/identity-ready.yaml
        - assert:
            resource:
              (x_k8s_get($client, 'v1', 'Secret', $namespace, 'tamoss-oauth2-creds')):
                data:
                  client_id: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'oauth-snapshot').data.client_id)
                  client_secret: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'oauth-snapshot').data.client_secret)
            timeout: 30s
