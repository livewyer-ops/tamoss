apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: oauth-creds-stable-across-reconciles
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: standard
    test.tamoss.io/domain: auth
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: authentik
    test.tamoss.io/profile: none
spec:
  steps:
    - name: apply authentik-backed instance and force reconciles
      try:
        - apply:
            file: ../../fixtures/authentik.yaml
        - apply:
            file: ../../fixtures/auth-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/operator-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/external-backend-secrets.yaml
        - assert:
            file: ../../fixtures/assert/authentik-available.yaml
            timeout: 180s
        - apply:
            file: ../../fixtures/tamoss-authentik.yaml
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              end=$(($(date +%s) + 120))
              until kubectl -n "$NAMESPACE" get secret tamoss-oauth2-creds >/dev/null 2>&1; do
                if [ "$(date +%s)" -ge "$end" ]; then
                  echo "timed out waiting for OAuth credentials Secret" >&2
                  exit 1
                fi
                sleep 2
              done
              first_id="$(kubectl -n "$NAMESPACE" get secret tamoss-oauth2-creds -o jsonpath='{.data.client_id}')"
              first_secret="$(kubectl -n "$NAMESPACE" get secret tamoss-oauth2-creds -o jsonpath='{.data.client_secret}')"
              ../../scripts/reconcile-tamoss.sh tamoss
              sleep 5
              ../../scripts/reconcile-tamoss.sh tamoss
              sleep 5
              second_id="$(kubectl -n "$NAMESPACE" get secret tamoss-oauth2-creds -o jsonpath='{.data.client_id}')"
              second_secret="$(kubectl -n "$NAMESPACE" get secret tamoss-oauth2-creds -o jsonpath='{.data.client_secret}')"
              [ "$first_id" = "$second_id" ]
              [ "$first_secret" = "$second_secret" ]
