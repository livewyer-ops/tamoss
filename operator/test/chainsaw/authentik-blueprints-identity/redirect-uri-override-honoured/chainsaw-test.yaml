apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: redirect-uri-override-honoured
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: standard
    test.tamoss.io/domain: auth
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: authentik
    test.tamoss.io/profile: none
spec:
  steps:
    - name: apply redirect override instance
      try:
        - apply:
            file: ../../fixtures/authentik.yaml
        - apply:
            file: ../../fixtures/auth-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/operator-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/external-backend-secrets.yaml
        - assert:
            file: ../../fixtures/assert/authentik-available.yaml
            timeout: 180s
        - apply:
            file: resources/tamoss.yaml
        - assert:
            file: assert/identity-blueprint-submitted.yaml
            timeout: 2m
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              # chainsaw-script: reads the Authentik fixture debug API to verify rendered redirect URI content.
              blueprint="tamoss-${NAMESPACE}-auth-override"
              payload="$(../../scripts/print-authentik-blueprint.sh "$blueprint")"
              printf '%s' "$payload" | grep -q "https://override-a.example.com/cb"
              printf '%s' "$payload" | grep -q "https://override-b.example.com/cb"
              ! printf '%s' "$payload" | grep -q "https://app.auth-override.test/auth/callback"
