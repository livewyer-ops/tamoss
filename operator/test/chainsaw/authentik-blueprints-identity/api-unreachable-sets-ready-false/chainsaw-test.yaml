apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: api-unreachable-sets-ready-false
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: standard
    test.tamoss.io/domain: auth
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: authentik
    test.tamoss.io/profile: none
spec:
  steps:
    - name: apply unreachable authentik instance
      try:
        - apply:
            file: ../../fixtures/authentik.yaml
        - apply:
            file: ../../fixtures/auth-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/operator-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/external-backend-secrets.yaml
        - assert:
            file: ../../fixtures/assert/authentik-available.yaml
            timeout: 180s
        - apply:
            file: resources/tamoss.yaml
        - assert:
            file: assert/identity-apply-failed.yaml
            timeout: 2m
        - assert:
            file: assert/identity-apply-failed-event.yaml
            timeout: 1m
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              # chainsaw-script: compares Event counts before and after forced reconciles to verify throttling.
              before="$(kubectl -n "$NAMESPACE" get events --field-selector involvedObject.name=auth-unreachable,reason=AuthentikManagedBlueprintApplyFailed --no-headers | wc -l | tr -d ' ')"
              ../../scripts/reconcile-tamoss.sh auth-unreachable
              sleep 2
              ../../scripts/reconcile-tamoss.sh auth-unreachable
              sleep 2
              after="$(kubectl -n "$NAMESPACE" get events --field-selector involvedObject.name=auth-unreachable,reason=AuthentikManagedBlueprintApplyFailed --no-headers | wc -l | tr -d ' ')"
              if [ "$after" -gt "$before" ]; then
                echo "expected repeated Authentik warnings to be throttled; before=$before after=$after" >&2
                exit 1
              fi
