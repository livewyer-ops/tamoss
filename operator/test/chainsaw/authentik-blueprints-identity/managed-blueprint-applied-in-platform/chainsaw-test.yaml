apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: managed-blueprint-applied-in-platform
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: standard
    test.tamoss.io/domain: auth
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: authentik
    test.tamoss.io/profile: none
spec:
  steps:
    - name: apply authentik-backed instance
      try:
        - apply:
            file: ../../fixtures/authentik.yaml
        - apply:
            file: ../../fixtures/auth-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/operator-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/external-backend-secrets.yaml
        - assert:
            file: ../../fixtures/assert/authentik-available.yaml
            timeout: 180s
        - apply:
            file: ../../fixtures/tamoss-authentik.yaml
        - assert:
            file: assert/identity-blueprint-submitted.yaml
            timeout: 2m
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              # chainsaw-script: verifies dynamic managed blueprint name and Authentik fixture apply count.
              blueprint="tamoss-${NAMESPACE}-tamoss"
              [ "$(kubectl -n "$NAMESPACE" get tamoss tamoss -o jsonpath='{.status.auth.managedBlueprint}')" = "$blueprint" ]
              ../../scripts/assert-authentik-apply-count.sh "$blueprint" 1 120
