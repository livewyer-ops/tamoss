apiVersion: v1
kind: Secret
metadata:
  name: tamoss-oauth2-creds
type: Opaque
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tamoss-api
(spec.template.spec.containers[0].envFrom[?secretRef.name == 'tamoss-oauth2-creds'] | [0].secretRef.name): tamoss-oauth2-creds
(spec.template.spec.containers[0].env[?name == 'TAMOSS_OAUTH2_ENABLED'] | [0].value): "true"
(spec.template.spec.containers[0].env[?name == 'TAMOSS_OAUTH2_ALGORITHMS'] | [0].value): RS256
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tamoss-ui
(spec.template.spec.containers[0].envFrom[?secretRef.name == 'tamoss-oauth2-creds'] | [0].secretRef.name): tamoss-oauth2-creds
(spec.template.spec.containers[0].env[?name == 'TAMOSS_OAUTH2_ENABLED'] | [0].value): "true"
