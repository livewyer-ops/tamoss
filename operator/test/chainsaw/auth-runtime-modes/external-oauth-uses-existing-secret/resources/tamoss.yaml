apiVersion: tamoss.livewyer.io/v1alpha1
kind: Tamoss
metadata:
  name: external-oauth
  annotations:
    confirmation.tamoss.livewyer.io/deletion: "true"
spec:
  fullnameOverride: external-oauth
  auth:
    providedBy: external
    required: true
    external:
      oauth2:
        enabled: true
        issuer: https://auth.example.test/application/o/tamoss/
        jwksUri: https://auth.example.test/application/o/tamoss/jwks/
        audience: tamoss
        requiredScopes:
          - openid
          - profile
        algorithms:
          - RS256
        clientCredentialsSecret:
          existingSecret: external-oauth-creds
  api:
    enabled: true
    replicaCount: 0
  ui:
    enabled: true
    replicaCount: 0
  worker:
    enabled: false
    replicaCount: 0
  backends:
    db:
      providedBy: external
      external:
        host: postgresql
        port: "5432"
        database: tams
        auth:
          existingSecret: tams-postgresql-auth
          secretKeys:
            username: username
            password: password
    s3:
      providedBy: external
      external:
        endpoint:
          default:
            url: http://rustfs-svc:9000
        region: us-east-1
        bucket: tamoss
        auth:
          existingSecret: tams-rustfs-auth
          secretKeys:
            accessKey: RUSTFS_ACCESS_KEY
            secretKey: RUSTFS_SECRET_KEY
  httpRoute:
    enabled: false
  networkPolicy:
    enabled: false
