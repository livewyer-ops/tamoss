apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: auth-runtime-modes-render-correctly
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: smoke
    test.tamoss.io/domain: auth
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: none
    test.tamoss.io/profile: none
spec:
  steps:
    - name: apply auth-none instance
      try:
        - apply:
            file: ../../fixtures/operator-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/external-backend-secrets.yaml
        - apply:
            file: ../../fixtures/schema-state.yaml
        - apply:
            file: resources/tamoss.yaml
        - assert:
            file: assert/no-oauth-runtime.yaml
            timeout: 120s
        - error:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: auth-none-oauth2-creds
                namespace: ($namespace)
            timeout: 5s

    - name: apply external oauth instance
      try:
        - apply:
            file: resources/external-oauth-secret.yaml
        - apply:
            file: resources/external-oauth-schema-state.yaml
        - apply:
            file: resources/external-oauth-tamoss.yaml
        - assert:
            file: assert/external-oauth-runtime.yaml
            timeout: 120s
        - error:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: external-oauth-oauth2-creds
                namespace: ($namespace)
            timeout: 5s
