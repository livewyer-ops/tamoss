apiVersion: tamoss.livewyer.io/v1alpha1
kind: Tamoss
metadata:
  name: external
  annotations:
    confirmation.tamoss.livewyer.io/deletion: "true"
spec:
  fullnameOverride: external
  secrets:
    apiToken:
      generate: true
      token: ""
  auth:
    providedBy: external
    required: false
    external:
      oauth2:
        enabled: false
  api:
    enabled: true
    replicaCount: 0
    image:
      repository: livewyer/tamoss-api
      tag: dev
      pullPolicy: IfNotPresent
    resources:
      limits:
        memory: 512Mi
  worker:
    enabled: false
    replicaCount: 0
    pdb:
      enabled: false
  ui:
    enabled: true
    replicaCount: 0
    image:
      repository: livewyer/tamoss-ui
      tag: dev
      pullPolicy: IfNotPresent
  backends:
    db:
      providedBy: external
      applyFixtures: false
      external:
        host: (join('', ['postgresql.', $namespace, '-backends.svc.cluster.local']))
        port: "5432"
        database: tams
        auth:
          existingSecret: tams-postgresql-auth
          secretKeys:
            username: username
            password: password
    s3:
      providedBy: external
      external:
        endpoint:
          default:
            url: (join('', ['http://rustfs-svc.', $namespace, '-backends.svc.cluster.local:9000']))
        region: us-east-1
        bucket: tamoss
        auth:
          existingSecret: tams-rustfs-auth
          secretKeys:
            accessKey: RUSTFS_ACCESS_KEY
            secretKey: RUSTFS_SECRET_KEY
  httpRoute:
    enabled: false
  networkPolicy:
    enabled: false
