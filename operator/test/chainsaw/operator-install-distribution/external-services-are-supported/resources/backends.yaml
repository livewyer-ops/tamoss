apiVersion: v1
kind: Namespace
metadata:
  name: (join('', [$namespace, '-backends']))
---
apiVersion: v1
kind: Secret
metadata:
  name: tams-postgresql-auth
  namespace: (join('', [$namespace, '-backends']))
type: Opaque
stringData:
  username: tams
  password: tams
  database: tams
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: (join('', [$namespace, '-backends']))
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: tamoss-chainsaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
    spec:
      containers:
        - name: postgresql
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: tams-postgresql-auth
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tams-postgresql-auth
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: tams-postgresql-auth
                  key: database
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - tams
                - -d
                - tams
            periodSeconds: 2
            timeoutSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: (join('', [$namespace, '-backends']))
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: tamoss-chainsaw
spec:
  selector:
    app.kubernetes.io/name: postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: v1
kind: Secret
metadata:
  name: tams-rustfs-auth
  namespace: (join('', [$namespace, '-backends']))
type: Opaque
stringData:
  RUSTFS_ACCESS_KEY: rustfsadmin
  RUSTFS_SECRET_KEY: rustfsadmin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: (join('', [$namespace, '-backends']))
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/part-of: tamoss-chainsaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rustfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.0-beta.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: tams-rustfs-auth
                  key: RUSTFS_ACCESS_KEY
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tams-rustfs-auth
                  key: RUSTFS_SECRET_KEY
            - name: RUSTFS_ADDRESS
              value: :9000
            - name: RUSTFS_CONSOLE_ADDRESS
              value: :9001
            - name: RUSTFS_STORAGE_CLASS_STANDARD
              value: EC:0
            - name: RUSTFS_ERASURE_SET_DRIVE_COUNT
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
      volumes:
        - name: data
          emptyDir: {}
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs-svc
  namespace: (join('', [$namespace, '-backends']))
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/part-of: tamoss-chainsaw
spec:
  selector:
    app.kubernetes.io/name: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-create-bucket
  namespace: (join('', [$namespace, '-backends']))
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/part-of: tamoss-chainsaw
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs-create-bucket
    spec:
      restartPolicy: OnFailure
      containers:
        - name: awscli
          image: amazon/aws-cli:2.32.34
          imagePullPolicy: IfNotPresent
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: tams-rustfs-auth
                  key: RUSTFS_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: tams-rustfs-auth
                  key: RUSTFS_SECRET_KEY
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          command:
            - aws
          args:
            - --endpoint-url
            - http://rustfs-svc:9000
            - s3api
            - create-bucket
            - --bucket
            - tamoss
