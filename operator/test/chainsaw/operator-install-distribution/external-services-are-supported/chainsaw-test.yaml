apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: external-services-are-supported
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: standard
    test.tamoss.io/domain: install
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: external
    test.tamoss.io/profile: none
spec:
  steps:
    - name: install external backend fixtures
      try:
        - apply:
            file: resources/backends.yaml
        - wait:
            apiVersion: apps/v1
            kind: Deployment
            namespace: (join('', [$namespace, '-backends']))
            name: postgresql
            timeout: 120s
            for:
              condition:
                name: Available
        - wait:
            apiVersion: apps/v1
            kind: Deployment
            namespace: (join('', [$namespace, '-backends']))
            name: rustfs
            timeout: 180s
            for:
              condition:
                name: Available
        - wait:
            apiVersion: batch/v1
            kind: Job
            namespace: (join('', [$namespace, '-backends']))
            name: rustfs-create-bucket
            timeout: 180s
            for:
              condition:
                name: Complete

    - name: apply instance using external services
      try:
        - apply:
            file: ../../fixtures/operator-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/external-backend-secrets.yaml
        - apply:
            file: resources/tamoss.yaml
        - wait:
            apiVersion: tamoss.livewyer.io/v1alpha1
            kind: Tamoss
            name: external
            timeout: 240s
            for:
              condition:
                name: Ready
        - assert:
            resource:
              apiVersion: tamoss.livewyer.io/v1alpha1
              kind: Tamoss
              metadata:
                name: external
                namespace: ($namespace)
              status:
                auth:
                  provider: external
        - error:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                namespace: ($namespace)
                labels:
                  app.kubernetes.io/name: postgresql
            timeout: 5s
        - error:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                namespace: ($namespace)
                labels:
                  app.kubernetes.io/name: rustfs
            timeout: 5s
      finally:
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: (join('', [$namespace, '-backends']))
