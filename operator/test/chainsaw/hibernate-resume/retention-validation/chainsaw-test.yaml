apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: hibernate-retention-validation
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: release
    test.tamoss.io/domain: operations
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: none
    test.tamoss.io/profile: none
spec:
  steps:
    - name: accept ttl retention with ttl seconds
      try:
        - apply:
            file: resources/ttl-storagebackend.yaml

    - name: reject ttl retention without ttl seconds
      try:
        # apply+expect is deliberate: the chainsaw `error` operation is a
        # negative state assertion and never applies the file, so it cannot
        # prove the admission rejection.
        - apply:
            file: resources/ttl-storagebackend-missing-ttl.yaml
            expect:
              - check:
                  ($error != null): true
