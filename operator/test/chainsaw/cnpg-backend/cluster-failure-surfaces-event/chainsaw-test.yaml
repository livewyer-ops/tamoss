apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cluster-failure-surfaces-event
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: standard
    test.tamoss.io/domain: db
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: cnpg
    test.tamoss.io/profile: none
spec:
  steps:
    - name: apply cnpg instance and surface cluster failure
      try:
        - apply:
            file: ../../fixtures/cnpg-crd.yaml
        - apply:
            file: ../../fixtures/external-backend-secrets.yaml
        - apply:
            file: ../../fixtures/tamoss-cnpg.yaml
        - assert:
            file: assert/cnpg-cluster-crd-established.yaml
        - assert:
            file: assert/tamoss-db-cluster.yaml
            timeout: 2m
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              # chainsaw-script: simulates CNPG status because no CNPG controller is running in Chainsaw.
              CNPG_STATUS_JSON='{"status":{"conditions":[{"type":"Ready","status":"False","reason":"ClusterIsNotReady","message":"initializing"},{"type":"ContinuousArchiving","status":"False","reason":"WALArchiveFailing","message":"archive command failed"}]}}' \
                ../../scripts/patch-cnpg-cluster-status.sh tamoss-db tamoss
        - assert:
            file: assert/cluster-failure-status.yaml
            timeout: 2m
        - assert:
            file: assert/backup-archiving-failed-event.yaml
            timeout: 1m
