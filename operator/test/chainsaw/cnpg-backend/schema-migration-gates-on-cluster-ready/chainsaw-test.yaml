apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: schema-migration-gates-on-cluster-ready
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: standard
    test.tamoss.io/domain: db
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: cnpg
    test.tamoss.io/profile: none
spec:
  steps:
    - name: apply cnpg instance and release cluster readiness
      try:
        - apply:
            file: ../../fixtures/cnpg-crd.yaml
        - apply:
            file: ../../fixtures/external-backend-secrets.yaml
        - apply:
            file: ../../fixtures/tamoss-cnpg.yaml
        - apply:
            file: ../../fixtures/cnpg-secrets.yaml
        - assert:
            file: assert/cnpg-cluster-crd-established.yaml
            timeout: 120s
        - assert:
            file: assert/tamoss-db-cluster.yaml
            timeout: 120s
        - error:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                namespace: ($namespace)
                labels:
                  app.kubernetes.io/instance: tamoss
                  app.kubernetes.io/component: schema
                  app.kubernetes.io/managed-by: tamoss-operator
            timeout: 5s
        - patch:
            resource:
              apiVersion: postgresql.cnpg.io/v1
              kind: Cluster
              metadata:
                name: tamoss-db
                namespace: ($namespace)
              status:
                conditions:
                  - type: Ready
                    status: "True"
                    reason: ClusterReady
                    message: Cluster is ready
            subresource: status
            timeout: 60s
        - assert:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                namespace: ($namespace)
                labels:
                  app.kubernetes.io/instance: tamoss
                  app.kubernetes.io/component: schema
                  app.kubernetes.io/managed-by: tamoss-operator
              spec:
                template:
                  spec:
                    containers:
                      - name: schema-migrate
                        (contains(args, '--apply-cnpg-ownership')): true
            timeout: 120s
