apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rendered-profile-shape
  labels:
    test.tamoss.io/target: render
    test.tamoss.io/tier: standard
    test.tamoss.io/domain: profile
    test.tamoss.io/lifecycle: read-only
    test.tamoss.io/provider: none
    test.tamoss.io/profile: none
spec:
  steps:
    - name: render instance profiles
      try:
        - script:
            content: |
              set -eu
              # chainsaw-script: render-only profile check; full Kind bootstrapping is covered by task kind:up.
              local_render="$(kubectl kustomize ../../../../../deploy/instances/local-kind)"
              printf '%s' "$local_render" | grep -q 'profile: local-kind'
              printf '%s' "$local_render" | grep -q 'name: tamoss-kind'
              printf '%s' "$local_render" | grep -q 'namespace: tams'

              single_render="$(kubectl kustomize ../../../../../deploy/instances/single-server)"
              printf '%s' "$single_render" | grep -q 'profile: single-server'
              ! printf '%s' "$single_render" | grep -q 'tamoss.localtest.me'

              multi_render="$(kubectl kustomize ../../../../../deploy/instances/multi-server)"
              printf '%s' "$multi_render" | grep -q 'profile: multi-server'
              ! printf '%s' "$multi_render" | grep -q 'tamoss.localtest.me'

              edge_render="$(kubectl kustomize ../../../../../deploy/instances/edge)"
              printf '%s' "$edge_render" | grep -q 'profile: edge'
              printf '%s' "$edge_render" | grep -q 'name: tamoss-edge'
              ! printf '%s' "$edge_render" | grep -q 'tamoss.localtest.me'

              single_kind_render="$(kubectl kustomize ../../../../../deploy/environments/single-server)"
              printf '%s' "$single_kind_render" | grep -q 'profile: single-server'
              printf '%s' "$single_kind_render" | grep -q 'baseDomain: tamoss.localtest.me'

              multi_kind_render="$(kubectl kustomize ../../../../../deploy/environments/multi-server)"
              printf '%s' "$multi_kind_render" | grep -q 'profile: multi-server'
              printf '%s' "$multi_kind_render" | grep -q 'baseDomain: tamoss.localtest.me'
              printf '%s' "$multi_kind_render" | grep -q 'RUSTFS_UNSAFE_BYPASS_DISK_CHECK'

              edge_kind_render="$(kubectl kustomize ../../../../../deploy/environments/edge)"
              printf '%s' "$edge_kind_render" | grep -q 'profile: edge'
              printf '%s' "$edge_kind_render" | grep -q 'baseDomain: tamoss.localtest.me'
