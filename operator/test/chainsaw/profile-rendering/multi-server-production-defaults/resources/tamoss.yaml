apiVersion: tamoss.livewyer.io/v1alpha1
kind: Tamoss
metadata:
  name: production-profile
  annotations:
    confirmation.tamoss.livewyer.io/deletion: "true"
spec:
  profile: multi-server
  fullnameOverride: prod
  auth:
    providedBy: none
    required: false
  backends:
    db:
      providedBy: external
      external:
        host: postgresql
        port: "5432"
        database: tams
        auth:
          existingSecret: tams-postgresql-auth
          secretKeys:
            username: username
            password: password
    s3:
      providedBy: external
      external:
        endpoint:
          default:
            url: http://rustfs-svc:9000
        region: us-east-1
        bucket: tamoss
        auth:
          existingSecret: tams-rustfs-auth
          secretKeys:
            accessKey: RUSTFS_ACCESS_KEY
            secretKey: RUSTFS_SECRET_KEY
  httpRoute:
    enabled: false
