apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: namespace-scoped-install-rejects-cross-namespace
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: release
    test.tamoss.io/domain: operations
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: none
    test.tamoss.io/profile: none
spec:
  steps:
    - name: configure namespace scoped operator
      try:
        - apply:
            file: resources/namespaces.yaml
        - apply:
            file: resources/tams-rbac.yaml
        - command:
            entrypoint: kubectl
            args:
              - set
              - env
              - deployment/operator-controller-manager
              - --namespace=tamoss-system
              - WATCH_NAMESPACES=tams
            timeout: 60s
            check:
              ($error == null): true
        - assert:
            file: ../../fixtures/assert/operator-ready.yaml
            timeout: 180s

    - name: apply cross namespace instance
      try:
        - apply:
            file: resources/ignored-tamoss.yaml
        - sleep:
            duration: 30s
        - error:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: ignored-api
                namespace: other
            timeout: 5s
        - command:
            entrypoint: kubectl
            args:
              - -n
              - tamoss-system
              - logs
              - deployment/operator-controller-manager
              - -c
              - manager
              - --tail=200
            timeout: 30s
            check:
              ($error == null): true
              (contains($stdout, 'watching configured namespaces')): true
      finally:
        - command:
            entrypoint: kubectl
            args:
              - set
              - env
              - deployment/operator-controller-manager
              - --namespace=tamoss-system
              - WATCH_NAMESPACES-
            timeout: 60s
            check:
              ($error == null): true
        - wait:
            apiVersion: apps/v1
            kind: Deployment
            namespace: tamoss-system
            name: operator-controller-manager
            timeout: 180s
            for:
              condition:
                name: Available
        - wait:
            apiVersion: v1
            kind: Endpoints
            namespace: tamoss-system
            name: operator-webhook-service
            timeout: 60s
            for:
              jsonPath:
                path: '{.subsets[0].addresses[0].ip}'
        - sleep:
            duration: 5s
