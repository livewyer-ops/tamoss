apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: failed-migration-halts-after-three-attempts
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: extended
    test.tamoss.io/domain: schema
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: mixed
    test.tamoss.io/profile: none
spec:
  timeouts:
    exec: 4m
  steps:
    - name: apply instance with invalid database credentials
      try:
        - apply:
            file: ../../fixtures/operator-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/postgres.yaml
        - apply:
            file: ../../fixtures/rustfs.yaml
        - apply:
            file: resources/bad-postgresql-auth.yaml
        - assert:
            file: ../../fixtures/assert/postgresql-available.yaml
            timeout: 120s
        - assert:
            file: ../../fixtures/assert/rustfs-available.yaml
            timeout: 180s
        - apply:
            file: resources/tamoss.yaml
        - assert:
            file: assert/schema-migration-failed.yaml
            timeout: 240s
        - assert:
            file: assert/schema-state-failed.yaml
        - patch:
            resource:
              apiVersion: tamoss.livewyer.io/v1alpha1
              kind: Tamoss
              metadata:
                name: tamoss
                namespace: ($namespace)
                annotations:
                  confirmation.tamoss.livewyer.io/deletion: "true"
