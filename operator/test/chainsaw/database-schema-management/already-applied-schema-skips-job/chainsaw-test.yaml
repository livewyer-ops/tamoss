apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: already-applied-schema-skips-job
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: extended
    test.tamoss.io/domain: schema
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: mixed
    test.tamoss.io/profile: none
spec:
  steps:
    - name: apply already migrated instance
      try:
        - apply:
            file: ../../fixtures/operator-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/postgres.yaml
        - apply:
            file: ../../fixtures/rustfs.yaml
        - apply:
            file: resources/schema-state.yaml
        - assert:
            file: ../../fixtures/assert/postgresql-available.yaml
        - assert:
            file: ../../fixtures/assert/rustfs-available.yaml
        - assert:
            file: ../../fixtures/assert/rustfs-bucket-ready.yaml
        - apply:
            file: ../../fixtures/tamoss-external.yaml
        - assert:
            file: assert/schema-already-at-version.yaml
        - error:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                namespace: ($namespace)
                labels:
                  app.kubernetes.io/instance: tamoss
                  app.kubernetes.io/component: schema
                  app.kubernetes.io/managed-by: tamoss-operator
            timeout: 5s
