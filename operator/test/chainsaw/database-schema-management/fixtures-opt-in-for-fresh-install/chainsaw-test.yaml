apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: fixtures-opt-in-for-fresh-install
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: extended
    test.tamoss.io/domain: schema
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: mixed
    test.tamoss.io/profile: none
spec:
  steps:
    - name: apply fixture opt-in instance
      try:
        - apply:
            file: ../../fixtures/operator-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/postgres.yaml
        - apply:
            file: ../../fixtures/rustfs.yaml
        - assert:
            file: ../../fixtures/assert/postgresql-available.yaml
        - assert:
            file: ../../fixtures/assert/rustfs-available.yaml
        - assert:
            file: ../../fixtures/assert/rustfs-bucket-ready.yaml
        - apply:
            file: resources/tamoss.yaml
        - wait:
            apiVersion: batch/v1
            kind: Job
            selector: app.kubernetes.io/instance=tamoss,app.kubernetes.io/component=schema,app.kubernetes.io/managed-by=tamoss-operator
            timeout: 240s
            for:
              condition:
                name: Complete
        - command:
            entrypoint: kubectl
            env:
              - name: NAMESPACE
                value: ($namespace)
            args:
              - -n
              - $NAMESPACE
              - exec
              - deployment/postgresql
              - --
              - psql
              - -U
              - tams
              - -d
              - tams
              - -Atc
              - SELECT count(*) FROM tamoss_storage_backends WHERE id = 'f1ab5b54-9703-42ed-b181-11ba1c794a7f' AND label = 'tamoss.us-east-1:s3:tamoss';
            timeout: 30s
            check:
              ($error == null): true
              (trim_space($stdout)): "1"
        - assert:
            file: assert/schema-state-fixtures-applied.yaml
            timeout: 120s
