apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: route-rejection-surfaces-hostname-conflict
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: extended
    test.tamoss.io/domain: routing
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: mixed
    test.tamoss.io/profile: none
spec:
  steps:
    - name: apply instances with duplicate route hostnames
      try:
        - apply:
            file: ../../fixtures/gateway-api-crds.yaml
        - apply:
            file: ../../fixtures/operator-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/external-backend-secrets.yaml
        - apply:
            file: resources/schema-state.yaml
        - apply:
            file: resources/tamoss-routes.yaml
        - assert:
            file: assert/routes-rendered.yaml
    - name: rejected route updates routing and hostname status
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              # chainsaw-script: Gateway controller status is simulated because no Gateway controller is running in Chainsaw.
              payload='{"status":{"parents":[{"parentRef":{"name":"shared-gateway"},"conditions":[{"type":"Accepted","status":"False","reason":"ConflictedHostname","message":"hostname app.duplicate.test is already attached to another route"}]}]}}'
              kubectl -n "$NAMESPACE" patch httproutes.gateway.networking.k8s.io secondary-api --subresource=status --type=merge -p "$payload" >/dev/null 2>&1 ||
                kubectl -n "$NAMESPACE" patch httproutes.gateway.networking.k8s.io secondary-api --type=merge -p "$payload" >/dev/null
        - assert:
            file: assert/secondary-hostname-conflict.yaml
            timeout: 120s
