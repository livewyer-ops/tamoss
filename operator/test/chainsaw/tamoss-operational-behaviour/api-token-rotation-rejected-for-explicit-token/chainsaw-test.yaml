apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: api-token-rotation-rejected-for-explicit-token
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: standard
    test.tamoss.io/domain: auth
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: mixed
    test.tamoss.io/profile: none
spec:
  steps:
    - name: reject rotation for explicit api token
      try:
        - apply:
            file: ../../fixtures/operator-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/postgres.yaml
        - apply:
            file: ../../fixtures/rustfs.yaml
        - assert:
            file: ../../fixtures/assert/postgresql-available.yaml
            timeout: 120s
        - assert:
            file: ../../fixtures/assert/rustfs-available.yaml
            timeout: 180s
        - assert:
            file: ../../fixtures/assert/rustfs-bucket-ready.yaml
            timeout: 180s
        - apply:
            file: resources/tamoss-explicit-token.yaml
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: tamoss-api-token
                namespace: ($namespace)
                (contains(keys(not_null(annotations, `{}`)), 'tamoss.livewyer.io/api-token-rotate-consumed')): false
              data:
                TAMOSS_API_TOKEN: dXNlci1zdXBwbGllZC10b2tlbg==
            timeout: 180s
        - assert:
            file: assert/api-token-rotation-rejected-event.yaml
            timeout: 1m
