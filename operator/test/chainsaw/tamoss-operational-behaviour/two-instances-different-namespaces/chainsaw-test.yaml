apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: two-instances-different-namespaces
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: extended
    test.tamoss.io/domain: operations
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: mixed
    test.tamoss.io/profile: none
spec:
  steps:
    - name: apply two namespaces
      try:
        - apply:
            file: resources/namespaces-rbac.yaml
        - apply:
            file: ../../fixtures/rustfs-crd.yaml
        - apply:
            file: resources/rustfs.yaml
        - apply:
            file: resources/postgres.yaml
        - assert:
            file: assert/postgres-available.yaml
        - apply:
            file: resources/tamoss.yaml
        - patch:
            resource:
              apiVersion: rustfs.com/v1alpha1
              kind: Tenant
              metadata:
                name: alpha-s3
                namespace: tamoss-cross-alpha
              status:
                availableReplicas: 1
                currentState: Ready
                pools:
                  - ssName: alpha-s3-pool-0
                    state: Ready
                conditions:
                  - type: Ready
                    status: "True"
                    reason: Ready
                    message: Tenant is ready
            subresource: status
            timeout: 60s
        - patch:
            resource:
              apiVersion: rustfs.com/v1alpha1
              kind: Tenant
              metadata:
                name: beta-s3
                namespace: tamoss-cross-beta
              status:
                availableReplicas: 1
                currentState: Ready
                pools:
                  - ssName: beta-s3-pool-0
                    state: Ready
                conditions:
                  - type: Ready
                    status: "True"
                    reason: Ready
                    message: Tenant is ready
            subresource: status
            timeout: 60s
        - assert:
            file: assert/tamoss-ready.yaml
            timeout: 5m
        - assert:
            file: assert/resources-scoped.yaml
            timeout: 5m
