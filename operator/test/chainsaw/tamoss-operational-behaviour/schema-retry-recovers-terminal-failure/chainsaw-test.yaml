apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: schema-retry-recovers-terminal-failure
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: extended
    test.tamoss.io/domain: schema
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: mixed
    test.tamoss.io/profile: none
spec:
  timeouts:
    exec: 5m
  steps:
    - name: apply instance with broken database credentials
      try:
        - apply:
            file: ../../fixtures/operator-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/postgres.yaml
        - apply:
            file: ../../fixtures/rustfs.yaml
        - apply:
            file: ../../database-schema-management/failed-migration-halts-after-three-attempts/resources/bad-postgresql-auth.yaml
        - assert:
            file: ../../fixtures/assert/postgresql-available.yaml
            timeout: 120s
        - assert:
            file: ../../fixtures/assert/rustfs-available.yaml
            timeout: 180s
        - assert:
            file: ../../fixtures/assert/rustfs-bucket-ready.yaml
            timeout: 180s
        - apply:
            file: ../../database-schema-management/failed-migration-halts-after-three-attempts/resources/tamoss.yaml
        - assert:
            file: assert/schema-terminal-failure.yaml
            timeout: 4m

    - name: fix credentials and retry schema
      try:
        - apply:
            file: resources/fixed-postgresql-auth.yaml
        - patch:
            resource:
              apiVersion: tamoss.livewyer.io/v1alpha1
              kind: Tamoss
              metadata:
                name: tamoss
                namespace: ($namespace)
                annotations:
                  tamoss.livewyer.io/schema-retry: recover-1
        - assert:
            file: assert/schema-ready.yaml
            timeout: 5m
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              # chainsaw-script: checks absence of stale failure keys after recovery.
              if kubectl -n "$NAMESPACE" get configmap tamoss-schema-state -o jsonpath='{.data.failureCount}' | grep -q .; then
                kubectl -n "$NAMESPACE" get configmap tamoss-schema-state -o yaml
                exit 1
              fi
        - assert:
            file: assert/schema-retry-accepted-event.yaml
            timeout: 1m
