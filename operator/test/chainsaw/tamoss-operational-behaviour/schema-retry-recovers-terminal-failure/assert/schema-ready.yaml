apiVersion: tamoss.livewyer.io/v1alpha1
kind: Tamoss
metadata:
  name: tamoss
(status.conditions[?type == 'Ready'] | [0].status): "True"
(status.conditions[?type == 'SchemaMigrated'] | [0].status): "True"
(contains(['SchemaApplied', 'AlreadyAtVersion'], status.conditions[?type == 'SchemaMigrated'] | [0].reason)): true
(status.schemaMigration.phase): Succeeded
(status.schemaMigration.lastAttemptResult): Succeeded
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tamoss-schema-state
(data.appliedVersion): ($values.schemaVersion)
