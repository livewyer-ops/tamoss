apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: one-instance-update-does-not-affect-another
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: extended
    test.tamoss.io/domain: operations
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: mixed
    test.tamoss.io/profile: none
spec:
  steps:
    - name: apply two instances
      try:
        - apply:
            file: ../../fixtures/operator-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/rustfs-crd.yaml
        - apply:
            file: ../../fixtures/rustfs-managed-alpha-beta.yaml
        - apply:
            file: resources/postgres-instances.yaml
        - assert:
            file: assert/postgres-instances-available.yaml
        - apply:
            file: resources/tamoss-instances.yaml
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              # chainsaw-script: simulates RustFS Tenant readiness because no RustFS controller is running in this contract test.
              ../../scripts/simulate-rustfs-tenant-ready.sh alpha-s3 alpha
              ../../scripts/simulate-rustfs-tenant-ready.sh beta-s3 beta
        - assert:
            file: assert/tamoss-instances-ready.yaml
            timeout: 5m
        - assert:
            file: assert/generated-resources-scoped.yaml
            timeout: 5m

    - name: snapshot unmodified instance
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              # chainsaw-script: captures beta state before mutating alpha; native assertions cover readiness.
              beta_token="$(kubectl -n "$NAMESPACE" get secret beta-api-token -o jsonpath='{.data.TAMOSS_API_TOKEN}')"
              beta_creds="$(kubectl -n "$NAMESPACE" get secret beta-storage-backend-credentials -o jsonpath='{.data.credentials\\.json}')"
              kubectl -n "$NAMESPACE" create configmap beta-stability-snapshot \
                --from-literal=apiToken="$beta_token" \
                --from-literal=storageCredentials="$beta_creds"

    - name: update one instance
      try:
        - patch:
            resource:
              apiVersion: tamoss.livewyer.io/v1alpha1
              kind: Tamoss
              metadata:
                name: alpha
                namespace: ($namespace)
              spec:
                worker:
                  enabled: true
                  replicaCount: 0
        - assert:
            file: assert/alpha-worker-enabled.yaml
            timeout: 5m
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              # chainsaw-script: compares beta values captured before the alpha-only patch.
              expect() {
                kubectl -n "$NAMESPACE" get configmap beta-stability-snapshot -o "jsonpath={.data.$1}"
              }
              [ "$(kubectl -n "$NAMESPACE" get secret beta-api-token -o jsonpath='{.data.TAMOSS_API_TOKEN}')" = "$(expect apiToken)" ]
              [ "$(kubectl -n "$NAMESPACE" get secret beta-storage-backend-credentials -o jsonpath='{.data.credentials\\.json}')" = "$(expect storageCredentials)" ]
