apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: one-instance-update-does-not-affect-another
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: extended
    test.tamoss.io/domain: operations
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: mixed
    test.tamoss.io/profile: none
spec:
  steps:
    - name: apply two instances
      try:
        - apply:
            file: ../../fixtures/operator-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/rustfs-crd.yaml
        - apply:
            file: ../../fixtures/rustfs-managed-alpha-beta.yaml
        - apply:
            file: resources/postgres-instances.yaml
        - assert:
            file: assert/postgres-instances-available.yaml
        - apply:
            file: resources/tamoss-instances.yaml
        - patch:
            resource:
              apiVersion: rustfs.com/v1alpha1
              kind: Tenant
              metadata:
                name: alpha-s3
                namespace: ($namespace)
              status:
                availableReplicas: 1
                currentState: Ready
                pools:
                  - ssName: alpha-s3-pool-0
                    state: Ready
                conditions:
                  - type: Ready
                    status: "True"
                    reason: Ready
                    message: Tenant is ready
            subresource: status
            timeout: 60s
        - patch:
            resource:
              apiVersion: rustfs.com/v1alpha1
              kind: Tenant
              metadata:
                name: beta-s3
                namespace: ($namespace)
              status:
                availableReplicas: 1
                currentState: Ready
                pools:
                  - ssName: beta-s3-pool-0
                    state: Ready
                conditions:
                  - type: Ready
                    status: "True"
                    reason: Ready
                    message: Tenant is ready
            subresource: status
            timeout: 60s
        - assert:
            file: assert/tamoss-instances-ready.yaml
            timeout: 5m
        - assert:
            file: assert/generated-resources-scoped.yaml
            timeout: 5m

    - name: snapshot unmodified instance
      try:
        - create:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: beta-stability-snapshot
                namespace: ($namespace)
              data:
                apiToken: (x_k8s_get($client, 'v1', 'Secret', $namespace, 'beta-api-token').data.TAMOSS_API_TOKEN)
                storageCredentials: (x_k8s_get($client, 'v1', 'Secret', $namespace, 'beta-storage-backend-credentials').data."credentials.json")

    - name: update one instance
      try:
        - patch:
            resource:
              apiVersion: tamoss.livewyer.io/v1alpha1
              kind: Tamoss
              metadata:
                name: alpha
                namespace: ($namespace)
              spec:
                worker:
                  enabled: true
                  replicaCount: 0
        - assert:
            file: assert/alpha-worker-enabled.yaml
            timeout: 5m
        - assert:
            resource:
              (x_k8s_get($client, 'v1', 'Secret', $namespace, 'beta-api-token')):
                data:
                  TAMOSS_API_TOKEN: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'beta-stability-snapshot').data.apiToken)
            timeout: 30s
        - assert:
            resource:
              (x_k8s_get($client, 'v1', 'Secret', $namespace, 'beta-storage-backend-credentials')):
                data:
                  credentials.json: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'beta-stability-snapshot').data.storageCredentials)
            timeout: 30s
