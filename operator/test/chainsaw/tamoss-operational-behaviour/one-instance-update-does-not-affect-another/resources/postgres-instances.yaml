apiVersion: v1
kind: Secret
metadata:
  name: alpha-postgresql-auth
type: Opaque
stringData:
  username: tams
  password: tams
  database: tams
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpha-postgresql
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: alpha
    app.kubernetes.io/part-of: tamoss-chainsaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: alpha
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: alpha
    spec:
      containers:
        - name: postgresql
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: alpha-postgresql-auth
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alpha-postgresql-auth
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: alpha-postgresql-auth
                  key: database
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 2
            timeoutSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alpha-postgresql
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: alpha
    app.kubernetes.io/part-of: tamoss-chainsaw
spec:
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: alpha
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
