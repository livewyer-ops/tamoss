apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: api-token-rotation
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: standard
    test.tamoss.io/domain: auth
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: mixed
    test.tamoss.io/profile: none
spec:
  steps:
    - name: rotate generated api token
      try:
        - apply:
            file: ../../fixtures/operator-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/postgres.yaml
        - apply:
            file: ../../fixtures/rustfs.yaml
        - assert:
            file: ../../fixtures/assert/postgresql-available.yaml
            timeout: 120s
        - assert:
            file: ../../fixtures/assert/rustfs-available.yaml
            timeout: 180s
        - assert:
            file: ../../fixtures/assert/rustfs-bucket-ready.yaml
            timeout: 180s
        - apply:
            file: ../../fixtures/tamoss-external.yaml
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              # chainsaw-script: compares generated Secret and rollout checksum before and after the rotation annotation.
              ./scripts/assert-api-token-rotation.sh
        - assert:
            file: assert/api-token-rotation-accepted-event.yaml
            timeout: 1m
