apiVersion: v1
kind: Secret
metadata:
  name: ingest-source-credentials
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: rustfsadmin
  AWS_SECRET_ACCESS_KEY: rustfsadmin
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingest-input-fixture
data:
  tiny.srt: |
    1
    00:00:00,000 --> 00:00:01,000
    TAMOSS integration fixture
---
apiVersion: batch/v1
kind: Job
metadata:
  name: upload-ingest-fixture
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: upload-ingest-fixture
    spec:
      restartPolicy: OnFailure
      containers:
        - name: awscli
          image: amazon/aws-cli:2.32.34
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ingest-source-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ingest-source-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          command:
            - aws
          args:
            - --endpoint-url
            - http://rustfs-svc:9000
            - s3
            - cp
            - /fixture/tiny.srt
            - s3://tamoss/input/tiny.srt
            - --content-type
            - application/x-subrip
          volumeMounts:
            - name: fixture
              mountPath: /fixture
              readOnly: true
      volumes:
        - name: fixture
          configMap:
            name: ingest-input-fixture
