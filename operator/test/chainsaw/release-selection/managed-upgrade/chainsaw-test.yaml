apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: managed-release-upgrade
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: release
    test.tamoss.io/domain: schema
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: mixed
    test.tamoss.io/profile: edge
    test.tamoss.io/platform: managed
spec:
  skipDelete: true
  steps:
    - name: install supported releases with real provider operators
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: upgrade-payload
              data:
                object: release-upgrade-probe
        - apply:
            file: resources/instance.yaml
            bindings:
              - name: instance
                value: previous
              - name: version
                value: 8.2.0-oss2
        - apply:
            file: resources/instance.yaml
            bindings:
              - name: instance
                value: candidate
              - name: version
                value: 8.2.0-oss2
        - assert:
            file: resources/ready.yaml
            timeout: 10m
            bindings:
              - name: instance
                value: previous
              - name: version
                value: 8.2.0-oss2
        - command:
            entrypoint: kubectl
            env:
              - name: NAMESPACE
                value: ($namespace)
            args:
              - exec
              - -n
              - $NAMESPACE
              - previous-db-1
              - -c
              - postgres
              - --
              - psql
              - -U
              - postgres
              - -d
              - tams
              - -v
              - ON_ERROR_STOP=1
              - -Atc
              - "INSERT INTO tamoss_sources(id, format, label, record, metadata_updated, created) VALUES ('10000000-0000-4000-8000-000000000001', 'urn:x-nmos:format:video', 'upgrade-probe', '{\"id\":\"10000000-0000-4000-8000-000000000001\",\"format\":\"urn:x-nmos:format:video\",\"label\":\"upgrade-probe\"}', NOW(), NOW());"
            check:
              ($error == null): true
        - apply:
            file: resources/object-job.yaml
            bindings:
              - name: instance
                value: previous
              - name: phase
                value: seed
              - name: arguments
                value: (['--endpoint-url', 'http://previous-s3:9000', 's3api', 'put-object', '--bucket', 'tamoss', '--key', 'release-probe', '--body', '/payload/object', '--checksum-algorithm', 'SHA256'])
        - wait:
            apiVersion: batch/v1
            kind: Job
            name: previous-seed-object
            timeout: 3m
            for:
              condition:
                name: Complete
                value: "True"
        - assert:
            file: resources/ready.yaml
            timeout: 10m
            bindings:
              - name: instance
                value: candidate
              - name: version
                value: 8.2.0-oss2
        - command:
            entrypoint: kubectl
            env:
              - name: NAMESPACE
                value: ($namespace)
            args:
              - exec
              - -n
              - $NAMESPACE
              - candidate-db-1
              - -c
              - postgres
              - --
              - psql
              - -U
              - postgres
              - -d
              - tams
              - -v
              - ON_ERROR_STOP=1
              - -Atc
              - "INSERT INTO tamoss_sources(id, format, label, record, metadata_updated, created) VALUES ('10000000-0000-4000-8000-000000000001', 'urn:x-nmos:format:video', 'upgrade-probe', '{\"id\":\"10000000-0000-4000-8000-000000000001\",\"format\":\"urn:x-nmos:format:video\",\"label\":\"upgrade-probe\"}', NOW(), NOW());"
            check:
              ($error == null): true
        - apply:
            file: resources/object-job.yaml
            bindings:
              - name: instance
                value: candidate
              - name: phase
                value: seed
              - name: arguments
                value: (['--endpoint-url', 'http://candidate-s3:9000', 's3api', 'put-object', '--bucket', 'tamoss', '--key', 'release-probe', '--body', '/payload/object', '--checksum-algorithm', 'SHA256'])
        - wait:
            apiVersion: batch/v1
            kind: Job
            name: candidate-seed-object
            timeout: 3m
            for:
              condition:
                name: Complete
                value: "True"

    - name: upgrade previous and preserve stored data
      bindings:
        - name: previousSchemaData
          value: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'previous-schema-state').data)
        - name: candidateSchemaData
          value: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'candidate-schema-state').data)
        - name: candidateAPISpec
          value: (x_k8s_get($client, 'apps/v1', 'Deployment', $namespace, 'candidate-api').spec)
      try:
        - patch:
            resource:
              apiVersion: tamoss.livewyer.io/v1alpha1
              kind: Tamoss
              metadata:
                name: previous
              spec:
                version: dev
        - assert:
            file: resources/ready.yaml
            timeout: 10m
            bindings:
              - name: instance
                value: previous
              - name: version
                value: dev
        - command:
            entrypoint: kubectl
            env:
              - name: NAMESPACE
                value: ($namespace)
            args:
              - exec
              - -n
              - $NAMESPACE
              - previous-db-1
              - -c
              - postgres
              - --
              - psql
              - -U
              - postgres
              - -d
              - tams
              - -v
              - ON_ERROR_STOP=1
              - -Atc
              - "SELECT label || ':' || (SELECT version_num FROM alembic_version) FROM tamoss_sources WHERE id='10000000-0000-4000-8000-000000000001';"
            check:
              ($error == null): true
              (trim_space($stdout)): "upgrade-probe:20260924_0008"
        - apply:
            file: resources/object-job.yaml
            bindings:
              - name: instance
                value: previous
              - name: phase
                value: read
              - name: arguments
                value: (['--endpoint-url', 'http://previous-s3:9000', 's3', 'cp', 's3://tamoss/release-probe', '-', '--no-progress', '--only-show-errors'])
        - wait:
            apiVersion: batch/v1
            kind: Job
            name: previous-read-object
            timeout: 3m
            for:
              condition:
                name: Complete
                value: "True"
        - command:
            entrypoint: kubectl
            env:
              - name: NAMESPACE
                value: ($namespace)
            args:
              - logs
              - -n
              - $NAMESPACE
              - job/previous-read-object
            check:
              ($error == null): true
              (trim_space($stdout)): "release-upgrade-probe"
        - assert:
            file: resources/ready.yaml
            timeout: 10m
            bindings:
              - name: instance
                value: candidate
              - name: version
                value: 8.2.0-oss2
        - command:
            entrypoint: kubectl
            env:
              - name: NAMESPACE
                value: ($namespace)
            args:
              - exec
              - -n
              - $NAMESPACE
              - candidate-db-1
              - -c
              - postgres
              - --
              - psql
              - -U
              - postgres
              - -d
              - tams
              - -v
              - ON_ERROR_STOP=1
              - -Atc
              - "SELECT version_num FROM alembic_version;"
            check:
              ($error == null): true
              (trim_space($stdout)): "20260924_0008"

        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: previous-schema-state
              data: ($previousSchemaData)
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: candidate-schema-state
              data: ($candidateSchemaData)
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: candidate-api
              spec: ($candidateAPISpec)

    - name: recover a failed storage rollout and preserve stored data
      bindings:
        - name: candidateSchemaData
          value: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'candidate-schema-state').data)
        - name: originalEnv
          value: (x_k8s_get($client, 'tamoss.livewyer.io/v1alpha1', 'Tamoss', $namespace, 'candidate').spec.backends.s3.rustfsOperator.env)
        - name: apiGeneration
          value: (x_k8s_get($client, 'apps/v1', 'Deployment', $namespace, 'candidate-api').metadata.generation)
        - name: credentialsVersion
          value: (x_k8s_get($client, 'v1', 'Secret', $namespace, 'candidate-s3-creds').metadata.resourceVersion)
      try:
        - patch:
            resource:
              apiVersion: tamoss.livewyer.io/v1alpha1
              kind: Tamoss
              metadata:
                name: candidate
              spec:
                version: dev
                backends:
                  s3:
                    rustfsOperator:
                      env:
                        - name: RUSTFS_UNSAFE_BYPASS_DISK_CHECK
                          value: "true"
                        - name: RUSTFS_SECRET_KEY
                          valueFrom:
                            secretKeyRef:
                              name: candidate-s3-creds
                              key: missing-secretkey
        - assert:
            file: resources/storage-rollout-failed.yaml
            timeout: 5m
        - command:
            entrypoint: kubectl
            env:
              - name: NAMESPACE
                value: ($namespace)
            args:
              - exec
              - -n
              - $NAMESPACE
              - candidate-db-1
              - -c
              - postgres
              - --
              - psql
              - -U
              - postgres
              - -d
              - tams
              - -v
              - ON_ERROR_STOP=1
              - -Atc
              - "SELECT version_num FROM alembic_version;"
            check:
              ($error == null): true
              (trim_space($stdout)): "20260924_0008"
        - assert:
            file: resources/ready.yaml
            bindings:
              - name: instance
                value: previous
              - name: version
                value: dev
        - patch:
            resource:
              apiVersion: tamoss.livewyer.io/v1alpha1
              kind: Tamoss
              metadata:
                name: candidate
              spec:
                backends:
                  s3:
                    rustfsOperator:
                      env: ($originalEnv)
        - assert:
            file: resources/ready.yaml
            timeout: 10m
            bindings:
              - name: instance
                value: candidate
              - name: version
                value: dev
        - command:
            entrypoint: kubectl
            env:
              - name: NAMESPACE
                value: ($namespace)
            args:
              - exec
              - -n
              - $NAMESPACE
              - candidate-db-1
              - -c
              - postgres
              - --
              - psql
              - -U
              - postgres
              - -d
              - tams
              - -v
              - ON_ERROR_STOP=1
              - -Atc
              - "SELECT label || ':' || (SELECT version_num FROM alembic_version) FROM tamoss_sources WHERE id='10000000-0000-4000-8000-000000000001';"
            check:
              ($error == null): true
              (trim_space($stdout)): "upgrade-probe:20260924_0008"
        - apply:
            file: resources/object-job.yaml
            bindings:
              - name: instance
                value: candidate
              - name: phase
                value: read
              - name: arguments
                value: (['--endpoint-url', 'http://candidate-s3:9000', 's3', 'cp', 's3://tamoss/release-probe', '-', '--no-progress', '--only-show-errors'])
        - wait:
            apiVersion: batch/v1
            kind: Job
            name: candidate-read-object
            timeout: 3m
            for:
              condition:
                name: Complete
                value: "True"
        - command:
            entrypoint: kubectl
            env:
              - name: NAMESPACE
                value: ($namespace)
            args:
              - logs
              - -n
              - $NAMESPACE
              - job/candidate-read-object
            check:
              ($error == null): true
              (trim_space($stdout)): "release-upgrade-probe"
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: candidate-s3-creds
                resourceVersion: ($credentialsVersion)
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: candidate-schema-state
              data: ($candidateSchemaData)
