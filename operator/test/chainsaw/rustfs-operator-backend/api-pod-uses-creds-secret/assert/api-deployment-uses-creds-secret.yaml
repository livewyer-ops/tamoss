apiVersion: apps/v1
kind: Deployment
metadata:
  name: tamoss-api
(spec.template.spec.containers[?name == 'api'] | [0].env[?name == 'TAMOSS_STORAGE_BACKEND_CREDENTIALS_FILE'] | [0].value): /run/tamoss/storage-backend-credentials/credentials.json
(spec.template.spec.containers[?name == 'api'] | [0].volumeMounts[?name == 'storage-backend-credentials'] | [0].mountPath): /run/tamoss/storage-backend-credentials
(spec.template.spec.volumes[?name == 'storage-backend-credentials'] | [0].secret.secretName): tamoss-storage-backend-credentials
---
apiVersion: v1
kind: Secret
metadata:
  name: tamoss-storage-backend-credentials
(data."credentials.json" != ''): true
