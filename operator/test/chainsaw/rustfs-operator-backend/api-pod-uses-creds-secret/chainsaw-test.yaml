apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: api-pod-uses-creds-secret
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: standard
    test.tamoss.io/domain: storage
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: rustfs
    test.tamoss.io/profile: none
spec:
  steps:
    - name: apply rustfs operator instance
      try:
        - apply:
            file: ../../fixtures/rustfs-crd.yaml
        - apply:
            file: ../../fixtures/rustfs-managed-tamoss.yaml
        - apply:
            file: ../../fixtures/postgres.yaml
        - apply:
            file: ../../fixtures/tamoss-rustfs-operator.yaml
        - patch:
            resource:
              apiVersion: tamoss.livewyer.io/v1alpha1
              kind: Tamoss
              metadata:
                name: tamoss
                namespace: ($namespace)
              spec:
                api:
                  replicaCount: 1
        - assert:
            file: ../../fixtures/assert/postgresql-available.yaml
            timeout: 120s
        - assert:
            file: assert/generated-creds-secret.yaml
            timeout: 120s
        - assert:
            file: assert/tenant-owner-ref.yaml
            timeout: 120s

    - name: simulate rustfs tenant readiness
      try:
        - patch:
            resource:
              apiVersion: rustfs.com/v1alpha1
              kind: Tenant
              metadata:
                name: tamoss-s3
                namespace: ($namespace)
              status:
                availableReplicas: 1
                currentState: Ready
                pools:
                  - ssName: tamoss-s3-pool-0
                    state: Ready
                conditions:
                  - type: Ready
                    status: "True"
                    reason: Ready
                    message: Tenant is ready
            subresource: status
            timeout: 60s

    - name: wait for storage backend reconciliation
      try:
        - assert:
            file: assert/bucket-state-ready.yaml
            timeout: 120s
        - assert:
            file: assert/db-state-ready.yaml
            timeout: 120s
        - patch:
            resource:
              apiVersion: tamoss.livewyer.io/v1alpha1
              kind: StorageBackend
              metadata:
                name: tamoss-storage-default
                namespace: ($namespace)
                annotations:
                  confirmation.tamoss.livewyer.io/deletion: "true"
        - assert:
            file: assert/api-deployment-uses-creds-secret.yaml
            timeout: 120s

    - name: verify rendered credential payload
      try:
        - assert:
            resource:
              (parse_json(base64_decode(x_k8s_get($client, 'v1', 'Secret', $namespace, 'tamoss-storage-backend-credentials').data."credentials.json"))):
                apiVersion: tamoss.livewyer.io/v1
                kind: StorageBackendCredentials
                (credentials[?storageBackendId == base64_decode(x_k8s_get($client, 'v1', 'Secret', $namespace, 'tamoss-backends').data.TAMOSS_STORAGE_BACKEND_ID)] | length(@)): 1
              (contains(base64_decode(x_k8s_get($client, 'v1', 'Secret', $namespace, 'tamoss-backends').data.TAMOSS_S3_PUBLIC_ENDPOINT), 'https://s3.tamoss.test')): true
            timeout: 30s

    - name: complete simulated cleanup
      try:
        - delete:
            ref:
              apiVersion: tamoss.livewyer.io/v1alpha1
              kind: Tamoss
              name: tamoss
        - wait:
            apiVersion: tamoss.livewyer.io/v1alpha1
            kind: Tamoss
            name: tamoss
            timeout: 120s
            for:
              deletion: {}
