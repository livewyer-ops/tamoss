apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: tamoss-delete-cascades-to-tenant
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: standard
    test.tamoss.io/domain: storage
    test.tamoss.io/lifecycle: destructive
    test.tamoss.io/provider: rustfs
    test.tamoss.io/profile: none
spec:
  steps:
    - name: apply rustfs operator instance
      try:
        - apply:
            file: ../../fixtures/rustfs-crd.yaml
        - apply:
            file: ../../fixtures/external-backend-secrets.yaml
        - apply:
            file: ../../fixtures/tamoss-rustfs-operator.yaml
        - assert:
            file: assert/tenant-owner-ref.yaml
            timeout: 120s

    - name: simulate rustfs readiness and assert default storage backend
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              # chainsaw-script: RustFS Tenant status is simulated because no RustFS controller is running in Chainsaw.
              ../../scripts/simulate-rustfs-tenant-ready.sh tamoss-s3 tamoss
        - assert:
            file: assert/default-storagebackend-owned.yaml
            timeout: 120s

    - name: delete instance and assert owned backend deletion
      try:
        - patch:
            resource:
              apiVersion: tamoss.livewyer.io/v1alpha1
              kind: Tamoss
              metadata:
                name: tamoss
                namespace: ($namespace)
                annotations:
                  confirmation.tamoss.livewyer.io/deletion: "true"
        - delete:
            ref:
              apiVersion: tamoss.livewyer.io/v1alpha1
              kind: Tamoss
              name: tamoss
        - wait:
            apiVersion: tamoss.livewyer.io/v1alpha1
            kind: Tamoss
            name: tamoss
            timeout: 120s
            for:
              deletion: {}
        - wait:
            apiVersion: rustfs.com/v1alpha1
            kind: Tenant
            name: tamoss-s3
            timeout: 120s
            for:
              deletion: {}
        - wait:
            apiVersion: tamoss.livewyer.io/v1alpha1
            kind: StorageBackend
            name: tamoss-storage-default
            timeout: 120s
            for:
              deletion: {}
