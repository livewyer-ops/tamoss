apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: installing-rustfs-unblocks-reconcile
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: standard
    test.tamoss.io/domain: storage
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: rustfs
    test.tamoss.io/profile: none
spec:
  steps:
    - name: ensure rustfs tenant crd is absent
      try:
        - delete:
            ref:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              name: tenants.rustfs.com
            timeout: 120s

    - name: install rustfs crd after blocked reconcile
      try:
        - apply:
            file: ../../fixtures/external-backend-secrets.yaml
        - apply:
            file: ../../fixtures/tamoss-rustfs-operator.yaml
        - assert:
            file: assert/missing-dependency-status.yaml
            timeout: 150s
        - assert:
            file: assert/missing-dependency-event.yaml
            timeout: 150s
        - error:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: tamoss-api
                namespace: ($namespace)
            timeout: 5s
        - apply:
            file: ../../fixtures/rustfs-crd.yaml
        - wait:
            apiVersion: apiextensions.k8s.io/v1
            kind: CustomResourceDefinition
            name: tenants.rustfs.com
            timeout: 120s
            for:
              condition:
                name: Established
        - assert:
            file: assert/tenant-owner-ref.yaml
            timeout: 180s

    - name: rustfs status update reconciles owning tamoss
      try:
        - patch:
            resource:
              apiVersion: rustfs.com/v1alpha1
              kind: Tenant
              metadata:
                name: tamoss-s3
                namespace: ($namespace)
              status:
                availableReplicas: 1
                currentState: Ready
                pools:
                  - ssName: tamoss-s3-pool-0
                    state: Ready
                conditions:
                  - type: Ready
                    status: "True"
                    reason: Ready
                    message: Tenant is ready
            subresource: status
            timeout: 60s
        - assert:
            file: ../tamoss-delete-cascades-to-tenant/assert/default-storagebackend-owned.yaml
            timeout: 120s
