apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: out-of-band-edits-are-reverted
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: smoke
    test.tamoss.io/domain: instance
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: mixed
    test.tamoss.io/profile: none
spec:
  steps:
    - name: apply instance
      try:
        - apply:
            file: ../../fixtures/operator-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/postgres.yaml
        - apply:
            file: ../../fixtures/rustfs.yaml
        - assert:
            file: ../../fixtures/assert/postgresql-available.yaml
        - assert:
            file: ../../fixtures/assert/rustfs-available.yaml
        - assert:
            file: ../../fixtures/assert/rustfs-bucket-ready.yaml
        - apply:
            file: ../../fixtures/tamoss-external.yaml
        - assert:
            file: ../../fixtures/assert/tamoss-all-components-ready.yaml
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              # chainsaw-script: Event names are generated by the API server, so this checks the absence of initial drift noise.
              if kubectl -n "$NAMESPACE" get events \
                --field-selector involvedObject.name=tamoss,reason=DriftCorrected \
                --no-headers | grep -q DriftCorrected; then
                echo "unexpected DriftCorrected event during initial convergence" >&2
                exit 1
              fi
        - assert:
            file: assert/tamoss-ready-event.yaml
            timeout: 1m
        - assert:
            file: assert/schema-migration-succeeded-event.yaml
            timeout: 1m
    - name: mutate managed objects
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              # chainsaw-script: applies out-of-band drift to managed resources so native assertions can verify correction.
              kubectl -n "$NAMESPACE" patch deployment tamoss-api --type=json \
                -p '[{"op":"replace","path":"/spec/template/spec/containers/0/resources/limits/memory","value":"2Gi"}]'
              kubectl -n "$NAMESPACE" patch service tamoss-api --type=json \
                -p '[{"op":"add","path":"/spec/ports/-","value":{"name":"drift","port":9999,"protocol":"TCP","targetPort":"http"}}]'
              ../../scripts/reconcile-tamoss.sh tamoss
        - assert:
            file: assert/api-deployment-restored.yaml
        - assert:
            file: assert/api-service-restored.yaml
        - assert:
            file: assert/drift-corrected-event.yaml
            timeout: 1m
