apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: explicit-token-replaces-generated-value
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: standard
    test.tamoss.io/domain: instance
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: mixed
    test.tamoss.io/profile: none
spec:
  steps:
    - name: apply instance and replace generated token
      try:
        - apply:
            file: ../../fixtures/operator-namespace-rbac.yaml
        - apply:
            file: ../../fixtures/postgres.yaml
        - apply:
            file: ../../fixtures/rustfs.yaml
        - assert:
            file: ../../fixtures/assert/postgresql-available.yaml
        - assert:
            file: ../../fixtures/assert/rustfs-available.yaml
        - assert:
            file: ../../fixtures/assert/rustfs-bucket-ready.yaml
        - apply:
            file: ../../fixtures/tamoss-external.yaml
        - assert:
            file: assert/api-token-secret-present.yaml
        - assert:
            file: assert/api-deployment-present.yaml
        - create:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: token-checksum-snapshot
                namespace: ($namespace)
              data:
                before: (x_k8s_get($client, 'apps/v1', 'Deployment', $namespace, 'tamoss-api').spec.template.metadata.annotations."checksum/api-token-secret")
        - patch:
            resource:
              apiVersion: tamoss.livewyer.io/v1alpha1
              kind: Tamoss
              metadata:
                name: tamoss
                namespace: ($namespace)
              spec:
                secrets:
                  apiToken:
                    token: user-supplied-token
        - assert:
            file: assert/explicit-token-secret.yaml
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: tamoss-api
                namespace: ($namespace)
              (spec.template.metadata.annotations."checksum/api-token-secret" != x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'token-checksum-snapshot').data.before): true
            timeout: 90s
