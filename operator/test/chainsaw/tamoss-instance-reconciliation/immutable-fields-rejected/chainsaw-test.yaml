apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: immutable-fields-rejected
  labels:
    test.tamoss.io/target: kind
    test.tamoss.io/tier: release
    test.tamoss.io/domain: instance
    test.tamoss.io/lifecycle: ephemeral
    test.tamoss.io/provider: none
    test.tamoss.io/profile: none
spec:
  steps:
    - name: apply baseline resources
      try:
        - apply:
            file: resources/tamoss.yaml
        - apply:
            file: resources/storagebackend.yaml
        - apply:
            file: resources/tamoss-noop.yaml
        - apply:
            file: resources/storagebackend-noop.yaml

    - name: immutable tamoss name override is rejected
      try:
        - error:
            file: resources/tamoss-fullname-change.yaml

    - name: immutable storage backend identity changes are rejected
      try:
        - error:
            file: resources/storagebackend-id-change.yaml
        - error:
            file: resources/storagebackend-provider-change.yaml
        - error:
            file: resources/storagebackend-bucket-change.yaml
        - error:
            file: resources/storagebackend-tamossref-change.yaml
