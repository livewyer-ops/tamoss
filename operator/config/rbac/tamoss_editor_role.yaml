# permissions for end users to edit tamosses.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: operator
    app.kubernetes.io/managed-by: kustomize
  name: tamoss-editor-role
rules:
- apiGroups:
  - tamoss.livewyer.io
  resources:
  - tamosses
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - tamoss.livewyer.io
  resources:
  - tamosses/status
  verbs:
  - get
