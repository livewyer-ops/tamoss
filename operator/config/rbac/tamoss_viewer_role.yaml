# permissions for end users to view tamosses.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: operator
    app.kubernetes.io/managed-by: kustomize
  name: tamoss-viewer-role
rules:
- apiGroups:
  - tamoss.livewyer.io
  resources:
  - tamosses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - tamoss.livewyer.io
  resources:
  - tamosses/status
  verbs:
  - get
