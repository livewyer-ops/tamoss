apiVersion: v1
kind: Service
metadata:
  annotations:
    tamoss.livewyer.io/metrics-path: /metrics
    tamoss.livewyer.io/metrics-port: "8443"
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: operator
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager-metrics-service
  namespace: system
spec:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: https
  selector:
    control-plane: controller-manager
