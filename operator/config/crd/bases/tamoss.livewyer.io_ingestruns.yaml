---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: ingestruns.tamoss.livewyer.io
spec:
  group: tamoss.livewyer.io
  names:
    kind: IngestRun
    listKind: IngestRunList
    plural: ingestruns
    shortNames:
    - ir
    singular: ingestrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tamossRef.name
      name: Tamoss
      type: string
    - jsonPath: .spec.profile
      name: Profile
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.jobRef.name
      name: Job
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          IngestRun is a durable request to ingest media through an operator-owned
          Tamsin Job template.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              credentialProfileRef:
                properties:
                  name:
                    description: |-
                      Name selects an operator-approved profile belonging to the target
                      Tamoss. It does not name a Kubernetes Secret directly.
                    maxLength: 63
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              desiredState:
                default: Running
                description: |-
                  DesiredState provides one-way declarative cancellation. Retrying creates
                  a new IngestRun so completed history remains immutable.
                enum:
                - Running
                - Cancelled
                type: string
              inputRef:
                description: InputRef is resolved through the approved server-side
                  input boundary.
                properties:
                  id:
                    description: ID is opaque outside the Console API and operator
                      input resolver.
                    maxLength: 128
                    minLength: 1
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                    type: string
                  kind:
                    enum:
                    - StagedObject
                    - Manifest
                    - ApprovedS3
                    - ApprovedHTTP
                    type: string
                required:
                - id
                - kind
                type: object
              options:
                properties:
                  concurrency:
                    description: |-
                      Concurrency bounds simultaneous input ingests. Zero selects the
                      operator-owned default for the requested size class.
                    format: int32
                    maximum: 32
                    minimum: 0
                    type: integer
                  dryRun:
                    default: false
                    description: DryRun performs the render and Object plan without
                      changing TAMS.
                    type: boolean
                  maxInputs:
                    default: 1000
                    description: MaxInputs bounds manifest and approved-prefix expansion.
                    format: int32
                    maximum: 10000
                    minimum: 1
                    type: integer
                  storageBackendRef:
                    description: |-
                      StorageBackendRef selects a Ready, media-purpose StorageBackend belonging
                      to spec.tamossRef. Empty uses the TAMS instance's default backend.
                    properties:
                      name:
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  verify:
                    default: true
                    description: Verify downloads and verifies uploaded Object bytes.
                    type: boolean
                type: object
              profile:
                default: editorial@1
                description: Profile is a versioned Tamsin ingest profile.
                enum:
                - preserve@1
                - editorial@1
                - streaming-ts@1
                type: string
              retryOf:
                properties:
                  name:
                    minLength: 1
                    type: string
                  uid:
                    description: |-
                      UID prevents a replacement object with the same name from becoming the
                      retry parent.
                    minLength: 1
                    type: string
                required:
                - name
                - uid
                type: object
              sizeClass:
                default: standard
                description: |-
                  SizeClass selects an operator-owned resource and staging budget. Users
                  cannot supply arbitrary Pod resources.
                enum:
                - small
                - standard
                - large
                type: string
              tamossRef:
                description: TamossRef identifies the instance that will receive the
                  media.
                properties:
                  name:
                    minLength: 1
                    type: string
                type: object
            required:
            - inputRef
            - tamossRef
            type: object
            x-kubernetes-validations:
            - message: spec.tamossRef.name is required
              rule: has(self.tamossRef) && has(self.tamossRef.name) && self.tamossRef.name.size()
                > 0
            - message: spec.tamossRef.name is immutable
              rule: self.tamossRef.name == oldSelf.tamossRef.name
            - message: spec.inputRef is immutable
              rule: self.inputRef == oldSelf.inputRef
            - message: spec.profile is immutable
              rule: self.profile == oldSelf.profile
            - message: spec.sizeClass is immutable
              rule: self.sizeClass == oldSelf.sizeClass
            - message: spec.options is immutable
              rule: self.options == oldSelf.options
            - message: spec.credentialProfileRef is immutable
              rule: has(self.credentialProfileRef) == has(oldSelf.credentialProfileRef)
                && (!has(self.credentialProfileRef) || self.credentialProfileRef ==
                oldSelf.credentialProfileRef)
            - message: spec.retryOf is immutable
              rule: has(self.retryOf) == has(oldSelf.retryOf) && (!has(self.retryOf)
                || self.retryOf == oldSelf.retryOf)
            - message: a cancelled run cannot be restarted; create a retry instead
              rule: oldSelf.desiredState != 'Cancelled' || self.desiredState == 'Cancelled'
          status:
            properties:
              attempt:
                format: int32
                type: integer
              completedAt:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              jobRef:
                properties:
                  name:
                    type: string
                  uid:
                    description: |-
                      UID is a type that holds unique ID values, including UUIDs.  Because we
                      don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                      intent and helps make sure that UIDs and names do not get conflated.
                    type: string
                type: object
              lastEventSequence:
                format: int64
                type: integer
              observedGeneration:
                format: int64
                type: integer
              phase:
                enum:
                - Pending
                - Queued
                - Running
                - Succeeded
                - PartiallySucceeded
                - Failed
                - Cancelled
                type: string
              progress:
                properties:
                  bytesUploaded:
                    format: int64
                    type: integer
                  inputsCompleted:
                    format: int32
                    type: integer
                  inputsFailed:
                    format: int32
                    type: integer
                  inputsSucceeded:
                    format: int32
                    type: integer
                  inputsTotal:
                    format: int32
                    type: integer
                type: object
              resultRef:
                properties:
                  key:
                    description: Key is a durable, non-presigned artifact reference.
                    maxLength: 1024
                    minLength: 1
                    type: string
                  mediaType:
                    maxLength: 255
                    minLength: 1
                    type: string
                  sha256:
                    pattern: ^[a-f0-9]{64}$
                    type: string
                  size:
                    format: int64
                    minimum: 1
                    type: integer
                  verified:
                    description: |-
                      Verified is set only after the operator-side collector has read the
                      durable artifact and matched its SHA-256 digest and size.
                    type: boolean
                type: object
                x-kubernetes-validations:
                - message: a verified result requires a key, SHA-256 digest, positive
                    size, and media type
                  rule: '!has(self.verified) || !self.verified || (has(self.key) &&
                    has(self.sha256) && has(self.size) && self.size > 0 && has(self.mediaType))'
              startedAt:
                format: date-time
                type: string
              tamsinRunId:
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
