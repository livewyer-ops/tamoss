---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: ingestruns.tamoss.livewyer.io
spec:
  group: tamoss.livewyer.io
  names:
    kind: IngestRun
    listKind: IngestRunList
    plural: ingestruns
    shortNames:
    - ir
    singular: ingestrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tamossRef.name
      name: Tamoss
      type: string
    - jsonPath: .spec.profile
      name: Profile
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.jobRef.name
      name: Job
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          IngestRun is a durable request to ingest media through an operator-owned
          TAMSin Job template.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              desiredState:
                default: Running
                description: |-
                  DesiredState provides one-way declarative cancellation. Retrying creates
                  a new IngestRun so completed history remains immutable.
                enum:
                - Running
                - Cancelled
                type: string
              input:
                description: |-
                  Input is validated against the target Tamoss source policy immediately
                  before the operator creates the TAMSin Job.
                properties:
                  kind:
                    enum:
                    - HTTP
                    - S3
                    type: string
                  sourceRef:
                    properties:
                      name:
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                    required:
                    - name
                    type: object
                  uri:
                    maxLength: 2048
                    minLength: 1
                    type: string
                required:
                - kind
                - uri
                type: object
              options:
                properties:
                  concurrency:
                    description: |-
                      Concurrency bounds simultaneous input ingests. Zero selects the
                      operator-owned default for the requested size class.
                    format: int32
                    maximum: 32
                    minimum: 0
                    type: integer
                  dryRun:
                    default: false
                    description: DryRun performs the render and Object plan without
                      changing TAMS.
                    type: boolean
                  maxInputs:
                    default: 1000
                    description: MaxInputs bounds manifest and source-prefix expansion.
                    format: int32
                    maximum: 10000
                    minimum: 1
                    type: integer
                  storageBackendRef:
                    description: |-
                      StorageBackendRef selects a Ready, media-purpose StorageBackend belonging
                      to spec.tamossRef. Unset uses the TAMS instance's default backend. This is
                      a pointer because encoding/json never omits a struct value, and an omitted
                      reference must not serialise as an empty name that fails admission.
                    properties:
                      name:
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  tamsFlowProfiles:
                    description: |-
                      TAMSFlowProfiles assigns service-owned TAMS 8.2 Flow Profiles to the
                      essence streams produced by TAMSin.
                    items:
                      description: |-
                        IngestRunTAMSFlowProfile assigns an immutable TAMS 8.2 Flow Profile to one
                        essence stream produced by TAMSin. It is separate from the TAMSin treatment
                        selected by spec.profile.
                      properties:
                        format:
                          enum:
                          - video
                          - audio
                          - image
                          - data
                          type: string
                        index:
                          default: 0
                          description: Index selects the zero-based stream of the
                            requested essence format.
                          format: int32
                          maximum: 255
                          minimum: 0
                          type: integer
                        profileID:
                          description: ProfileID is the canonical UUID of an externally
                            managed TAMS Flow Profile.
                          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                          type: string
                        profileRef:
                          description: |-
                            ProfileRef selects an operator-managed FlowProfile. The controller resolves
                            the Ready resource to an immutable TAMS UUID before creating the TAMSin Job.
                          properties:
                            name:
                              description: Name selects a Ready FlowProfile in the
                                IngestRun namespace.
                              maxLength: 253
                              minLength: 1
                              type: string
                          required:
                          - name
                          type: object
                      required:
                      - format
                      - index
                      type: object
                      x-kubernetes-validations:
                      - message: exactly one of profileID or profileRef is required
                        rule: has(self.profileID) != has(self.profileRef)
                    maxItems: 64
                    type: array
                    x-kubernetes-list-map-keys:
                    - format
                    - index
                    x-kubernetes-list-type: map
                  verify:
                    default: true
                    description: Verify downloads and verifies uploaded Object bytes.
                    type: boolean
                type: object
              output:
                description: |-
                  Output is optional human-facing metadata for the Flow graph produced from
                  one input. It is immutable and requires options.maxInputs=1 so one intent
                  cannot ambiguously name several input graphs.
                properties:
                  flowMetadata:
                    description: |-
                      IngestRunFlowMetadata is a deliberately constrained subset of TAMS Flow
                      metadata. TAMSin applies it to every Flow in the generated graph without
                      exposing its general JSON override or technical media fields through the
                      Kubernetes API.
                    properties:
                      description:
                        description: |-
                          Description is the longer human-readable description applied to generated
                          Flows.
                        maxLength: 4096
                        minLength: 1
                        type: string
                      label:
                        description: Label is the short human-readable name applied
                          to generated Flows.
                        maxLength: 256
                        minLength: 1
                        type: string
                      tags:
                        additionalProperties:
                          x-kubernetes-preserve-unknown-fields: true
                        description: |-
                          Tags accepts the TAMS string-or-string-array value union. The controller
                          rejects reserved _tamsin_ keys and values outside that union before it
                          creates a Job.
                        maxProperties: 32
                        type: object
                    type: object
                required:
                - flowMetadata
                type: object
              profile:
                default: essence-segments@1
                description: Profile is a versioned TAMSin ingest profile.
                enum:
                - preserve@1
                - demux@1
                - muxed-segments@1
                - essence-segments@1
                - mpegts-segments@1
                type: string
              retryOf:
                properties:
                  name:
                    minLength: 1
                    type: string
                  uid:
                    description: |-
                      UID prevents a replacement object with the same name from becoming the
                      retry parent.
                    minLength: 1
                    type: string
                required:
                - name
                - uid
                type: object
              sizeClass:
                default: standard
                description: |-
                  SizeClass selects an operator-owned resource and staging budget. Users
                  cannot supply arbitrary Pod resources.
                enum:
                - small
                - standard
                - large
                type: string
              tamossRef:
                description: TamossRef identifies the instance that will receive the
                  media.
                properties:
                  name:
                    minLength: 1
                    type: string
                type: object
            required:
            - input
            - tamossRef
            type: object
            x-kubernetes-validations:
            - message: spec.tamossRef.name is required
              rule: has(self.tamossRef) && has(self.tamossRef.name) && self.tamossRef.name.size()
                > 0
            - message: spec.tamossRef.name is immutable
              rule: self.tamossRef.name == oldSelf.tamossRef.name
            - message: spec.input is immutable
              rule: self.input == oldSelf.input
            - message: spec.profile is immutable
              rule: self.profile == oldSelf.profile
            - message: spec.sizeClass is immutable
              rule: self.sizeClass == oldSelf.sizeClass
            - message: spec.options is immutable
              rule: has(self.options) == has(oldSelf.options) && (!has(self.options)
                || self.options == oldSelf.options)
            - message: spec.output is immutable
              rule: has(self.output) == has(oldSelf.output) && (!has(self.output)
                || self.output == oldSelf.output)
            - message: spec.output requires spec.options.maxInputs to equal 1
              rule: '!has(self.output) || (has(self.options) && self.options.maxInputs
                == 1)'
            - message: spec.retryOf is immutable
              rule: has(self.retryOf) == has(oldSelf.retryOf) && (!has(self.retryOf)
                || self.retryOf == oldSelf.retryOf)
            - message: a cancelled run cannot be restarted; create a retry instead
              rule: oldSelf.desiredState != 'Cancelled' || self.desiredState == 'Cancelled'
          status:
            properties:
              attempt:
                format: int32
                type: integer
              completedAt:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              jobRef:
                properties:
                  name:
                    type: string
                  uid:
                    description: |-
                      UID is a type that holds unique ID values, including UUIDs.  Because we
                      don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                      intent and helps make sure that UIDs and names do not get conflated.
                    type: string
                type: object
              lastEventSequence:
                format: int64
                type: integer
              observedGeneration:
                format: int64
                type: integer
              output:
                description: |-
                  IngestRunOutputStatus contains only identities from TAMSin's validated event
                  stream. It never discovers results by listing TAMS resources after a run.
                properties:
                  memberFlows:
                    items:
                      properties:
                        format:
                          maxLength: 128
                          type: string
                        id:
                          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                          type: string
                        role:
                          maxLength: 64
                          type: string
                      required:
                      - id
                      type: object
                    maxItems: 16
                    type: array
                  memberFlowsTruncated:
                    type: boolean
                  rootFlowID:
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                    type: string
                  sourceID:
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                    type: string
                required:
                - rootFlowID
                - sourceID
                type: object
              phase:
                enum:
                - Pending
                - Queued
                - Running
                - Succeeded
                - PartiallySucceeded
                - Failed
                - Cancelled
                type: string
              progress:
                properties:
                  bytesUploaded:
                    format: int64
                    type: integer
                  inputsCompleted:
                    format: int32
                    type: integer
                  inputsFailed:
                    format: int32
                    type: integer
                  inputsSucceeded:
                    format: int32
                    type: integer
                  inputsTotal:
                    format: int32
                    type: integer
                type: object
              resolvedSource:
                properties:
                  name:
                    type: string
                  policyDigest:
                    description: |-
                      PolicyDigest identifies the immutable operator validation snapshot which
                      admitted the Job without exposing selectors, endpoints or credentials.
                    pattern: ^[a-f0-9]{64}$
                    type: string
                type: object
              resolvedTamsFlowProfiles:
                items:
                  properties:
                    format:
                      enum:
                      - video
                      - audio
                      - image
                      - data
                      type: string
                    index:
                      format: int32
                      maximum: 255
                      minimum: 0
                      type: integer
                    profileID:
                      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                      type: string
                    profileRef:
                      type: string
                  required:
                  - format
                  - index
                  - profileID
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - format
                - index
                x-kubernetes-list-type: map
              resultRef:
                properties:
                  key:
                    description: Key is a durable, non-presigned artifact reference.
                    maxLength: 1024
                    minLength: 1
                    type: string
                  mediaType:
                    maxLength: 255
                    minLength: 1
                    type: string
                  sha256:
                    pattern: ^[a-f0-9]{64}$
                    type: string
                  size:
                    format: int64
                    minimum: 1
                    type: integer
                  verified:
                    description: |-
                      Verified is set only after the operator-side collector has read the
                      durable artifact and matched its SHA-256 digest and size.
                    type: boolean
                type: object
                x-kubernetes-validations:
                - message: a verified result requires a key, SHA-256 digest, positive
                    size, and media type
                  rule: '!has(self.verified) || !self.verified || (has(self.key) &&
                    has(self.sha256) && has(self.size) && self.size > 0 && has(self.mediaType))'
              startedAt:
                format: date-time
                type: string
              tamsinRunId:
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
