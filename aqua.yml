---
# aqua - Declarative CLI Version Manager
# https://aquaproj.github.io/
#
# Pinned development tools required to build, test, and deploy TAMOSS from
# a developer workstation. Install aqua (https://aquaproj.github.io/docs/install)
# and then run `aqua install` from the repo root.
#
# Each entry below lists the repo directive, file, or task step that uses the
# local pin. CI workflows and container builds may pin their own runtimes where
# those environments need different packaging or base images.
#
registries:
    - type: standard
      ref: v4.562.0

packages:
    # Core dev tools
    - name: go-task/task@v3.53.1 # Taskfile.yaml / .tasks/*.yaml
    - name: astral-sh/uv@0.12.15 # src/pyproject.toml, uv.lock, every `task test:*`
    - name: cli/cli@v2.101.0 # gh CLI for PR/issue management from dev machines

    # Kubernetes / deploy tooling
    - name: kubernetes-sigs/kind@v0.33.0 # .tasks/kind.yaml
      tags:
          - ci-kind
          - ci-operator-chainsaw
    - name: kubernetes/kubectl@v1.36.4 # .tasks/kind.yaml (`kubectl wait pod ...`)
      tags:
          - ci-kind
          - ci-operator-chainsaw
    - name: helm/helm@v4.3.0 # .tasks/operator.yaml and Helmfile platform releases
      tags:
          - ci-kind
          - ci-operator-chainsaw
    - name: helmfile/helmfile@v1.8.0 # deploy/platform/helmfile.yaml.gotmpl
      tags:
          - ci-kind
          - ci-operator-chainsaw
    - name: kyverno/chainsaw@v0.2.15 # operator/test/chainsaw
      tags:
          - ci-operator-chainsaw
    - name: golang/go@go1.27.1 # operator/go.mod and controller builds
      tags:
          - ci-security
    - name: yannh/kubeconform@v0.8.0 # generated operator CRD/install manifest linting
      tags:
          - ci-operator-crd
    - name: stackrox/kube-linter@v0.8.3 # operator install manifest and pod security linting
      tags:
          - ci-operator-security
    - name: grafana/k6@v2.2.0 # optional load-test CLI

    # Cloud & storage
    - name: aws/aws-cli@2.36.46 # S3-compatible storage diagnostics
    - name: google/osv-scanner@v2.6.0 # .tasks/security.yaml security:audit:osv
      tags:
          - ci-security

    # Languages & runtimes
    - name: nodejs/node@v26.8.2 # frontend local npm scripts
    # uv manages the Python 3.14 toolchain used by CI and the API container.
    # Go is pinned with Kubernetes tooling above because only the operator uses it.

    # Linting / formatting / data
    - name: google/yamlfmt@v0.21.0 # .tasks/lint.yaml (lint:yamlfmt)
    - name: rhysd/actionlint@v1.7.12 # .tasks/lint.yaml (lint:actions)
      tags:
          - ci-validate
    - name: mikefarah/yq@v4.53.6 # .tasks/lib/profile.sh and platform dependency checks
      tags:
          - ci-kind
          - ci-validate
    - name: BurntSushi/ripgrep@15.2.0 # shell task checks and CI workflow validation
      tags:
          - ci-validate
    - name: jqlang/jq@jq-1.8.2 # JSON inspection and local diagnostics

# Notes: aqua cannot provide these OS/system tools.
# Required to build, test, and deploy:
# - Docker or Podman (and docker compose) — container build + compose stack
# - curl, git                             — setup and local scripts
# Required for deployed playback tests:
# - ffmpeg (including ffprobe)            — prepares and inspects media fixtures
# Optional, only for the ingest helper (src/scripts/ingest_video.sh):
# - uuidgen (util-linux)                  — generates flow and source identifiers
