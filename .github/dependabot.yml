version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/src"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/src/app/frontend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "helm"
    directory: "/deploy/charts/tams"
    schedule:
      interval: "weekly"
  - package-ecosystem: "helm"
    directory: "/deploy/charts/tams-stack"
    schedule:
      interval: "weekly"
  - package-ecosystem: "helm"
    directory: "/deploy/charts/tams-platform"
    schedule:
      interval: "weekly"
  # Helmfile-managed cluster-service chart versions live in
  # deploy/targets/{kind,remote}/values.yaml and are not updated by Dependabot's
  # Helm ecosystem. Review those pins manually when updating deployment
  # dependencies; see CONTRIBUTING.md.
  - package-ecosystem: "docker"
    directories:
      - "/src/app/tamoss"
      - "/src/app/frontend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
