version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/src"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/src/app/frontend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directories:
      - "/src/app/tamoss"
      - "/src/app/frontend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
