name: Build TAMOSS Image
description: Build and optionally publish and sign one TAMOSS image.

inputs:
  component:
    description: Docker Hub image name and independent build cache scope.
    required: true
  context:
    description: Docker build context.
    default: .
  file:
    description: Dockerfile path.
    required: true
  build-args:
    description: Component-specific Docker build arguments.
    default: ""
  push:
    description: Publish and sign the image only for trusted workflow events.
    default: "false"
  dockerhub-username:
    description: Docker Hub username, required when publishing.
    default: ""
  dockerhub-token:
    description: Docker Hub token, required when publishing.
    default: ""

outputs:
  digest:
    description: Built image digest.
    value: ${{ steps.build.outputs.digest }}

# Keep signing in the caller's job so its OIDC workflow identity is unchanged.
runs:
  using: composite
  steps:
    - name: Derive PR head image tag
      id: pr-head-tag
      shell: bash
      env:
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        if [ -n "$PR_HEAD_SHA" ]; then
          echo "tag=type=raw,value=sha-${PR_HEAD_SHA::7}" >> "$GITHUB_OUTPUT"
        fi

    - name: Extract Git metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
      with:
        images: livewyer/${{ inputs.component }}
        tags: |
          type=schedule
          type=ref,event=branch
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=ref,event=pr
          type=sha,prefix=sha-
          ${{ steps.pr-head-tag.outputs.tag }}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Login to Docker Hub
      if: inputs.push == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

    - name: Install cosign
      if: inputs.push == 'true'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Build and push to Docker Hub
      id: build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        push: ${{ inputs.push == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: ${{ inputs.build-args }}
        platforms: linux/amd64,linux/arm64
        provenance: mode=max
        sbom: true
        cache-from: type=gha,scope=${{ inputs.component }}
        cache-to: type=gha,mode=max,scope=${{ inputs.component }}

    - name: Sign image with cosign (keyless)
      if: inputs.push == 'true'
      shell: bash
      env:
        TAGS: ${{ steps.meta.outputs.tags }}
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        for tag in ${TAGS}; do
          cosign sign --yes "${tag}@${DIGEST}"
        done
