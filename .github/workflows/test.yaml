name: Tests

on:
  pull_request:
  workflow_dispatch:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  python-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install Task
        uses: ./.github/actions/setup-task

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install the project
        run: uv sync --project src --locked --all-extras --dev

      - name: Run fast local Python tests
        run: task test:fast

      - name: Upload fast Python reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: python-fast-reports-${{ github.run_id }}
          path: reports/**
          retention-days: 30
          if-no-files-found: warn

      - name: Fast Python test summary
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.0.0
        if: always()
        with:
          paths: reports/junit-py-fast.xml

  tams-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install Task
        uses: ./.github/actions/setup-task

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install the project
        run: uv sync --project src --locked --all-extras --dev

      - name: Run TAMS OpenAPI contract tests
        run: task test:tams:contract

      - name: Upload TAMS contract reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: tams-contract-reports-${{ github.run_id }}
          path: reports/**
          retention-days: 30
          if-no-files-found: warn

      - name: TAMS contract summary
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.0.0
        if: always()
        with:
          paths: reports/junit-*.xml

  tams-semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install Task
        uses: ./.github/actions/setup-task

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install the project
        run: uv sync --project src --locked --all-extras --dev

      - name: Run TAMS semantic workflow tests
        run: task test:tams:semantics

      - name: Upload TAMS semantic reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: tams-semantics-reports-${{ github.run_id }}
          path: reports/**
          retention-days: 30
          if-no-files-found: warn

      - name: TAMS semantic summary
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.0.0
        if: always()
        with:
          paths: reports/junit-*.xml

  workers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install Task
        uses: ./.github/actions/setup-task

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install the project
        run: uv sync --project src --locked --all-extras --dev

      - name: Run worker tests
        run: task test:workers

      - name: Upload worker reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: worker-reports-${{ github.run_id }}
          path: reports/**
          retention-days: 30
          if-no-files-found: warn

      - name: Worker test summary
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.0.0
        if: always()
        with:
          paths: reports/junit-*.xml

  adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install Task
        uses: ./.github/actions/setup-task

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install the project
        run: uv sync --project src --locked --all-extras --dev

      - name: Start adapter dependencies
        run: task deps

      - name: Run adapter tests
        run: task test:adapters

      - name: Stop adapter dependencies
        if: always()
        run: COMPOSE_FILE=deploy/compose/docker-compose.yaml docker compose down --volumes

      - name: Upload adapter reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: adapter-reports-${{ github.run_id }}
          path: reports/**
          retention-days: 30
          if-no-files-found: warn

      - name: Adapter test summary
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.0.0
        if: always()
        with:
          paths: reports/junit-*.xml

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Task
        uses: ./.github/actions/setup-task

      - name: Set up Node.js
        uses: ./.github/actions/setup-node
        with:
          cache: npm
          cache-dependency-path: src/app/frontend/package-lock.json

      - name: Run frontend tests
        run: task test:frontend

      - name: Upload frontend reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frontend-reports-${{ github.run_id }}
          path: reports/**
          retention-days: 30
          if-no-files-found: warn

      - name: Frontend test summary
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.0.0
        if: always()
        with:
          paths: reports/junit-frontend-unit.xml

  media-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Task
        uses: ./.github/actions/setup-task

      - name: Run media fixture tests
        run: task test:media:fixtures

      - name: Upload media fixture reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: media-fixture-reports-${{ github.run_id }}
          path: reports/**
          retention-days: 30
          if-no-files-found: warn

      - name: Media fixture test summary
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.0.0
        if: always()
        with:
          paths: reports/junit-media-fixtures.xml
