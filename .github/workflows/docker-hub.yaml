name: Docker Hub
on:
  push:
    branches:
      - main
    tags:
      - "*.*.*"
  pull_request:
    branches-ignore:
      - "dependabot/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Push images for trusted release/internal PR branches so deploy tests can
  # consume pr-* and sha-* tags. Forked public PRs remain build-only because
  # Docker Hub credentials must not be exposed to untrusted workflow code.
  PUSH_IMAGES: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository) }}

jobs:
  tamoss-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # id-token: write is required for cosign keyless signing (Fulcio OIDC).
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Git Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Derive PR head image tag
        id: pr-head-tag
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PR_HEAD_SHA" ]; then
            echo "tag=type=raw,value=sha-${PR_HEAD_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve operator build metadata
        id: build-version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            python3 .github/scripts/release-metadata.py "${version}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
            echo "schema_revision=dev" >> "$GITHUB_OUTPUT"
            echo "tams_api=8.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Git metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: livewyer/tamoss-api
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=ref,event=pr
            type=sha,prefix=sha-
            ${{ steps.pr-head-tag.outputs.tag }}
            # set latest tag for default branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to Docker Hub
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Install cosign
        if: env.PUSH_IMAGES == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build and push to Docker Hub
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: src/app/tamoss/Dockerfile
          push: ${{ env.PUSH_IMAGES == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build-version.outputs.version }}
            SCHEMA_VERSION=${{ steps.build-version.outputs.schema_revision }}
            TAMS_API_VERSION=${{ steps.build-version.outputs.tams_api }}
          platforms: "linux/amd64,linux/arm64"
          provenance: mode=max
          sbom: true
          # Keep API and UI build caches independent.
          cache-from: type=gha,scope=tamoss-api
          cache-to: type=gha,mode=max,scope=tamoss-api

      - name: Sign image with cosign (keyless)
        if: env.PUSH_IMAGES == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for tag in ${TAGS}; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

  tamoss-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Git Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Derive PR head image tag
        id: pr-head-tag
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PR_HEAD_SHA" ]; then
            echo "tag=type=raw,value=sha-${PR_HEAD_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Git metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: livewyer/tamoss-ui
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=ref,event=pr
            type=sha,prefix=sha-
            ${{ steps.pr-head-tag.outputs.tag }}
            # set latest tag for default branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to Docker Hub
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Install cosign
        if: env.PUSH_IMAGES == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build and push to Docker Hub
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: src/app/frontend
          file: src/app/frontend/Dockerfile
          push: ${{ env.PUSH_IMAGES == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: "linux/amd64,linux/arm64"
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=tamoss-ui
          cache-to: type=gha,mode=max,scope=tamoss-ui

      - name: Sign image with cosign (keyless)
        if: env.PUSH_IMAGES == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for tag in ${TAGS}; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

  tamoss-operator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Git Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Derive PR head image tag
        id: pr-head-tag
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PR_HEAD_SHA" ]; then
            echo "tag=type=raw,value=sha-${PR_HEAD_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve build version
        id: build-version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            python3 .github/scripts/release-metadata.py "${version}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
            echo "schema_revision=dev" >> "$GITHUB_OUTPUT"
            echo "previous_schema_revision=" >> "$GITHUB_OUTPUT"
            echo "tams_api=8.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Git metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: livewyer/tamoss-operator
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=ref,event=pr
            type=sha,prefix=sha-
            ${{ steps.pr-head-tag.outputs.tag }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to Docker Hub
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Install cosign
        if: env.PUSH_IMAGES == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build and push to Docker Hub
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: operator/Dockerfile
          push: ${{ env.PUSH_IMAGES == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build-version.outputs.version }}
            SCHEMA_VERSION=${{ steps.build-version.outputs.schema_revision }}
            PREVIOUS_SCHEMA_VERSION=${{ steps.build-version.outputs.previous_schema_revision }}
            TAMS_API_VERSION=${{ steps.build-version.outputs.tams_api }}
            OPERAND_VERSION=${{ steps.build-version.outputs.version }}
          platforms: "linux/amd64,linux/arm64"
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=tamoss-operator
          cache-to: type=gha,mode=max,scope=tamoss-operator

      - name: Sign image with cosign (keyless)
        if: env.PUSH_IMAGES == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for tag in ${TAGS}; do
            cosign sign --yes "${tag}@${DIGEST}"
          done
