name: Docker Hub
on:
  push:
    branches:
      - main
    tags:
      - "*.*.*"
  pull_request:
    branches-ignore:
      - "dependabot/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  # Push images for trusted release/internal PR branches so deploy tests can
  # consume pr-* and sha-* tags. Forked public PRs remain build-only because
  # Docker Hub credentials must not be exposed to untrusted workflow code.
  PUSH_IMAGES: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository) }}

jobs:
  release-preflight:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate immutable release target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/release-metadata.py "${GITHUB_REF_NAME#v}"
          python3 .github/scripts/release-preflight.py

  release-tests:
    if: github.ref_type == 'tag'
    needs: [release-preflight]
    uses: ./.github/workflows/test.yaml
    permissions:
      contents: read
      actions: read

  release-operator-tests:
    if: github.ref_type == 'tag'
    needs: [release-preflight]
    uses: ./.github/workflows/operator-ci.yaml
    permissions:
      contents: read
      actions: read

  release-kind-e2e:
    if: github.ref_type == 'tag'
    needs: [release-preflight]
    uses: ./.github/workflows/kind-e2e-run.yaml
    permissions:
      contents: read
      packages: read
      actions: read
    with:
      artifact-name: release-kind-e2e-${{ github.run_id }}
      retention-days: 90
      summary-title: Release commit Kind E2E
      summary-description: Builds and tests the exact tagged source commit before publication.

  # A tag build is the only path that produces a versioned release, and nothing
  # previously security-scanned the tree it was cut from. Non-tag builds skip
  # this: pull requests are already covered by validate.yaml, and :main images
  # are not a released artefact.
  dependency-audit:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/dependency-audit.yaml
    permissions:
      contents: read
      security-events: write
      actions: read

  tamoss-api:
    needs: [dependency-audit, release-preflight]
    if: ${{ !cancelled() && (github.ref_type != 'tag' || (needs.dependency-audit.result == 'success' && needs.release-preflight.result == 'success')) }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # id-token: write is required for cosign keyless signing (Fulcio OIDC).
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve operator build metadata
        id: build-version
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            python3 .github/scripts/release-metadata.py "${version}" >> "$GITHUB_OUTPUT"
          else
            # Non-tag builds publish images tagged after the ref (:main for
            # mainline pushes, :pr-N for internal PRs), so bake that same tag
            # as the version instead of "dev". The TAMS API version comes from
            # the newest compatibility release rather than a hard-coded value,
            # which is how branch builds previously went stale at 8.0.
            if [ -n "${PR_NUMBER}" ]; then
              version="pr-${PR_NUMBER}"
            else
              version="$(printf '%s' "${GITHUB_REF_NAME}" | sed 's![^a-zA-Z0-9._-]!-!g')"
            fi
            tams_api="$(python3 -c 'import json; print(json.load(open("operator/compatibility.yaml"))["releases"][-1]["tamsAPI"])')"
            {
              echo "version=${version}"
              echo "schema_revision=dev"
              echo "tams_api=${tams_api}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build, publish and sign image
        id: build
        uses: ./.github/actions/build-image
        with:
          component: tamoss-api
          file: src/app/tamoss/Dockerfile
          push: ${{ env.PUSH_IMAGES }}
          dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          build-args: |
            VERSION=${{ steps.build-version.outputs.version }}
            SCHEMA_VERSION=${{ steps.build-version.outputs.schema_revision }}
            TAMS_API_VERSION=${{ steps.build-version.outputs.tams_api }}

  tamoss-ui:
    needs: [dependency-audit, release-preflight]
    if: ${{ !cancelled() && (github.ref_type != 'tag' || (needs.dependency-audit.result == 'success' && needs.release-preflight.result == 'success')) }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build, publish and sign image
        id: build
        uses: ./.github/actions/build-image
        with:
          component: tamoss-ui
          context: src/app/frontend
          file: src/app/frontend/Dockerfile
          push: ${{ env.PUSH_IMAGES }}
          dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

  tamoss-console-api:
    needs: [dependency-audit, release-preflight]
    if: ${{ !cancelled() && (github.ref_type != 'tag' || (needs.dependency-audit.result == 'success' && needs.release-preflight.result == 'success')) }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build, publish and sign image
        id: build
        uses: ./.github/actions/build-image
        with:
          component: tamoss-console-api
          file: operator/Dockerfile.console-api
          push: ${{ env.PUSH_IMAGES }}
          dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

  tamoss-operator:
    needs: [dependency-audit, release-preflight]
    if: ${{ !cancelled() && (github.ref_type != 'tag' || (needs.dependency-audit.result == 'success' && needs.release-preflight.result == 'success')) }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve build version
        id: build-version
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            python3 .github/scripts/release-metadata.py "${version}" >> "$GITHUB_OUTPUT"
          else
            # Non-tag builds publish images tagged after the ref (:main for
            # mainline pushes, :pr-N for internal PRs), so bake that same tag
            # as the version instead of "dev": OPERAND_VERSION then defaults
            # operands to images this workflow actually publishes. The TAMS
            # API version comes from the newest compatibility release rather
            # than a hard-coded value, which is how branch builds previously
            # went stale at 8.0. The schema revision stays on the "dev"
            # development marker because branch builds are not a released
            # schema.
            if [ -n "${PR_NUMBER}" ]; then
              version="pr-${PR_NUMBER}"
            else
              version="$(printf '%s' "${GITHUB_REF_NAME}" | sed 's![^a-zA-Z0-9._-]!-!g')"
            fi
            tams_api="$(python3 -c 'import json; print(json.load(open("operator/compatibility.yaml"))["releases"][-1]["tamsAPI"])')"
            {
              echo "version=${version}"
              echo "schema_revision=dev"
              echo "previous_schema_revision="
              echo "tams_api=${tams_api}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build, publish and sign image
        id: build
        uses: ./.github/actions/build-image
        with:
          component: tamoss-operator
          file: operator/Dockerfile
          push: ${{ env.PUSH_IMAGES }}
          dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          build-args: |
            VERSION=${{ steps.build-version.outputs.version }}
            SCHEMA_VERSION=${{ steps.build-version.outputs.schema_revision }}
            PREVIOUS_SCHEMA_VERSION=${{ steps.build-version.outputs.previous_schema_revision }}
            TAMS_API_VERSION=${{ steps.build-version.outputs.tams_api }}
            OPERAND_VERSION=${{ steps.build-version.outputs.version }}

  release-assets:
    if: github.ref_type == 'tag'
    needs:
      - dependency-audit
      - release-preflight
      - release-tests
      - release-operator-tests
      - release-kind-e2e
      - tamoss-api
      - tamoss-ui
      - tamoss-console-api
      - tamoss-operator
    uses: ./.github/workflows/operator-release.yaml
    permissions:
      contents: write
    with:
      api-digest: ${{ needs.tamoss-api.outputs.digest }}
      ui-digest: ${{ needs.tamoss-ui.outputs.digest }}
      console-api-digest: ${{ needs.tamoss-console-api.outputs.digest }}
      operator-digest: ${{ needs.tamoss-operator.outputs.digest }}
