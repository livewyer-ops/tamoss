name: Chart Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Validate release ref
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::Chart releases must run from a version tag."
            exit 1
          fi
          case "${GITHUB_REF_NAME}" in
            *.*.*) ;;
            *)
              echo "::error::Chart release tag must match *.*.*."
              exit 1
              ;;
          esac

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.18.6

      - name: Update chart versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          charts = [
              Path("deploy/charts/tams-stack/Chart.yaml"),
              Path("deploy/charts/tams/Chart.yaml"),
              Path("deploy/charts/tams-platform/Chart.yaml"),
          ]

          for chart in charts:
              lines = chart.read_text().splitlines()
              for index, line in enumerate(lines):
                  if line.startswith("version:"):
                      lines[index] = f"version: {version}"
                  elif line.startswith("appVersion:"):
                      lines[index] = f'appVersion: "{version}"'
              chart.write_text("\n".join(lines) + "\n")

          stack_chart = Path("deploy/charts/tams-stack/Chart.yaml")
          lines = stack_chart.read_text().splitlines()
          dependency = None
          for index, line in enumerate(lines):
              stripped = line.strip()
              if stripped.startswith("- name: "):
                  dependency = stripped.split(":", 1)[1].strip()
              elif dependency in {"tams", "tams-platform"} and stripped.startswith("version:"):
                  indent = line[: len(line) - len(line.lstrip())]
                  lines[index] = f"{indent}version: {version}"
          stack_chart.write_text("\n".join(lines) + "\n")
          PY

      - name: Package Helm chart
        run: |
          helm dependency update deploy/charts/tams-stack

          helm package deploy/charts/tams-stack -d deploy/charts/tams-stack/

      - name: Log in to GitHub Container Registry for Helm
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin

      - name: Push Helm chart to GHCR
        run: |
          helm push deploy/charts/tams-stack/tams-stack-${{ steps.version.outputs.version }}.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            deploy/charts/tams-stack/tams-stack-${{ steps.version.outputs.version }}.tgz
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
