name: Reusable Kind E2E

on:
  workflow_call:
    inputs:
      artifact-name:
        required: true
        type: string
      retention-days:
        required: true
        type: number
      summary-title:
        required: true
        type: string
      summary-description:
        required: true
        type: string

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Git Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Resolve Helmfile version
        id: aqua-versions
        run: echo "helmfile=$(python3 .github/scripts/aqua-version.py helmfile/helmfile)" >> "$GITHUB_OUTPUT"

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.46.4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install project
        run: uv sync --project src --locked --all-extras --dev

      - name: Install browser runtime
        run: uv run --project src playwright install --with-deps chromium

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.18.6

      - name: Cache helmfile binary
        id: bincache
        uses: actions/cache@v5
        with:
          path: ~/.local/bin/helmfile
          key: ${{ runner.os }}-bin-helmfile${{ steps.aqua-versions.outputs.helmfile }}

      - name: Install Helmfile (cache miss)
        if: steps.bincache.outputs.cache-hit != 'true'
        env:
          HELMFILE_VERSION: ${{ steps.aqua-versions.outputs.helmfile }}
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o helmfile.tar.gz "https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz"
          tar -xzf helmfile.tar.gz helmfile
          install helmfile "$HOME/.local/bin/helmfile"

      - name: Export binary PATH + verify
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/helmfile" --version

      - name: Create Kind cluster
        run: task kind:create KUBECONFIG=tams.kubeconfig

      - name: Deploy to Kind
        run: task deploy:kind KUBECONFIG=tams.kubeconfig

      - name: Run deployed suite
        run: task test:deployed DEPLOY_ENV=kind KUBECONFIG=tams.kubeconfig

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.artifact-name }}
          path: reports/**
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: warn

      - name: Summarize E2E results
        if: always()
        env:
          SUMMARY_TITLE: ${{ inputs.summary-title }}
          SUMMARY_DESCRIPTION: ${{ inputs.summary-description }}
        run: |
          {
            printf '## %s\n\n' "$SUMMARY_TITLE"
            printf '%s\n' "$SUMMARY_DESCRIPTION"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test Summary
        uses: test-summary/action@v2
        with:
          paths: reports/junit-*.xml
        if: always()
