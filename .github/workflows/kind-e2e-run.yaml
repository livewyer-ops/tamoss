name: Kind E2E Run

on:
  workflow_call:
    inputs:
      artifact-name:
        required: true
        type: string
      retention-days:
        required: true
        type: number
      summary-title:
        required: true
        type: string
      summary-description:
        required: true
        type: string

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          submodules: true

      - name: Install Task
        uses: ./.github/actions/setup-task

      - name: Install aqua tools
        uses: ./.github/actions/setup-aqua
        with:
          tags: ci-kind

      - name: Show Kubernetes tool versions
        run: |
          kind version
          kubectl version --client=true

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install project
        run: uv sync --project src --locked --all-extras --dev

      - name: Install browser runtime
        run: uv run --project src playwright install --with-deps chromium

      - name: Run Kind E2E gate
        run: task kind:e2e PROFILE=local-kind KUBECONFIG=tams.kubeconfig KIND_SUMMARY=false

      - name: Capture Kind diagnostics
        if: failure() || cancelled()
        run: |
          python3 scripts/support_bundle.py \
            --kubeconfig tams.kubeconfig \
            --namespace tams \
            --operator-namespace tamoss-system \
            --additional-namespace auth \
            --additional-namespace cert-manager \
            --additional-namespace cnpg-system \
            --additional-namespace rustfs-system \
            --additional-namespace traefik \
            --output-root reports/kind-support || true

      - name: Upload test reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ inputs.artifact-name }}
          path: reports/**
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: warn

      - name: Summarize E2E results
        if: always()
        env:
          SUMMARY_TITLE: ${{ inputs.summary-title }}
          SUMMARY_DESCRIPTION: ${{ inputs.summary-description }}
        run: |
          {
            printf '## %s\n\n' "$SUMMARY_TITLE"
            printf '%s\n' "$SUMMARY_DESCRIPTION"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test Summary
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.0.0
        with:
          paths: reports/junit-*.xml
        if: always()

      - name: Delete Kind cluster
        if: always()
        run: kind delete cluster --name tams || true
