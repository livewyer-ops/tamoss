name: Kind E2E Run

on:
  workflow_call:
    inputs:
      artifact-name:
        required: true
        type: string
      retention-days:
        required: true
        type: number
      summary-title:
        required: true
        type: string
      summary-description:
        required: true
        type: string

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          submodules: true

      - name: Install Task
        uses: ./.github/actions/setup-task

      - name: Install aqua tools
        uses: ./.github/actions/setup-aqua
        with:
          tags: ci-kind

      - name: Show Kubernetes tool versions
        run: |
          kind version
          kubectl version --client=true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install project
        run: uv sync --project src --locked --all-extras --dev

      - name: Install browser runtime
        run: uv run --project src playwright install --with-deps chromium

      - name: Run Kind E2E gate
        run: task kind:e2e PROFILE=local-kind KUBECONFIG=tams.kubeconfig KIND_SUMMARY=false

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.artifact-name }}
          path: reports/**
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: warn

      - name: Summarize E2E results
        if: always()
        env:
          SUMMARY_TITLE: ${{ inputs.summary-title }}
          SUMMARY_DESCRIPTION: ${{ inputs.summary-description }}
        run: |
          {
            printf '## %s\n\n' "$SUMMARY_TITLE"
            printf '%s\n' "$SUMMARY_DESCRIPTION"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test Summary
        uses: test-summary/action@v2
        with:
          paths: reports/junit-*.xml
        if: always()

      - name: Delete Kind cluster
        if: always()
        run: kind delete cluster --name tams || true
