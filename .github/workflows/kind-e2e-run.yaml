name: Kind E2E Run

on:
  workflow_call:
    inputs:
      artifact-name:
        required: true
        type: string
      retention-days:
        required: true
        type: number
      summary-title:
        required: true
        type: string
      summary-description:
        required: true
        type: string

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Git Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          submodules: true

      - name: Resolve tool versions
        id: aqua-versions
        run: |
          echo "kind=$(python3 .github/scripts/aqua-version.py kubernetes-sigs/kind)" >> "$GITHUB_OUTPUT"
          echo "kubectl=$(python3 .github/scripts/aqua-version.py kubernetes/kubectl)" >> "$GITHUB_OUTPUT"
          echo "helm=$(python3 .github/scripts/aqua-version.py helm/helm)" >> "$GITHUB_OUTPUT"
          echo "helmfile=$(python3 .github/scripts/aqua-version.py helmfile/helmfile)" >> "$GITHUB_OUTPUT"
          echo "yq=$(python3 .github/scripts/aqua-version.py mikefarah/yq)" >> "$GITHUB_OUTPUT"

      - name: Install Task
        uses: ./.github/actions/setup-task

      - name: Install Kind, kubectl, Helm, Helmfile, and yq
        env:
          HELM_VERSION: ${{ steps.aqua-versions.outputs.helm }}
          HELMFILE_VERSION: ${{ steps.aqua-versions.outputs.helmfile }}
          KIND_VERSION: ${{ steps.aqua-versions.outputs.kind }}
          KUBECTL_VERSION: ${{ steps.aqua-versions.outputs.kubectl }}
          YQ_VERSION: ${{ steps.aqua-versions.outputs.yq }}
        run: |
          curl -fsSL -o kind "https://kind.sigs.k8s.io/dl/v${KIND_VERSION}/kind-linux-amd64"
          sudo install kind /usr/local/bin/kind
          curl -fsSL -o kubectl "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo install kubectl /usr/local/bin/kubectl
          .github/scripts/install-aqua-tool.sh helm "${HELM_VERSION}"
          .github/scripts/install-aqua-tool.sh helmfile "${HELMFILE_VERSION}"
          .github/scripts/install-aqua-tool.sh yq "${YQ_VERSION}"
          kind version
          kubectl version --client=true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install project
        run: uv sync --project src --locked --all-extras --dev

      - name: Install browser runtime
        run: uv run --project src playwright install --with-deps chromium

      - name: Run Kind E2E gate
        run: task kind:e2e PROFILE=local-kind KUBECONFIG=tams.kubeconfig KIND_SUMMARY=false

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.artifact-name }}
          path: reports/**
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: warn

      - name: Summarize E2E results
        if: always()
        env:
          SUMMARY_TITLE: ${{ inputs.summary-title }}
          SUMMARY_DESCRIPTION: ${{ inputs.summary-description }}
        run: |
          {
            printf '## %s\n\n' "$SUMMARY_TITLE"
            printf '%s\n' "$SUMMARY_DESCRIPTION"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test Summary
        uses: test-summary/action@v2
        with:
          paths: reports/junit-*.xml
        if: always()

      - name: Delete Kind cluster
        if: always()
        run: kind delete cluster --name tams || true
