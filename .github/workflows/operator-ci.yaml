name: Operator CI

on:
  pull_request:
  workflow_dispatch:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  operator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Git Checkout
        uses: actions/checkout@v6

      - name: Resolve tool versions
        id: aqua-versions
        run: |
          echo "go=$(python3 .github/scripts/aqua-version.py golang/go | sed 's/^go//')" >> "$GITHUB_OUTPUT"
          echo "kubeconform=$(python3 .github/scripts/aqua-version.py yannh/kubeconform)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.aqua-versions.outputs.go }}
          cache-dependency-path: operator/go.sum

      - name: Install Task
        uses: ./.github/actions/setup-task

      - name: Build operator
        run: task operator:build

      - name: Test operator
        run: task operator:test

      - name: Check generated manifests
        run: |
          task operator:manifests
          task operator:install-manifest
          git diff --exit-code -- operator/api operator/config operator/go.mod operator/go.sum deploy/operator/install.yaml

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: ${{ steps.aqua-versions.outputs.kubeconform }}
        run: |
          curl -fsSL -o kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Lint generated CRDs
        run: kubeconform -strict -ignore-missing-schemas -summary operator/config/crd/bases/*.yaml

  operator-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Git Checkout
        uses: actions/checkout@v6

      - name: Resolve tool versions
        id: aqua-versions
        run: |
          echo "go=$(python3 .github/scripts/aqua-version.py golang/go | sed 's/^go//')" >> "$GITHUB_OUTPUT"
          echo "kube_linter=$(python3 .github/scripts/aqua-version.py stackrox/kube-linter)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.aqua-versions.outputs.go }}
          cache-dependency-path: operator/go.sum

      - name: Install Task
        uses: ./.github/actions/setup-task

      - name: Install kube-linter
        env:
          KUBE_LINTER_VERSION: ${{ steps.aqua-versions.outputs.kube_linter }}
        run: .github/scripts/install-aqua-tool.sh kube-linter "${KUBE_LINTER_VERSION}"

      - name: Lint operator manifests
        run: task operator:security-lint

  operator-kind-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Git Checkout
        uses: actions/checkout@v6

      - name: Resolve tool versions
        id: aqua-versions
        run: |
          echo "kind=$(python3 .github/scripts/aqua-version.py kubernetes-sigs/kind)" >> "$GITHUB_OUTPUT"
          echo "kubectl=$(python3 .github/scripts/aqua-version.py kubernetes/kubectl)" >> "$GITHUB_OUTPUT"
          echo "helm=$(python3 .github/scripts/aqua-version.py helm/helm)" >> "$GITHUB_OUTPUT"

      - name: Install Kind, kubectl, and Helm
        env:
          HELM_VERSION: ${{ steps.aqua-versions.outputs.helm }}
          KIND_VERSION: ${{ steps.aqua-versions.outputs.kind }}
          KUBECTL_VERSION: ${{ steps.aqua-versions.outputs.kubectl }}
        run: |
          curl -fsSL -o kind "https://kind.sigs.k8s.io/dl/v${KIND_VERSION}/kind-linux-amd64"
          sudo install kind /usr/local/bin/kind
          curl -fsSL -o kubectl "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo install kubectl /usr/local/bin/kubectl
          .github/scripts/install-aqua-tool.sh helm "${HELM_VERSION}"
          kind version
          kubectl version --client=true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Smoke test operator on Kind (${{ matrix.arch }})
        run: bash .github/scripts/operator-kind-smoke.sh "${{ matrix.arch }}"

  operator-chainsaw-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Git Checkout
        uses: actions/checkout@v6

      - name: Resolve tool versions
        id: aqua-versions
        run: |
          echo "go=$(python3 .github/scripts/aqua-version.py golang/go | sed 's/^go//')" >> "$GITHUB_OUTPUT"
          echo "kind=$(python3 .github/scripts/aqua-version.py kubernetes-sigs/kind)" >> "$GITHUB_OUTPUT"
          echo "kubectl=$(python3 .github/scripts/aqua-version.py kubernetes/kubectl)" >> "$GITHUB_OUTPUT"
          echo "helm=$(python3 .github/scripts/aqua-version.py helm/helm)" >> "$GITHUB_OUTPUT"
          echo "chainsaw=$(python3 .github/scripts/aqua-version.py kyverno/chainsaw)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.aqua-versions.outputs.go }}
          cache-dependency-path: operator/go.sum

      - name: Install Task
        uses: ./.github/actions/setup-task

      - name: Install Kind, kubectl, and Helm
        env:
          HELM_VERSION: ${{ steps.aqua-versions.outputs.helm }}
          KIND_VERSION: ${{ steps.aqua-versions.outputs.kind }}
          KUBECTL_VERSION: ${{ steps.aqua-versions.outputs.kubectl }}
        run: |
          curl -fsSL -o kind "https://kind.sigs.k8s.io/dl/v${KIND_VERSION}/kind-linux-amd64"
          sudo install kind /usr/local/bin/kind
          curl -fsSL -o kubectl "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo install kubectl /usr/local/bin/kubectl
          .github/scripts/install-aqua-tool.sh helm "${HELM_VERSION}"
          kind version
          kubectl version --client=true

      - name: Install chainsaw
        env:
          CHAINSAW_VERSION: ${{ steps.aqua-versions.outputs.chainsaw }}
        run: .github/scripts/install-aqua-tool.sh chainsaw "${CHAINSAW_VERSION}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4
        with:
          platforms: amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Run chainsaw suite
        env:
          CHAINSAW_CLUSTER_NAME: tamoss-chainsaw-ci
          CHAINSAW_KEEP_CLUSTER: "true"
          CHAINSAW_INSTALL_RUSTFS_OPERATOR: ${{ vars.CHAINSAW_INSTALL_RUSTFS_OPERATOR || 'false' }}
          CHAINSAW_INSTALL_CNPG_OPERATOR: ${{ vars.CHAINSAW_INSTALL_CNPG_OPERATOR || 'false' }}
          KUBECONFIG: ${{ runner.temp }}/tamoss-chainsaw-ci.kubeconfig
          OPERATOR_IMAGE: livewyer/tamoss-operator:chainsaw-${{ github.sha }}
        run: task operator:e2e:chainsaw:ci:up

      - name: Capture chainsaw diagnostics
        if: failure()
        env:
          KUBECONFIG: ${{ runner.temp }}/tamoss-chainsaw-ci.kubeconfig
        run: .github/scripts/collect-chainsaw-diagnostics.sh reports/chainsaw-logs

      - name: Upload chainsaw reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: operator-chainsaw-e2e-${{ github.run_id }}
          path: |
            reports/junit-operator-chainsaw.xml
            reports/chainsaw-logs/**
          retention-days: 30
          if-no-files-found: ignore

      - name: Write chainsaw summary
        if: always()
        run: |
          {
            echo "## Operator chainsaw e2e"
            echo
            echo "- Result: ${{ job.status }}"
            echo "- Report: reports/junit-operator-chainsaw.xml"
            echo "- Diagnostics: reports/chainsaw-logs/"
          } >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("reports/junit-operator-chainsaw.xml")
          if not report.exists():
              print("- Cases: report not found")
              raise SystemExit(0)

          root = ET.parse(report).getroot()
          suites = [root] if root.tag == "testsuite" else root.findall(".//testsuite")
          tests = sum(int(suite.get("tests", "0") or 0) for suite in suites)
          failures = sum(int(suite.get("failures", "0") or 0) for suite in suites)
          errors = sum(int(suite.get("errors", "0") or 0) for suite in suites)
          skipped = sum(int(suite.get("skipped", "0") or 0) for suite in suites)
          seconds = sum(float(suite.get("time", "0") or 0) for suite in suites)

          print(f"- Cases: {tests} total, {failures + errors} failed/errors, {skipped} skipped")
          print(f"- Duration: {seconds:.1f}s reported by JUnit")
          PY

      - name: Publish chainsaw JUnit summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: reports/junit-operator-chainsaw.xml
          show: all

      - name: Delete Kind cluster
        if: always()
        run: kind delete cluster --name tamoss-chainsaw-ci || true
