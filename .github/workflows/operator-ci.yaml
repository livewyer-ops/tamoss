name: Operator CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  operator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Git Checkout
        uses: actions/checkout@v6

      - name: Resolve tool versions
        id: aqua-versions
        run: echo "go=$(python3 .github/scripts/aqua-version.py golang/go | sed 's/^go//')" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.aqua-versions.outputs.go }}
          cache-dependency-path: operator/go.sum

      - name: Install Task
        uses: ./.github/actions/setup-task

      - name: Build operator
        run: task operator:build

      - name: Test operator
        run: task operator:test

      - name: Check generated manifests
        run: |
          task operator:manifests
          task operator:install-manifest
          git diff --exit-code -- operator/api operator/config operator/go.mod operator/go.sum deploy/operator/install.yaml

      - name: Install aqua tools
        uses: ./.github/actions/setup-aqua
        with:
          tags: ci-operator-crd

      - name: Lint generated CRDs
        run: kubeconform -strict -ignore-missing-schemas -summary operator/config/crd/bases/*.yaml

  operator-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Git Checkout
        uses: actions/checkout@v6

      - name: Resolve tool versions
        id: aqua-versions
        run: echo "go=$(python3 .github/scripts/aqua-version.py golang/go | sed 's/^go//')" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.aqua-versions.outputs.go }}
          cache-dependency-path: operator/go.sum

      - name: Install Task
        uses: ./.github/actions/setup-task

      - name: Install aqua tools
        uses: ./.github/actions/setup-aqua
        with:
          tags: ci-operator-security

      - name: Lint operator manifests
        run: task operator:security-lint

  operator-chainsaw-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CHAINSAW_CLUSTER_NAME: tamoss-chainsaw-ci
      CHAINSAW_KEEP_CLUSTER: "true"
      CHAINSAW_INSTALL_RUSTFS_OPERATOR: ${{ vars.CHAINSAW_INSTALL_RUSTFS_OPERATOR || 'false' }}
      CHAINSAW_INSTALL_CNPG_OPERATOR: ${{ vars.CHAINSAW_INSTALL_CNPG_OPERATOR || 'false' }}
      KUBECONFIG: .local/tamoss-chainsaw-ci.kubeconfig
      OPERATOR_IMAGE: livewyer/tamoss-operator:chainsaw-${{ github.sha }}
    steps:
      - name: Git Checkout
        uses: actions/checkout@v6

      - name: Resolve tool versions
        id: aqua-versions
        run: |
          echo "go=$(python3 .github/scripts/aqua-version.py golang/go | sed 's/^go//')" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.aqua-versions.outputs.go }}
          cache-dependency-path: operator/go.sum

      - name: Install Task
        uses: ./.github/actions/setup-task

      - name: Install aqua tools
        uses: ./.github/actions/setup-aqua
        with:
          tags: ci-operator-chainsaw

      - name: Show Kubernetes tool versions
        run: |
          kind version
          kubectl version --client=true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4
        with:
          platforms: amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Run chainsaw smoke suite
        if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci/full-operator-e2e') }}
        run: |
          echo "CHAINSAW_SUITE=smoke" >> "$GITHUB_ENV"
          task operator:e2e:chainsaw:smoke:up

      - name: Run full chainsaw suite
        if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci/full-operator-e2e') }}
        run: task operator:e2e:chainsaw:ci:up

      - name: Capture chainsaw diagnostics
        if: failure() || cancelled()
        run: .github/scripts/collect-chainsaw-diagnostics.sh reports/chainsaw-logs

      - name: Upload chainsaw reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: operator-chainsaw-e2e-${{ github.run_id }}
          path: |
            reports/junit-operator-chainsaw.xml
            reports/chainsaw-logs/**
          retention-days: 30
          if-no-files-found: ignore

      - name: Write chainsaw summary
        if: always()
        run: |
          {
            echo "## Operator chainsaw e2e"
            echo
            echo "- Result: ${{ job.status }}"
            echo "- Suite: ${CHAINSAW_SUITE:-full}"
            echo "- Full suite label: ci/full-operator-e2e"
            echo "- Report: reports/junit-operator-chainsaw.xml"
            echo "- Diagnostics: reports/chainsaw-logs/"
          } >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("reports/junit-operator-chainsaw.xml")
          if not report.exists():
              print("- Cases: report not found")
              raise SystemExit(0)

          root = ET.parse(report).getroot()
          suites = [root] if root.tag == "testsuite" else root.findall(".//testsuite")
          tests = sum(int(suite.get("tests", "0") or 0) for suite in suites)
          failures = sum(int(suite.get("failures", "0") or 0) for suite in suites)
          errors = sum(int(suite.get("errors", "0") or 0) for suite in suites)
          skipped = sum(int(suite.get("skipped", "0") or 0) for suite in suites)
          seconds = sum(float(suite.get("time", "0") or 0) for suite in suites)

          print(f"- Cases: {tests} total, {failures + errors} failed/errors, {skipped} skipped")
          print(f"- Duration: {seconds:.1f}s reported by JUnit")
          PY

      - name: Publish chainsaw JUnit summary
        if: always() && hashFiles('reports/junit-operator-chainsaw.xml') != ''
        uses: test-summary/action@v2
        with:
          paths: reports/junit-operator-chainsaw.xml
          show: all

      - name: Delete Kind cluster
        if: always()
        run: kind delete cluster --name tamoss-chainsaw-ci || true
