name: Operator Release Assets

on:
  workflow_call:
    inputs:
      api-digest:
        required: true
        type: string
      ui-digest:
        required: true
        type: string
      console-api-digest:
        required: true
        type: string
      operator-digest:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve tool versions
        id: aqua-versions
        run: echo "go=$(python3 .github/scripts/aqua-version.py golang/go | sed 's/^go//')" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.aqua-versions.outputs.go }}
          cache-dependency-path: operator/go.sum

      - name: Validate release ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::Operator release assets must run from a version tag."
            exit 1
          fi
          case "${GITHUB_REF_NAME}" in
            *.*.*) ;;
            *)
              echo "::error::Operator release tag must match *.*.*."
              exit 1
              ;;
          esac
          python3 .github/scripts/release-preflight.py

      - name: Resolve release metadata
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          python3 .github/scripts/release-metadata.py "${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify release assets are current
        run: |
          make -C operator install-manifest
          git diff --exit-code -- deploy/operator/install.yaml
          git diff --exit-code -- operator/api operator/config operator/go.mod operator/go.sum

      - name: Build release install manifest
        shell: bash
        env:
          OPERATOR_DIGEST: ${{ inputs.operator-digest }}
        run: |
          mkdir -p dist/operator-release
          cat > dist/operator-release/kustomization.yaml <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - ../../operator/config/default
          images:
            - name: livewyer/tamoss-operator
              newName: livewyer/tamoss-operator
              digest: ${OPERATOR_DIGEST}
          EOF
          kustomize_bins=(operator/bin/kustomize-v*)
          KUSTOMIZE_BIN="${kustomize_bins[0]}"
          "$KUSTOMIZE_BIN" build dist/operator-release > dist/operator-release/install.yaml

      - name: Record immutable release contents
        env:
          API_DIGEST: ${{ inputs.api-digest }}
          UI_DIGEST: ${{ inputs.ui-digest }}
          CONSOLE_API_DIGEST: ${{ inputs.console-api-digest }}
          OPERATOR_DIGEST: ${{ inputs.operator-digest }}
        run: |
          SOURCE_COMMIT="$(git rev-parse HEAD)" \
          BBC_TAMS_COMMIT="$(git rev-parse HEAD:src/vendor/bbc-tams)" \
          python3 .github/scripts/release-record.py --output dist/operator-release/release.json

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/operator-release/install.yaml
            operator/compatibility.yaml
            dist/operator-release/release.json
          draft: true
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          make_latest: ${{ steps.version.outputs.prerelease == 'true' && 'false' || 'legacy' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
