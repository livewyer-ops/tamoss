name: Kind End to End

on:
  pull_request:
  workflow_dispatch:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  kind-e2e:
    uses: ./.github/workflows/kind-e2e-run.yaml
    with:
      artifact-name: kind-test-reports-${{ github.run_id }}
      retention-days: 30
      summary-title: Kind E2E Results
      summary-description: Cluster workflow recreates Kind, runs deployed pytest E2E through ingress, and validates an in-place operator upgrade. See junit reports in the uploaded artifact.

  kind:
    runs-on: ubuntu-latest
    needs: kind-e2e
    if: ${{ always() }}
    steps:
      - name: Confirm Kind E2E passed
        run: |
          if [ "${{ needs.kind-e2e.result }}" != "success" ]; then
            echo "Kind E2E completed with result: ${{ needs.kind-e2e.result }}"
            exit 1
          fi
          echo "Kind E2E completed successfully"
