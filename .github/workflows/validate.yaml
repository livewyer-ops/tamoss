name: Validate

on:
  pull_request:
  workflow_dispatch:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # access to check out code and install dependencies
  actions: read

jobs:
  operator-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.35.0

      - name: Install Task
        uses: ./.github/actions/setup-task

      - name: Install aqua tools
        uses: ./.github/actions/setup-aqua
        with:
          tags: ci-validate

      - name: Render operator install
        run: task operator:template >/tmp/tamoss-operator.yaml

      - name: Validate operator monitoring overlay
        run: task operator:monitoring:check

  workflow-surface:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.35.0

      - name: Install Task
        uses: ./.github/actions/setup-task

      - name: Install aqua tools
        uses: ./.github/actions/setup-aqua
        with:
          tags: ci-validate

      - name: Lint workflows
        run: task lint:actions

      - name: Check workflow task names
        run: |
          if grep -R -nE 'task (up|down|e2e|profiles:e2e)([[:space:]]|$)' .github; then
            echo "::error::GitHub workflows must use kind:* task names for local Kind workflows."
            exit 1
          fi

      - name: Check release metadata
        run: python3 .github/scripts/release-metadata.py --validate

      - name: Render remote environment overlay
        run: |
          environment="ci-single-server"
          rm -rf "deploy/environments/${environment}"
          task env:init NAME="${environment}" PROFILE=single-server DOMAIN=tamoss.example.com
          kubectl kustomize "deploy/environments/${environment}" >/tmp/tamoss-${environment}.yaml

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Run Pre-commit
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0

      - name: Install Task
        uses: ./.github/actions/setup-task

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install project
        run: uv sync --project src --locked --all-extras --dev

      - name: Run Ruff on full tree
        run: task lint:ruff:lint

      - name: Run shell syntax lint
        run: task lint:shell

      - name: Verify OpenAPI reproducibility
        run: task openapi:check

      - name: Generate TAMS conformance inventory report
        run: task test:tams:inventory

      - name: Upload TAMS conformance inventory report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tams-conformance-inventory-report
          path: reports/tams-conformance-inventory.md
          if-no-files-found: error

  python-strict-mypy:
    name: Python strict opt-in mypy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Task
        uses: ./.github/actions/setup-task

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install project
        run: uv sync --project src --locked --all-extras --dev

      - name: Run strict opt-in mypy
        run: task lint:mypy

  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Set up Node.js
        uses: ./.github/actions/setup-node
        with:
          cache: npm
          cache-dependency-path: src/app/frontend/package-lock.json

      - name: Install Dependencies
        run: cd src/app/frontend && npm ci

      - name: ESLint
        run: cd src/app/frontend && npm run lint

      - name: TypeScript type checking
        run: cd src/app/frontend && npm run typecheck

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # SARIF upload needs Code Scanning and workflow-run metadata access.
      security-events: write
      actions: read
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install project
        run: uv sync --project src --locked --all-extras --dev

      - name: Ensure reports dir exists
        run: mkdir -p reports

      - name: OSV-Scanner filesystem scan
        id: osv-scanner
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          scan-args: |-
            --recursive
            --experimental-exclude=src/vendor/bbc-tams/examples
            --format=sarif
            --output-file=reports/osv-scanner.sarif
            ./

      - name: Upload OSV-Scanner SARIF to Code Scanning
        if: always() && vars.ENABLE_CODE_SCANNING_UPLOAD == 'true' && steps.osv-scanner.conclusion != 'skipped'
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: reports/osv-scanner.sarif
          category: osv-scanner

      - name: Archive OSV-Scanner SARIF as workflow artifact
        if: always() && steps.osv-scanner.conclusion != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-scanner-sarif
          path: reports/osv-scanner.sarif
          if-no-files-found: warn
          retention-days: 30

      - name: Audit Python dependencies (pip-audit)
        # Audit the locked dependency set through the OSV service: auditing
        # the installed environment queries PyPI's JSON API per package
        # (including the private project name), which fails the job whenever
        # that API wobbles.
        run: |
          uv export --project src --frozen --no-emit-project --output-file reports/requirements-audit.txt
          uv run --project src --with pip-audit pip-audit -s osv --no-deps -r reports/requirements-audit.txt

      - name: Audit frontend dependencies (npm audit)
        run: |
          cd src/app/frontend
          npm audit --audit-level=high --omit=dev
